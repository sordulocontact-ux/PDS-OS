# Environnement de dev et de tests d'intégration : Postgres 18 + Valkey.
# `docker compose -f docker-compose.dev.yml up -d`
# Même version majeure de Postgres que la prod. Change 18 → 19 quand ta prod y passe.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      # Rendre les timeouts "prod-like" dès le dev pour attraper les transactions qui traînent
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=200 # log des requêtes > 200 ms
      - -c
      - idle_in_transaction_session_timeout=30000
      - -c
      - lock_timeout=5000
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"] # cache pur, pas de persistance
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
