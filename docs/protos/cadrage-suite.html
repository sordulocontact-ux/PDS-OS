<title>Cadrage de Néons</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@500;600;700&display=swap">
<style>
/* Tokens recopiés de app/globals.css (thème sombre d'abord, comme la maquette Figma 304:20801).
   Coquille : rail d'icônes, navigation du projet, barre du haut de 55 px avec le fil, puis
   « Parcours · Cadrage » à gauche et l'étape ouverte à droite. */
:root{
  --text-primary:#ededed;--text-secondary:#a8a8a8;--text-tertiary:#8f8f8f;--text-muted:#5e5e5e;
  --surface-app:#0a0a0a;--surface-page:#0a0a0a;--surface-raised:#161616;--surface-soft:rgb(255 255 255 / .05);
  --surface-sunken:rgb(255 255 255 / .08);--surface-inset:#0a0a0a;--surface-pressed:rgb(255 255 255 / .12);
  --border-hairline:rgb(255 255 255 / .08);--border-default:rgb(255 255 255 / .12);--border-hover:rgb(255 255 255 / .28);
  --border-field:rgb(255 255 255 / .14);
  --nav-bg:#0f0f0f;--nav-fg:#ededed;--nav-fg-muted:#8f8f8f;--nav-item-hover-bg:rgb(255 255 255 / .05);
  --nav-item-active-bg:rgb(255 255 255 / .09);--nav-border:rgb(255 255 255 / .08);--nav-brand-bg:#ededed;--nav-brand-fg:#000;
  --tone-neutral-bg:#262626;--tone-neutral-fg:#d4d4d4;--tone-info-bg:#12233d;--tone-info-fg:#9ec5ff;
  --tone-warning-bg:#33260c;--tone-warning-fg:#f5c869;--tone-success-bg:#0f2e1c;--tone-success-fg:#7fdca0;
  --tone-danger-bg:#3a1616;--tone-danger-fg:#ff9b94;
  --selection:#3b7bff;--selection-fg:#6f9dff;--selection-bg:rgb(59 123 255 / .16);
  --primary-bg:#ededed;--primary-fg:#000;--primary-hover:#d4d4d4;--control-hover:rgb(255 255 255 / .06);
  --glass:rgb(28 28 28 / .86);--glass-fg:#fff;--glass-2:#b5b5b5;
  --font:"Google Sans Flex",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --bar:55px;--ease:cubic-bezier(.23,1,.32,1);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --text-primary:#000;--text-secondary:#5e5e5e;--text-tertiary:#767676;--text-muted:#afafaf;
  --surface-app:#fbfbfb;--surface-page:#fff;--surface-raised:#fff;--surface-soft:#f4f4f4;--surface-sunken:#ececec;
  --surface-inset:#fbfbfb;--surface-pressed:#e2e2e2;
  --border-hairline:#ececec;--border-default:#d4d4d4;--border-hover:#afafaf;--border-field:#dcdcdc;
  --nav-bg:#fff;--nav-fg:#000;--nav-fg-muted:#767676;--nav-item-hover-bg:#f4f4f4;--nav-item-active-bg:#ececec;
  --nav-border:rgb(0 0 0 / .08);--nav-brand-bg:#000;--nav-brand-fg:#fff;
  --tone-neutral-bg:#ececec;--tone-neutral-fg:#111;--tone-info-bg:#e2eefc;--tone-info-fg:#0b3d8c;
  --tone-warning-bg:#fcefd2;--tone-warning-fg:#6e4300;--tone-success-bg:#daf3e2;--tone-success-fg:#0d5226;
  --tone-danger-bg:#fce1df;--tone-danger-fg:#9a1b1b;
  --selection:#155dfc;--selection-fg:#155dfc;--selection-bg:rgb(21 93 252 / .07);
  --primary-bg:#000;--primary-fg:#fff;--primary-hover:#282828;--control-hover:#f4f4f4;
  color-scheme:light}}
:root[data-theme="light"]{
  --text-primary:#000;--text-secondary:#5e5e5e;--text-tertiary:#767676;--text-muted:#afafaf;
  --surface-app:#fbfbfb;--surface-page:#fff;--surface-raised:#fff;--surface-soft:#f4f4f4;--surface-sunken:#ececec;
  --surface-inset:#fbfbfb;--surface-pressed:#e2e2e2;
  --border-hairline:#ececec;--border-default:#d4d4d4;--border-hover:#afafaf;--border-field:#dcdcdc;
  --nav-bg:#fff;--nav-fg:#000;--nav-fg-muted:#767676;--nav-item-hover-bg:#f4f4f4;--nav-item-active-bg:#ececec;
  --nav-border:rgb(0 0 0 / .08);--nav-brand-bg:#000;--nav-brand-fg:#fff;
  --tone-neutral-bg:#ececec;--tone-neutral-fg:#111;--tone-info-bg:#e2eefc;--tone-info-fg:#0b3d8c;
  --tone-warning-bg:#fcefd2;--tone-warning-fg:#6e4300;--tone-success-bg:#daf3e2;--tone-success-fg:#0d5226;
  --tone-danger-bg:#fce1df;--tone-danger-fg:#9a1b1b;
  --selection:#155dfc;--selection-fg:#155dfc;--selection-bg:rgb(21 93 252 / .07);
  --primary-bg:#000;--primary-fg:#fff;--primary-hover:#282828;--control-hover:#f4f4f4;
  color-scheme:light}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font);font-weight:500;font-size:16px;line-height:24px;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;letter-spacing:inherit;color:inherit}
h1,h2,h3,h4,p,dl,dd,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--selection);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Coquille */
.shell{display:flex;min-height:100dvh}
.rail{position:sticky;top:0;height:100dvh;width:68px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 12px;background:var(--nav-bg);border-right:1px solid var(--nav-border)}
.brand{width:40px;height:40px;border-radius:12px;background:var(--nav-brand-bg);color:var(--nav-brand-fg);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:-.02em}
.ri{width:40px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--nav-fg);border:0;background:none}
.ri[aria-current="page"]{background:var(--nav-item-active-bg)}
.rail .sep{flex:1}
.av{width:28px;height:28px;border-radius:50%;background:var(--surface-sunken);color:var(--text-primary);display:inline-grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:0;flex-shrink:0}
.pnav{position:sticky;top:0;height:100dvh;width:196px;flex-shrink:0;display:flex;flex-direction:column;background:var(--nav-bg);border-right:1px solid var(--nav-border);overflow-y:auto}
.pswitch{display:flex;align-items:center;justify-content:space-between;height:var(--bar);padding:0 12px 0 18px;border-bottom:1px solid var(--nav-border);font-weight:500}
.pnav ul{display:flex;flex-direction:column;gap:2px;padding:10px 8px}
.pnav .grp{padding:14px 10px 4px;font-size:13px;line-height:18px;color:var(--nav-fg-muted)}
.pnav a{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px;color:var(--nav-fg);text-decoration:none;cursor:default}
.pnav a[aria-current="page"]{background:var(--nav-item-active-bg)}
.pnav .dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);flex-shrink:0}
.pnav .dot.on{background:var(--selection)}
.pnav .count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--selection);color:#fff;font-size:12px;line-height:20px;text-align:center;font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--bar);display:flex;align-items:center;gap:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--border-hairline);background:var(--surface-page)}
.menu{display:none}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;color:var(--text-tertiary)}
.crumbs li{white-space:nowrap}
.crumbs li:last-child{color:var(--text-primary);overflow:hidden;text-overflow:ellipsis}
.crumbs button{border:0;background:none;padding:0;color:inherit;cursor:pointer}
.content{padding-block:28px 140px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1180px}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.headrow h1{font-size:30px;line-height:36px;letter-spacing:-.04em;font-weight:500}
.cols{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}

/* Parcours */
.spine{border:1px solid var(--border-hairline);border-radius:16px;background:var(--surface-raised);padding:14px 10px 10px}
.spine h2{font-size:15px;line-height:22px;font-weight:500;color:var(--text-secondary);padding:0 10px 8px}
.srow{position:relative;display:flex;gap:12px;width:100%;padding:8px 10px;border:0;border-radius:10px;background:none;text-align:left;cursor:pointer}
.srow[aria-current="step"]{background:var(--surface-soft)}
.srow:not(:last-child)::after{content:"";position:absolute;left:21px;top:34px;bottom:-6px;width:1px;background:var(--border-default)}
.sic{width:22px;height:22px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;margin-top:1px;position:relative;z-index:1;background:var(--surface-raised)}
.sic.cur{background:var(--selection);box-shadow:0 0 0 3px var(--selection-bg)}
.sic.cur::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.sic.done{background:var(--tone-success-bg);color:var(--tone-success-fg)}
.sic.lock{border:1px dashed var(--border-hover);color:var(--text-tertiary)}
.sic.warn{background:var(--tone-warning-bg);color:var(--tone-warning-fg)}
.stx{display:flex;flex-direction:column;min-width:0}
.stx b{font-weight:500}
.stx span{font-size:15px;line-height:20px;color:var(--text-secondary)}
.stx span.mine{color:var(--selection-fg)}
.srow.locked .stx b{color:var(--text-secondary)}

/* Étape ouverte */
.panel{min-width:0;display:flex;flex-direction:column;gap:20px;padding:20px;border:1px solid var(--border-hairline);border-radius:16px;background:var(--surface-raised)}
.ptop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.ptop h2{font-size:22px;line-height:28px;letter-spacing:-.04em;font-weight:500;text-wrap:balance}
.why{font-size:16px;line-height:24px;color:var(--text-secondary);text-wrap:pretty;max-width:72ch}
.intro{display:flex;flex-direction:column;gap:6px}
.actor{font-weight:600}
.meta{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 16px;padding:14px 16px;border-radius:12px;background:var(--surface-soft)}
.meta dt{font-size:14px;line-height:20px;color:var(--text-tertiary)}
.meta dd{font-size:15px;line-height:22px;overflow-wrap:anywhere}
.meta dd small{display:block;font-size:14px;line-height:20px;color:var(--text-secondary)}
.inert{opacity:.6;pointer-events:none}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:13px;line-height:18px;font-weight:600;white-space:nowrap}
.badge.sm{height:20px;padding:0 8px;font-size:12px}
.t-info{background:var(--tone-info-bg);color:var(--tone-info-fg)}.t-neutral{background:var(--tone-neutral-bg);color:var(--tone-neutral-fg)}
.t-warn{background:var(--tone-warning-bg);color:var(--tone-warning-fg)}.t-ok{background:var(--tone-success-bg);color:var(--tone-success-fg)}
.t-danger{background:var(--tone-danger-bg);color:var(--tone-danger-fg)}
.callout{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:15px;line-height:22px}
.callout svg{flex-shrink:0;margin-top:2px}
.callout b{font-weight:600}
.callout .q{display:block;margin-top:2px}
.tools{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:4px}

/* Blocs enfoncés (fond de la page dans la carte de l'étape) */
.sunk{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:12px;background:var(--surface-inset);border:1px solid var(--border-hairline)}
.bhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.bhead.rule{margin-inline:-18px;padding:0 18px 14px;border-bottom:1px solid var(--border-hairline)}
@media (max-width:760px){.bhead.rule{margin-inline:-14px;padding-inline:14px}}
.h3{font-size:18px;line-height:26px;font-weight:600;letter-spacing:-.02em}
.cap{font-size:14px;line-height:20px;color:var(--text-secondary)}
.tert{color:var(--text-tertiary)}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;line-height:20px;color:var(--text-secondary)}
.ask{font-size:20px;line-height:28px;letter-spacing:-.03em;font-weight:500;text-wrap:balance}
.proposal{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:10px;background:var(--surface-soft)}
.proposal b{font-weight:600}
.src{font-size:14px;line-height:20px;color:var(--text-tertiary);overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.actions .push{margin-left:auto}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:14px;font-weight:600}
.req{color:var(--text-tertiary)}
.in{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--border-field);background:var(--surface-raised);resize:vertical;line-height:22px}
.in[aria-invalid="true"]{border-color:var(--tone-danger-fg)}
select.in{min-height:40px;padding:0 10px}
.err{color:var(--tone-danger-fg);font-size:14px;line-height:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;background:var(--primary-bg);color:var(--primary-fg);cursor:pointer;font-weight:600;white-space:nowrap;transition:transform 140ms var(--ease),background-color 150ms ease,border-color 150ms ease}
.btn:active{transform:scale(.97)}
.btn.outline{background:none;color:var(--text-primary);border-color:var(--border-default)}
.btn.ghost{background:none;color:var(--text-primary);font-weight:500}
.btn.sm{height:32px;padding:0 14px;font-size:14px}
.btn.quiet{color:var(--text-secondary)}

/* Les 6 dimensions */
.dims{border:1px solid var(--border-hairline);border-radius:12px;overflow:hidden;background:var(--surface-inset)}
.drow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;border-top:1px solid var(--border-hairline);background:none;text-align:left;cursor:pointer}
.dims > div:first-child .drow{border-top:0}
.drow .grow{flex:1;min-width:0}
.qnav{display:flex;align-items:center;gap:4px}
.qnav button{width:32px;height:32px;border-radius:999px;border:1px solid var(--border-default);background:none;display:grid;place-items:center;cursor:pointer;color:var(--text-primary)}
.qnav button:disabled{opacity:.35;cursor:default}
.qnav .back{transform:rotate(180deg)}
.chev{color:var(--text-tertiary);transition:transform 160ms var(--ease);flex-shrink:0}
.drow[aria-expanded="true"] .chev{transform:rotate(90deg)}
.lines{display:flex;flex-direction:column;border-top:1px solid var(--border-hairline);background:var(--surface-soft)}
.line{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) auto;gap:4px 16px;align-items:start;padding:12px 16px}
.line + .line{border-top:1px solid var(--border-hairline)}
.line .lab{font-size:15px;line-height:22px;color:var(--text-secondary)}
.line .val{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:15px;line-height:22px;overflow-wrap:anywhere}
.line .val .none{color:var(--text-tertiary)}
.line .end{display:flex;align-items:center;gap:6px}
.line.cur{background:var(--selection-bg)}
.line.cur .val{color:var(--selection-fg)}
button.line{width:100%;border:0;background:none;text-align:left;cursor:pointer;font:inherit}

/* Brief */
.doc{display:flex;flex-direction:column;gap:0}
.dsec{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--border-hairline)}
.dsec:first-child{border-top:0;padding-top:4px}
.dsec.marked{margin-inline:-10px;padding-inline:10px;border-radius:10px;background:color-mix(in srgb,var(--tone-warning-bg) 70%,transparent)}
.dsec-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.dsec-h h4{font-size:15px;line-height:22px;font-weight:600}
.dl{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:6px 16px}
.dl dt{font-size:15px;line-height:22px;color:var(--text-secondary)}
.dl dd{font-size:15px;line-height:22px;overflow-wrap:anywhere}
.dl dd .src{display:block}
.changed{padding:10px 12px;border-radius:10px;background:var(--surface-soft);font-size:15px;line-height:22px}
.toggle{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border-default);background:none;font-size:13px;cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--tone-warning-bg);color:var(--tone-warning-fg);border-color:transparent}
.decide{display:flex;flex-direction:column;gap:14px;padding-top:16px;border-top:1px solid var(--border-hairline)}
details.fold > summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--text-secondary)}
details.fold > summary::-webkit-details-marker{display:none}
details.fold[open] > summary .chev{transform:rotate(90deg)}
.old{display:flex;flex-direction:column;gap:4px;margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--border-hairline)}

/* Plan */
.pgroup{display:flex;flex-direction:column;gap:6px}
.pgroup + .pgroup{padding-top:14px;border-top:1px solid var(--border-hairline)}
.pgh{display:flex;align-items:baseline;gap:8px}
.pgh b{font-weight:600}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,190px) auto;gap:4px 16px;align-items:center;padding:8px 0}
.prow .who{display:flex;align-items:center;gap:8px;font-size:15px;min-width:0}
.prow .who > span:last-child{display:flex;flex-direction:column;min-width:0}
.pedit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px;border-radius:10px;background:var(--surface-soft);margin-bottom:6px}
.pedit .actions{grid-column:1/-1}

/* Barre du proto et toast : hors du produit */
.proto{position:fixed;left:0;right:0;margin-inline:auto;width:fit-content;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--glass);color:var(--glass-fg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgb(0 0 0 / .35);border:1px solid rgb(255 255 255 / .1)}
.proto .tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--glass-2);padding:0 6px}
.proto label{font-size:13px;color:var(--glass-2)}
.proto select{height:34px;border-radius:10px;border:1px solid rgb(255 255 255 / .18);background:rgb(255 255 255 / .08);color:var(--glass-fg);padding:0 10px;font-size:14px;max-width:280px}
.proto select option{color:#000;background:#fff}
.proto button{height:34px;border-radius:10px;border:1px solid rgb(255 255 255 / .18);background:none;color:var(--glass-fg);padding:0 12px;font-size:14px;cursor:pointer}
.toast{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--primary-bg);color:var(--primary-fg);padding:12px 16px;border-radius:12px;font-size:15px;max-width:min(420px,calc(100% - 40px));transition:opacity 180ms ease,transform 180ms var(--ease)}
.toast.off{opacity:0;transform:translateY(8px);pointer-events:none}
.scrim{display:none}

@media (hover:hover) and (pointer:fine){
  .srow:not([aria-current="step"]):hover,.drow:hover,button.line:hover{background:var(--control-hover)}
  .btn:hover{background:var(--primary-hover)}
  .btn.outline:hover,.btn.ghost:hover{background:var(--control-hover);border-color:var(--border-hover)}
  .btn.ghost:hover{border-color:transparent}
  .qnav button:not(:disabled):hover{background:var(--control-hover);border-color:var(--border-hover)}
  .toggle:hover{border-color:var(--border-hover)}
  .crumbs button:hover{color:var(--text-primary)}
}
@media (max-width:1100px){.meta{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .rail{display:none}
  .pnav{display:none}
  .pnav.open{display:flex;position:fixed;inset:0 auto 0 0;z-index:40;box-shadow:0 10px 40px rgb(0 0 0 / .4)}
  .scrim.open{display:block;position:fixed;inset:0;z-index:35;background:rgb(0 0 0 / .4)}
  .menu{display:grid;margin-left:-8px}
  .topbar,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding-top:20px}
  .panel{padding:16px}
  .sunk{padding:14px}
  .meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .line,.dl{grid-template-columns:minmax(0,1fr)}
  .line .end{justify-content:flex-start}

const PLAN0=()=>[
 {k:"strategy",wf:"Stratégie",grp:"Marketing",col:"focus",pilot:"lina",due:"Avant le Ven. 13/11/2026",why:"Elle décide du dispositif et des livrables"},
 {k:"master",wf:"Master",grp:"",col:"focus",pilot:"lina",due:"Master final le Sam. 21/11/2026",why:"Le master final est dans trois semaines"},
 {k:"legal",wf:"Juridique",grp:"",col:"focus",pilot:"lina",due:"Avant le Sam. 21/11/2026",why:"L'échantillon de « Night Lights » est à autoriser"},

/* État : ce que les gens ont fait. Tout le reste est calculé à chaque rendu. */
let S;
function fresh(){return {role:"lina",sel:null,items:Q0(),cur:null,mode:null,more:false,open:{},versions:[],decide:{mode:null,dims:[],note:""},plan:{rows:PLAN0(),launched:null,editing:null},flash:null,err:{},menu:false};}

const last=()=>S.versions[S.versions.length-1];
const openItems=()=>S.items.filter(isOpen);
const dimsDone=()=>openItems().length===0;
const briefState=()=>{const v=last();return v?v.status:null;};
const frozen=()=>briefState()==="review";

/* Statut de chaque étape, jamais stocké */
function stepStatus(id){
  const b=briefState();
  if(id==="start") return "done";
  if(id==="dims"){if(!dimsDone()) return b==="changes"?"rework":"open";return "done";}
  if(id==="brief"){if(b==="ok") return "done";if(!dimsDone()) return "locked";return b==="review"?"waiting":"open";}
  if(id==="plan"){if(S.plan.launched) return "done";return b==="ok"?"open":"locked";}
}
const STEPS=[
 {id:"start",title:"Démarrer le cadrage",why:"Commencer directement avec PO, ou préparer un échange : les deux chemins mènent au même Brief de cadrage."},
 {id:"dims",title:"Les 6 dimensions",why:"Ce que le projet sait déjà, ce qui reste à confirmer, ce qui manque. PO pose une question à la fois et ne redemande jamais ce qui est connu."},
 {id:"brief",title:"Brief de cadrage",why:"Les 6 dimensions dans un document versionné, avec leurs sources. La direction le valide ; une demande de modification ne rouvre que les dimensions concernées."},
 {id:"plan",title:"Plan du projet",why:"Ce qui commence maintenant, ce qui suit, ce qui avance en parallèle, ce qu'il faut prévoir. Rien ne démarre avant « Lancer le plan »."}];
const stepOf=id=>STEPS.find(s=>s.id===id);

/* Qui agit maintenant, et quoi */
function actorOf(id){
  const st=stepStatus(id);
  if(st==="done"||st==="locked") return null;
  if(id==="dims"){const n=openItems().length;return {who:"lina",todo:st==="rework"?`Revoir ${plural(n,"réponse","réponses")}`:`Répondre à ${plural(n,"question","questions")} de PO`};}
  if(id==="brief") return st==="waiting"?{who:"claire",todo:"Valider le Brief de cadrage"}:{who:"lina",todo:last()&&last().n>1?`Envoyer la version ${last().n} en validation`:"Envoyer le Brief en validation"};
  if(id==="plan") return {who:"lina",todo:"Lancer le plan du projet"};
}
function summaryOf(id){
  if(id==="start") return CALL;
  if(id==="dims") return plural(S.items.length,"information confirmée","informations confirmées");
  if(id==="brief") return `Version ${last().n} validée`;
  if(id==="plan") return `Lancé le ${S.plan.launched.at.slice(5,10)}`;
}
const myActions=()=>STEPS.filter(s=>{const a=actorOf(s.id);return a&&a.who===S.role;});

   <div class="cols">${spine()}${panel()}</div>`;

}

}
function spine(){

    const st=stepStatus(s.id),a=actorOf(s.id),prev=STEPS[STEPS.indexOf(s)-1];
    const ic=st==="done"?`<span class="sic done">${I.check}</span>`:st==="locked"?`<span class="sic lock">${I.lock}</span>`:st==="rework"?`<span class="sic warn">${I.back}</span>`:`<span class="sic cur"></span>`;
    const sub=st==="done"?esc(summaryOf(s.id)):st==="locked"?`Après : ${esc(prev.title)}`:a.who===S.role?`<span class="mine">À vous : ${esc(lowerFirst(a.todo))}</span>`:`${esc(P[a.who].name)} : ${esc(lowerFirst(a.todo))}`;

}
const BADGE={done:["t-ok","Fait"],open:["t-info","En cours"],waiting:["t-info","En attente d'une validation"],rework:["t-warn","À revoir"],locked:["t-neutral","Plus tard"]};

  const s=stepOf(S.sel),st=stepStatus(s.id),a=actorOf(s.id);
  const actor=a?(a.who===S.role?`<p class="actor">À vous : ${esc(lowerFirst(a.todo))}.</p>`:`<p class="actor">En attente de ${esc(P[a.who].name)} : ${esc(lowerFirst(a.todo))}.</p>`):"";
  const body={start:startBody,dims:dimsBody,brief:briefBody,plan:planBody}[s.id]();
  const locked=st==="locked";
  const prev=STEPS[STEPS.indexOf(s)-1];
  return `<section class="panel" aria-labelledby="stepTitle">
    <div class="intro"><div class="ptop"><h2 id="stepTitle">${esc(s.title)}</h2><span class="badge ${BADGE[st][0]}">${BADGE[st][1]}</span></div>
    <p class="why">${esc(s.why)}</p></div>
    ${actor}${metaOf(s.id)}
    ${locked?`<div class="callout t-neutral">${I.lockl}<span>S'ouvre quand ${esc(prev.title)} est fait.</span></div>`:""}
    ${flashHere()}
    ${locked?`<div class="inert" inert>${body}</div>`:body}
    ${!locked&&st!=="done"&&S.role==="lina"?`<div class="tools"><button class="btn ghost sm quiet" type="button" data-act="noop">Signaler un blocage</button><button class="btn ghost sm quiet" type="button" data-act="noop">Noter une information</button></div>`:""}
  </section>`;
}
function flashHere(){const f=S.flash;if(!f||f.step!==S.sel) return "";
  return `<div class="callout ${f.tone==="info"?"t-info":"t-ok"}" role="status">${f.tone==="info"?I.info:I.ok}<span><b>${esc(f.title)}</b>${f.body?` ${esc(f.body)}`:""}</span></div>`;}

/* Démarrer le cadrage, fait : l'échange tel qu'il a eu lieu, une seule fois */
function startBody(){
  return `<div class="sunk"><div class="bhead"><h3 class="h3">Échange de cadrage</h3><span class="cap">Enregistré · 1 h 12</span></div>
   <dl class="dl"><dt>Quand</dt><dd>${DAY.call} à 21:00</dd><dt>Participants</dt><dd>Lina Haddad, Nadia Benali, Tom Mercier</dd>
   <dt>Ce que PO en a tiré</dt><dd>12 réponses proposées, chacune avec la phrase exacte, à confirmer dans « Les 6 dimensions »</dd></dl>
   <div class="actions"><button class="btn outline sm" type="button" data-act="noop">Écouter l'échange</button><button class="btn ghost sm" type="button" data-act="noop">Lire la transcription</button></div></div>`;
}

/* Les 6 dimensions : la question d'abord, puis les dimensions repliées */
function editable(x){
  const b=briefState();
  if(S.role!=="lina"||frozen()||b==="ok") return false;
  return b!=="changes"||last().req.dims.includes(x.d);
}
function current(){
  const nav=S.items.filter(editable);
  if(S.cur){const c=nav.find(x=>x.k===S.cur);if(c) return c;}
  return nav.find(isOpen)||null;
}
function nextOpenAfter(x){const nav=S.items.filter(editable),i=nav.indexOf(x);return [...nav.slice(i+1),...nav.slice(0,i)].find(isOpen)||null;}
function sourceOf(x){
  if(x.st==="ok") return x.edited?`Modifié par Lina Haddad · ${x.day||DAY.dims}`:`Confirmé par Lina Haddad · ${x.day||DAY.dims}`;
  if(x.st==="na") return `Non applicable · « ${x.reason} »`;
  if(x.st==="later") return `À définir avant le ${x.when}`;
  if(x.st==="review") return x.prevSrc||"";
  if(x.said) return `« ${x.said} » · ${CALL}`;
  return x.src||"";
}
const ST={known:["t-neutral","Connu"],ok:["t-ok","Confirmé"],confirm:["t-info","À confirmer"],missing:["t-warn","Manquant"],na:["t-neutral","Non applicable"],later:["t-neutral","À définir plus tard"],review:["t-warn","À revoir"]};
function dimsBody(){
  const lina=S.role==="lina",cur=current(),b=briefState();
  let top="";
  if(frozen()) top=`<div class="callout t-info">${I.lockl}<span>Le cadrage est figé pendant la relecture du Brief par Claire Morel.</span></div>`;
  else if(b==="changes"&&!dimsDone()){const r=last().req;
    top=`<div class="callout t-warn">${I.warn}<span><b>Claire Morel demande une modification</b> · ${esc(r.at)}<span class="q">« ${esc(r.note)} »</span><span class="q">Rouvert : ${esc(r.dims.map(dimName).join(", "))}. Le reste du cadrage ne bouge pas.</span></span></div>`;}
  const q=cur?question(cur):"";
  const done=dimsDone()&&!frozen()&&b!=="ok"&&!cur&&S.role==="lina"?`<div class="callout t-ok">${I.ok}<span><b>Les 6 dimensions sont complètes.</b> Le Brief de cadrage est prêt. <button class="btn ghost sm" type="button" data-act="sel" data-v="brief">Ouvrir le Brief</button></span></div>`:"";
  return `${top}${q}${done}<section class="pgroup" aria-labelledby="dimsH"><div class="bhead"><h3 class="h3" id="dimsH">Les 6 dimensions</h3>${lina&&!dimsDone()&&!frozen()?`<button class="btn ghost sm" type="button" data-act="noop">${I.mic.replace('width="20" height="20"','width="16" height="16"')} Dicter plusieurs réponses</button>`:""}</div>${dimList(cur)}</section>`;
}
function question(x){
  const nav=S.items.filter(editable),i=nav.indexOf(x),f=S.mode,e=S.err;
  const missing=x.st==="missing",open=isOpen(x),editing=missing||f==="edit";
  const arrow=(to,label,cls)=>`<button type="button" ${to?`data-act="pick" data-v="${to.k}"`:"disabled"} aria-label="${label}"${to?` title="${esc(to.label)}"`:""}><span class="${cls}">${I.chev}</span></button>`;
  const head=`<div class="bhead"><span class="eyebrow">${esc(dimName(x.d))}</span><span class="qnav">${arrow(nav[i-1],"Question précédente","back")}<span class="cap num">${i+1} sur ${nav.length}</span>${arrow(nav[i+1],"Question suivante","")}</span></div>`;
  const ask=`<div class="intro"><h3 class="ask">${esc(open&&!missing?x.conf:x.ask)}</h3><p class="cap">${esc(x.why)}</p></div>`;
  let body;
  if(f==="na") body=`<div class="field"><label for="naWhy">Pourquoi ce n'est pas applicable <span class="req">*</span></label><input class="in" id="naWhy" ${e.naWhy?'aria-invalid="true" aria-describedby="naWhyE"':""}>${e.naWhy?`<span class="err" id="naWhyE">${e.naWhy}</span>`:""}</div>
     <div class="actions"><button class="btn" type="button" data-act="na">Marquer non applicable</button><button class="btn outline" type="button" data-act="mode" data-v="">Annuler</button></div>`;
  else if(f==="later") body=`<div class="field"><label for="laterWhen">À définir avant le <span class="req">*</span></label><input class="in" type="date" id="laterWhen" min="2026-11-03" max="2026-12-04" ${e.laterWhen?'aria-invalid="true" aria-describedby="laterE"':""}>${e.laterWhen?`<span class="err" id="laterE">${e.laterWhen}</span>`:""}</div>
     <div class="actions"><button class="btn" type="button" data-act="later">Reporter, avec une tâche</button><button class="btn outline" type="button" data-act="mode" data-v="">Annuler</button></div>`;
  else if(editing) body=`<div class="field"><label for="ans">Votre réponse <span class="req">*</span></label><textarea class="in" id="ans" rows="2" ${e.ans?'aria-invalid="true" aria-describedby="ansE"':""}>${esc(missing?"":x.v||"")}</textarea>${e.ans?`<span class="err" id="ansE">${e.ans}</span>`:""}
       ${!missing&&x.v?`<span class="src">${open?"Proposé":"Actuellement"} : ${esc(x.v)} · ${esc(sourceOf(x))}</span>`:""}</div>
     <div class="actions"><button class="btn" type="button" data-act="save">${open?"Confirmer":"Enregistrer"}</button>${!missing?`<button class="btn outline" type="button" data-act="mode" data-v="">Annuler</button>`:""}${open?otherWays():""}</div>`;
  else if(open) body=`<div class="proposal"><b>${esc(x.v)}</b><span class="src">${esc(sourceOf(x))}</span></div>
     <div class="actions"><button class="btn" type="button" data-act="confirm">Confirmer</button><button class="btn outline" type="button" data-act="mode" data-v="edit">Modifier</button>${otherWays()}</div>`;
  else body=`<div class="proposal"><b>${esc(x.st==="na"?"Non applicable":x.st==="later"?"À définir plus tard":x.v)}</b><span class="src">${esc(sourceOf(x))}</span></div>
     <div class="actions"><button class="btn outline" type="button" data-act="mode" data-v="edit">Modifier</button></div>`;
  return `<section class="sunk" id="question" aria-label="Question de PO">${head}${ask}${body}</section>`;
}
function otherWays(){
  return S.more?`<span class="push actions"><button class="btn ghost sm quiet" type="button" data-act="mode" data-v="na">Non applicable</button><button class="btn ghost sm quiet" type="button" data-act="mode" data-v="later">À définir plus tard</button></span>`
   :`<button class="btn ghost sm quiet push" type="button" data-act="more" aria-expanded="false">Autre réponse</button>`;
}
function dimList(cur){
  return `<div class="dims">${DIMS.map(([d,name])=>{
    const it=S.items.filter(x=>x.d===d),o=it.filter(isOpen).length,rev=it.some(x=>x.st==="review");
    const exp=S.open[d]!==undefined?S.open[d]:(cur&&cur.d===d);
    const pill=o?`<span class="badge sm ${rev?"t-warn":"t-info"} num">${rev?"À revoir":`${o} à traiter`}</span>`:`<span class="badge sm t-ok">Complète</span>`;
    const lines=it.map(x=>{
      const isCur=x===cur;
      const val=isCur?`<span>Question en cours</span>`:x.st==="missing"?`<span class="none">Pas encore connu</span>`:`<span>${esc(x.st==="na"?"—":x.v)}</span><span class="src">${esc(sourceOf(x))}</span>`;
      const inner=`<span class="lab">${esc(x.label)}</span><span class="val">${val}</span><span class="end"><span class="badge sm ${ST[x.st][0]}">${ST[x.st][1]}</span></span>`;
      return editable(x)&&!isCur?`<button class="line" type="button" data-act="pick" data-v="${x.k}" aria-label="${isOpen(x)?"Répondre":"Modifier"} : ${esc(x.label)}">${inner}</button>`:`<div class="line${isCur?" cur":""}">${inner}</div>`;}).join("");
    return `<div><button class="drow" type="button" data-act="dim" data-v="${d}" aria-expanded="${exp}"><span class="grow">${esc(name)}</span>${pill}<span class="chev">${I.chev}</span></button>${exp?`<div class="lines">${lines}</div>`:""}</div>`;}).join("")}</div>`;
}

/* Brief de cadrage : un seul document, la décision dessous */
function briefDoc(v,{marking}={}){
  const prev=S.versions[S.versions.indexOf(v)-1];
  const changes=prev?v.snap.filter(x=>{const p=prev.snap.find(y=>y.k===x.k);return p&&p.v!==x.v;}):[];
  const sec=DIMS.map(([d,name])=>{
    const rows=v.snap.filter(x=>x.d===d);const marked=marking?S.decide.dims.includes(d):(v.req&&v.req.dims.includes(d)&&v.status==="changes");
    return `<div class="dsec${marked?" marked":""}"><div class="dsec-h"><h4>${esc(name)}</h4>${marking?`<button class="toggle" type="button" data-act="mark" data-v="${d}" aria-pressed="${marked}">${marked?"À revoir":"Marquer à revoir"}</button>`:marked?`<span class="badge sm t-warn">À revoir</span>`:""}</div>
     <dl class="dl">${rows.map(x=>`<dt>${esc(x.label)}</dt><dd>${esc(x.v)}${x.src.startsWith("Confirmé par")?"":`<span class="src">${esc(x.src)}</span>`}</dd>`).join("")}</dl></div>`;}).join("");
  return `${changes.length?`<p class="changed">Changé depuis la version ${prev.n} : ${changes.map(x=>`${esc(x.label)}, ${esc(prev.snap.find(y=>y.k===x.k).v)} → ${esc(x.v)}`).join(" ; ")} (Lina Haddad)</p>`:""}<div class="doc">${sec}</div>`;
}
const VBADGE={draft:["t-neutral","À envoyer"],review:["t-info","En attente de validation"],ok:["t-ok","Validé"],changes:["t-warn","Modification demandée"]};
function briefBody(){
  const v=last(),st=stepStatus("brief");
  if(!v) return `<p class="cap">Le Brief se crée tout seul quand les 6 dimensions sont complètes.</p>`;
  if(st==="locked"&&v.status==="changes") return `<p class="cap">La version ${v.n+1} se crée quand les dimensions rouvertes sont revues.</p>${older(true)}`;
  const lina=S.role==="lina",claire=S.role==="claire";
  const marking=claire&&v.status==="review"&&S.decide.mode==="changes";
  const when=(v.status==="ok"?`Créée le ${v.at} · validée par Claire Morel le ${v.decidedAt}`:v.sentAt?`Créée le ${v.at} · envoyée par Lina Haddad`:`Créée le ${v.at} depuis les 6 dimensions`)+". Réponses confirmées par Lina Haddad, sauf mention.";
  let act="";
  if(lina&&v.status==="draft") act=`<div class="decide"><div class="actions"><button class="btn" type="button" data-act="send">Envoyer en validation à Claire Morel</button></div><p class="cap">Pendant sa relecture, le cadrage est figé.</p></div>`;
  if(claire&&v.status==="review"){
    const e=S.err;
    act=S.decide.mode==="changes"?`<div class="decide"><h3 class="h3">Demander une modification</h3>
      <p class="cap">${S.decide.dims.length?`À revoir : ${esc(S.decide.dims.map(dimName).join(", "))}. Seules ces dimensions se rouvrent.`:"Marquez dans le Brief les dimensions à revoir. Seules celles-là se rouvrent."}</p>
      ${e.dims?`<span class="err" id="dimsE">${e.dims}</span>`:""}
      <div class="field"><label for="note">Ce qui doit changer <span class="req">*</span></label><textarea class="in" id="note" rows="3" ${e.note?'aria-invalid="true" aria-describedby="noteE"':""}>${esc(S.decide.note)}</textarea>${e.note?`<span class="err" id="noteE">${e.note}</span>`:""}</div>
      <div class="actions"><button class="btn" type="button" data-act="request">Envoyer la demande à Lina Haddad</button><button class="btn outline" type="button" data-act="decmode" data-v="">Annuler</button></div></div>`
     :`<div class="decide"><h3 class="h3">Le projet est-il assez clair pour que PO organise la suite ?</h3>
      <div class="actions"><button class="btn" type="button" data-act="approve">Valider le Brief</button><button class="btn outline" type="button" data-act="decmode" data-v="changes">Demander une modification</button></div></div>`;
  }
  return `<article class="sunk" aria-labelledby="docH"><div class="bhead rule"><div class="intro" style="gap:2px"><h3 class="h3" id="docH">Brief de cadrage · version ${v.n}</h3><span class="cap">${esc(when)}</span></div>
     <span class="actions"><span class="badge ${VBADGE[v.status][0]}">${VBADGE[v.status][1]}</span><button class="btn ghost sm" type="button" data-act="copy">${I.link} Copier le lien</button><button class="btn ghost sm" type="button" data-act="noop">${I.pdf} PDF</button></span></div>
     ${briefDoc(v,{marking})}${act}</article>${older(false)}`;
}
function older(all){
  const list=S.versions.filter(v=>all||v!==last());
  if(!list.length) return "";
  return `<details class="fold"><summary><span class="chev">${I.chev}</span>${list.length>1?`Versions précédentes (${list.length})`:`Version précédente`}</summary>
   ${list.slice().reverse().map(v=>`<div class="old"><span><b>Version ${v.n}</b> · <span class="cap">${v.status==="changes"?"Modification demandée":"Remplacée"} · créée le ${esc(v.at)}</span></span>${v.req?`<span class="cap">Claire Morel, le ${esc(v.req.at)} : « ${esc(v.req.note)} » · ${esc(v.req.dims.map(dimName).join(", "))}</span>`:""}</div>`).join("")}</details>`;
}

/* Plan du projet : la proposition de PO, groupée, modifiable ligne par ligne */
function planBody(){
  const p=S.plan,lina=S.role==="lina",editable=lina&&!p.launched&&stepStatus("plan")==="open";
  const groups=COLS.map(([c,l,d])=>{const rows=p.rows.filter(r=>r.col===c);if(!rows.length) return "";
    return `<div class="pgroup"><div class="pgh"><b>${l}</b><span class="cap">${d}</span></div>${rows.map(r=>row(r,editable)).join("")}</div>`;}).join("");
  const now=p.rows.filter(startsNow).map(r=>r.wf);
  return `<section class="sunk" aria-labelledby="planH"><div class="bhead rule"><div class="intro" style="gap:2px"><h3 class="h3" id="planH">Organisation du projet</h3>
     <span class="cap">${p.launched?`Lancée par Lina Haddad le ${esc(p.launched.at)}`:`Proposée par PO à partir du Brief de cadrage · version ${last()?last().n:1}`}</span></div></div>
     ${groups}
     ${editable?`<div class="decide"><div class="actions"><button class="btn" type="button" data-act="launch">Lancer le plan</button></div><p class="cap">Démarrent maintenant : ${esc(now.join(", "))}. Les autres attendent l'étape d'avant.</p></div>`:""}</section>`;
}
function row(r,editable){
  const pilot=P[r.pilot];
  const status=S.plan.launched?(startsNow(r)?`<span class="badge sm t-info">En cours</span>`:`<span class="badge sm t-neutral">Plus tard</span>`):editable?`<button class="btn ghost sm" type="button" data-act="pedit" data-v="${r.k}" aria-label="Modifier ${esc(r.wf)}">Modifier</button>`:"";
  if(S.plan.editing===r.k) return `<div class="prow" style="grid-template-columns:1fr"><span><b>${esc(r.wf)}</b>${r.grp?` <span class="cap">· ${esc(r.grp)}</span>`:""}</span></div>
    <div class="pedit"><div class="field"><label for="pc">Colonne</label><select class="in" id="pc">${COLS.map(([c,l])=>`<option value="${c}" ${r.col===c?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="field"><label for="pp">Pilote</label><select class="in" id="pp">${["lina","nadia","tom"].map(k=>`<option value="${k}" ${r.pilot===k?"selected":""}>${esc(P[k].name)}</option>`).join("")}</select></div>
    <div class="actions"><button class="btn sm" type="button" data-act="psave" data-v="${r.k}">Enregistrer</button><button class="btn outline sm" type="button" data-act="pedit" data-v="">Annuler</button></div></div>`;
  return `<div class="prow"><span class="intro" style="gap:0"><span><b>${esc(r.wf)}</b>${r.grp?` <span class="cap">· ${esc(r.grp)}</span>`:""}</span><span class="cap">${esc(r.why)}</span></span>
    <span class="who"><span class="av">${pilot.ini}</span><span><span>${esc(pilot.name)}</span>${r.due?`<span class="cap">${esc(r.due)}</span>`:""}</span></span>
    <span>${status}</span></div>`;
}

/* Gestes */
function reopen(dims,note){const v=last();v.status="changes";v.req={note,dims,at:DAY.decided};
  S.items.forEach(x=>{if(dims.includes(x.d)){x.prevSrc=sourceOf(x);x.st="review";}});}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.remove("off");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add("off"),2600);}
function flash(step,title,body,tone){S.flash={step,title,body,tone};}
function snap(){return S.items.map(x=>({k:x.k,d:x.d,label:x.label,v:x.st==="na"?"Non applicable":x.st==="later"?`À définir avant le ${x.when}`:x.v,src:sourceOf(x)}));}
function makeVersion(at){S.versions.push({n:S.versions.length+1,status:"draft",at,snap:snap()});}
function answered(x,verb,wasOpen){
  S.mode=null;S.more=false;S.err={};S.open={};
  const next=nextOpenAfter(x);S.cur=next?next.k:null;
  if(dimsDone()&&!wasOpen&&last()&&last().status==="draft"){
    last().snap=snap();
    flash("dims",`${verb} · ${x.label}.`,`Le Brief à envoyer est mis à jour.`);toast(verb);
  } else if(dimsDone()){
    makeVersion(last()?DAY.resent:DAY.dims);
    S.sel="brief";
    flash("brief","Les 6 dimensions sont complètes.",`Étape ouverte pour vous : le Brief de cadrage, version ${last().n}, est prêt à envoyer.`);
    toast(`${verb} · ${x.label}`);
  } else {flash("dims",`${verb} · ${x.label}.`,`Question suivante : ${next.label}.`);toast(`${verb}`);}
}
const fullFromIso=v=>{const d=new Date(v+"T12:00:00");const j=["Dim.","Lun.","Mar.","Mer.","Jeu.","Ven.","Sam."][d.getDay()];return `${j} ${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;};

const ACT={
  sel(v){S.sel=v;S.mode=null;S.more=false;S.err={};S.menu=false;S.flash=S.flash&&S.flash.step===v?S.flash:null;},
  who(){toast("Lina Haddad mène le cadrage et lance le plan ; Claire Morel valide le Brief.");},
  noop(){},
  copy(){toast("Lien copié");},
  more(){S.more=true;},
  mode(v){S.mode=v||null;S.err={};if(!v) S.more=false;},
  pick(v){S.cur=v;S.mode=null;S.more=false;S.err={};S.flash=null;setTimeout(()=>{const q=$("question");if(q) q.scrollIntoView({block:"nearest"});},0);},
  dim(v){const exp=S.open[v]!==undefined?S.open[v]:(current()&&current().d===v);S.open[v]=!exp;},
  confirm(){const x=current();x.st="ok";x.edited=false;x.day=DAY.dims;answered(x,"Réponse confirmée",true);},
  save(){const x=current(),val=$("ans").value.trim();
    if(!val){S.err={ans:"Écrivez la réponse, ou choisissez « Autre réponse »."};return;}
    const wasOpen=isOpen(x),wasMissing=x.st==="missing",changed=!wasMissing&&val!==x.v;
    if(!wasOpen&&!changed&&x.st==="ok"){S.mode=null;return;}
    x.v=val;x.st="ok";x.edited=x.edited||changed;x.day=DAY.dims;answered(x,wasMissing?"Réponse enregistrée":changed?"Réponse modifiée":"Réponse confirmée",wasOpen);},
  na(){const x=current(),r=$("naWhy").value.trim();if(!r){S.err={naWhy:"Dites pourquoi la question ne s'applique pas."};return;}x.st="na";x.reason=r;answered(x,"Marquée non applicable",true);},
  later(){const x=current(),w=$("laterWhen").value;if(!w){S.err={laterWhen:"Choisissez une date avant la sortie."};return;}x.st="later";x.when=fullFromIso(w);answered(x,"Reportée, avec une tâche",true);},
  send(){const v=last();v.status="review";v.sentAt=v.at;flash("brief","Brief envoyé en validation.","En attente de Claire Morel : valider le Brief de cadrage. Le cadrage est figé pendant sa relecture.");toast("Brief envoyé en validation");},
  decmode(v){S.decide={mode:v||null,dims:[],note:""};S.err={};},
  mark(v){const d=S.decide.dims;S.decide.note=$("note")?$("note").value:S.decide.note;S.decide.dims=d.includes(v)?d.filter(x=>x!==v):[...d,v];S.err={};},
  approve(){const v=last();v.status="ok";v.decidedAt=DAY.decided;S.decide={mode:null,dims:[],note:""};
    flash("brief","Brief validé.","Le Cadrage est terminé. Le Plan du projet s'ouvre pour Lina Haddad.");toast("Brief validé");},
  request(){const v=last(),note=$("note").value.trim(),e={};S.decide.note=note;
    if(!S.decide.dims.length) e.dims="Marquez au moins une dimension à revoir dans le Brief.";
    if(!note) e.note="Dites ce qui doit changer.";
    if(e.dims||e.note){S.err=e;return;}
    reopen(S.decide.dims.slice(),note);
    S.decide={mode:null,dims:[],note:""};S.err={};
    flash("brief","Modification demandée.",`En attente de Lina Haddad : revoir ${v.req.dims.map(dimName).join(", ")}.`,"info");toast("Modification demandée");},
  pedit(v){S.plan.editing=v||null;},
  psave(v){const r=S.plan.rows.find(x=>x.k===v);r.col=$("pc").value;r.pilot=$("pp").value;S.plan.editing=null;toast(`Plan enregistré · ${r.wf}`);},
  launch(){S.plan.launched={at:DAY.launch};S.plan.editing=null;const now=S.plan.rows.filter(startsNow).map(r=>r.wf);
    flash("plan","Plan lancé.",`${now.join(", ")} ont démarré ; chaque pilote voit son étape dans Travail.`);toast("Plan lancé");},
};

/* Moments du parcours, construits en jouant les vrais gestes */
const MOM={
  dims(){},
  dernier(){S.items.forEach(x=>{if(isOpen(x)&&x.k!=="constraints"){x.st="ok";x.day=DAY.dims;}});},
  envoyer(){MOM.dernier();const c=S.items.find(x=>x.k==="constraints");c.st="ok";c.v="Pas de tournage en extérieur après le Sam. 21/11/2026";c.edited=true;makeVersion(DAY.dims);},
  validation(){MOM.envoyer();last().status="review";last().sentAt=DAY.sent;S.role="claire";},
  retour(){MOM.validation();reopen(["budget","team"],"L'enveloppe passe à 28 000 € HT : le clip prend 20 000 €. Et Tom Mercier décide aussi de la production.");S.role="lina";},
  plan(){MOM.validation();last().status="ok";last().decidedAt=DAY.decided;S.role="lina";},
  lance(){MOM.plan();S.plan.launched={at:DAY.launch};},
};
function go(m){S=fresh();(MOM[m]||MOM.dims)();S.sel=null;S.flash=null;$("momSel").value=MOM[m]?m:"dims";try{localStorage.setItem("pds-cadrage-moment",m);}catch(e){}render();}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b) return;
  const f=ACT[b.dataset.act];if(!f) return;
  e.preventDefault();f(b.dataset.v);render();
  if(["confirm","save","na","later","send","approve","request","launch"].includes(b.dataset.act)){const fl=document.querySelector('.callout[role="status"]');if(fl) fl.scrollIntoView({block:"nearest"});}
});
$("menuBtn").addEventListener("click",()=>{S.menu=!S.menu;renderNav();});
$("scrim").addEventListener("click",()=>{S.menu=false;renderNav();});
$("roleSel").addEventListener("change",e=>{S.role=e.target.value;S.sel=null;S.flash=null;S.mode=null;S.decide={mode:null,dims:[],note:""};S.err={};render();});
$("momSel").addEventListener("change",e=>{location.hash=e.target.value;go(e.target.value);});
$("resetBtn").addEventListener("click",()=>go($("momSel").value));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.menu){S.menu=false;renderNav();}});

let first=(location.hash||"").slice(1);
if(!MOM[first]){try{first=localStorage.getItem("pds-cadrage-moment")||"dims";}catch(e){first="dims";}}
go(first);
})();
</script>
