<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Distribution PDS OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@500;600;700&display=swap">
<style>
/* Layout: PDS OS shell (main nav, project nav) and, in every module, the same
   guided pattern — « Maintenant », the journey on the left, the open step on the
   right. Tokens mirror app/globals.css. */
:root{
  --app:#fbfbfb; --page:#ffffff; --raised:#ffffff; --soft:#f4f4f4; --sunken:#ececec;
  --inverse:#000; --inverse-fg:#fff;
  --text:#000; --text-2:#5e5e5e; --text-3:#767676; --muted:#afafaf;
  --hair:#ececec; --border:#d4d4d4; --field:#dcdcdc; --hover-border:#afafaf;
  --sel:#155dfc; --sel-bg:rgb(21 93 252 / .07);
  --info-bg:#e2eefc; --info-fg:#0b3d8c; --warn-bg:#fcefd2; --warn-fg:#6e4300;
  --ok-bg:#daf3e2; --ok-fg:#0d5226; --bad-bg:#fce1df; --bad-fg:#9a1b1b;
  --act-bg:#ece1fb; --act-fg:#4c1d9e; --neutral-bg:#ececec; --neutral-fg:#111;
  --glass:rgb(24 24 24 / .86); --glass-fg:#fff; --glass-2:#bdbdbd;
  --shadow:0 1px 2px rgb(0 0 0 / .04), 0 8px 24px rgb(0 0 0 / .06);
  --font:"Google Sans Flex","Google Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --app:#0a0a0a; --page:#0f0f0f; --raised:#161616; --soft:rgb(255 255 255 / .05); --sunken:rgb(255 255 255 / .08);
  --inverse:#ededed; --inverse-fg:#0f0f0f; --text:#ededed; --text-2:#a8a8a8; --text-3:#8f8f8f; --muted:#5e5e5e;
  --hair:rgb(255 255 255 / .08); --border:rgb(255 255 255 / .12); --field:rgb(255 255 255 / .14); --hover-border:rgb(255 255 255 / .28);
  --sel:#3b7bff; --sel-bg:rgb(59 123 255 / .16);
  --info-bg:#12233d; --info-fg:#9ec5ff; --warn-bg:#33260c; --warn-fg:#f5c869; --ok-bg:#0f2e1c; --ok-fg:#7fdca0;
  --bad-bg:#3a1616; --bad-fg:#ff9b94; --act-bg:#2a1c47; --act-fg:#c9b2ff; --neutral-bg:#262626; --neutral-fg:#d4d4d4;
  --glass:rgb(40 40 40 / .9); --glass-fg:#f2f2f2; --glass-2:#a8a8a8; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --app:#0a0a0a; --page:#0f0f0f; --raised:#161616; --soft:rgb(255 255 255 / .05); --sunken:rgb(255 255 255 / .08);
  --inverse:#ededed; --inverse-fg:#0f0f0f; --text:#ededed; --text-2:#a8a8a8; --text-3:#8f8f8f; --muted:#5e5e5e;
  --hair:rgb(255 255 255 / .08); --border:rgb(255 255 255 / .12); --field:rgb(255 255 255 / .14); --hover-border:rgb(255 255 255 / .28);
  --sel:#3b7bff; --sel-bg:rgb(59 123 255 / .16);
  --info-bg:#12233d; --info-fg:#9ec5ff; --warn-bg:#33260c; --warn-fg:#f5c869; --ok-bg:#0f2e1c; --ok-fg:#7fdca0;
  --bad-bg:#3a1616; --bad-fg:#ff9b94; --act-bg:#2a1c47; --act-fg:#c9b2ff; --neutral-bg:#262626; --neutral-fg:#d4d4d4;
  --glass:rgb(40 40 40 / .9); --glass-fg:#f2f2f2; --glass-2:#a8a8a8; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--app);color:var(--text);font-family:var(--font);font-weight:500;font-size:16px;line-height:1.5;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.04em;text-wrap:balance}
p{margin:0;text-wrap:pretty}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.cap{font-size:14px;color:var(--text-2)}
.t3{color:var(--text-3)}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.shell{display:grid;grid-template-columns:68px 200px minmax(0,1fr);min-height:100%}
.shell.noproj{grid-template-columns:68px minmax(0,1fr)}
.mainnav{position:sticky;top:0;height:100vh;border-right:1px solid var(--hair);background:var(--page);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px}
.brand{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--inverse);color:var(--inverse-fg);font-weight:700;font-size:12px;letter-spacing:0;margin-bottom:8px}
.navbtn{position:relative;width:44px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--text-2);border:0;background:none;cursor:pointer}
.navbtn.on{background:var(--sunken);color:var(--text)}
.navbtn[disabled]{opacity:.35;cursor:not-allowed}
.navbtn .cnt{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--inverse);color:var(--inverse-fg);font-size:10.5px;font-weight:700;display:grid;place-items:center;letter-spacing:0}
.navbtn .tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--inverse);color:var(--inverse-fg);font-size:13px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 120ms ease;z-index:20}
@media (hover:hover) and (pointer:fine){.navbtn:hover:not([disabled]){background:var(--soft);color:var(--text)}.navbtn:hover .tip{opacity:1}}
.mainnav .grow{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none;color:var(--text)}
.avatar.sm{width:24px;height:24px;font-size:10.5px}
.projnav{position:sticky;top:0;height:100vh;border-right:1px solid var(--hair);background:var(--page);padding:8px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.switcher{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 12px;border-bottom:1px solid var(--hair);margin-bottom:6px;font-weight:600}
.group{font-size:13px;color:var(--text-3);padding:12px 10px 4px}
.pitem{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:8px;color:var(--text-2);font-size:15px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.pitem.on{background:var(--sunken);color:var(--text)}
.pitem .grow{flex:1}
@media (hover:hover) and (pointer:fine){.pitem:hover{background:var(--soft);color:var(--text)}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.run{background:var(--sel)} .dot.wait{background:var(--warn-fg)} .dot.block{background:var(--bad-fg)} .dot.done{background:var(--ok-fg)}
.mine{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--sel);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.content{min-width:0;padding:28px 40px 130px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (max-width:1100px){.shell{grid-template-columns:68px minmax(0,1fr)}.projnav{display:none}}
@media (max-width:720px){.shell,.shell.noproj{grid-template-columns:minmax(0,1fr)}.mainnav{display:none}.content{padding:20px 16px 150px}}

/* Head */
.h1{font-size:30px;letter-spacing:-.04em}
.chevrons{display:flex;flex-wrap:wrap;gap:4px}
.chev{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--soft);color:var(--text-2);font-size:15px;border:0;cursor:pointer}
.chev.on{background:var(--inverse);color:var(--inverse-fg)}
.chev .ok{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok-fg)}
.chev .lock{opacity:.6}
.headrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--text-2)}
.facts b{color:var(--text);font-weight:600}

/* Pills, buttons */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--neutral-bg);color:var(--neutral-fg);white-space:nowrap}
.pill.info{background:var(--info-bg);color:var(--info-fg)} .pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)} .pill.bad{background:var(--bad-bg);color:var(--bad-fg)} .pill.act{background:var(--act-bg);color:var(--act-fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid transparent;background:var(--inverse);color:var(--inverse-fg);font-weight:600;font-size:15px;cursor:pointer;transition:transform 140ms var(--ease),background-color 160ms ease;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.out{background:transparent;color:var(--text);border-color:var(--border)}
.btn.ghost{background:transparent;color:var(--text-2)}
.btn.sm{height:32px;padding:0 14px;font-size:14px}
@media (hover:hover) and (pointer:fine){.btn.out:hover{border-color:var(--hover-border)}.btn.ghost:hover{background:var(--soft);color:var(--text)}}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Cards */
.card{background:var(--raised);border:1px solid var(--hair);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:20px} .card h3{font-size:16px;font-weight:600;letter-spacing:-.02em}
.now{border-color:var(--border);box-shadow:var(--shadow)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2);flex-wrap:wrap}
.now h2{font-size:22px}
.rowlist{display:flex;flex-direction:column;gap:8px}
.wr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--soft);font-size:15px}
.wr .grow{flex:1;min-width:0}
.flash{background:var(--ok-bg);color:var(--ok-fg);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.flash .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.flash button{background:none;border:0;color:inherit;cursor:pointer;padding:4px;border-radius:6px}

/* Layout + spine */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.spine{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px;padding:12px;background:var(--raised);border:1px solid var(--hair);border-radius:12px}
.spine h2{font-size:15px;color:var(--text-2);letter-spacing:-.02em;padding:4px 8px 8px}
.step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:9px 8px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;width:100%;position:relative}
.step:not(:last-child)::after{content:"";position:absolute;left:19px;top:34px;bottom:-6px;width:2px;background:var(--hair)}
.step.sel{background:var(--sunken)}
@media (hover:hover) and (pointer:fine){.step:not(.sel):hover{background:var(--soft)}}
.mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--border);background:var(--raised);position:relative;z-index:1;color:var(--text-3)}
.step.done .mark{background:var(--ok-bg);border-color:transparent;color:var(--ok-fg)}
.step.current .mark{border-color:var(--sel);background:var(--sel-bg)}
.step.current .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sel)}
.step.me .mark{border-color:var(--sel);background:var(--sel)} .step.me .mark::after{background:#fff}
.step.blocked .mark{border-style:dashed}
.step .t,.step .s{display:block}
.step .t{font-size:15px;font-weight:600;line-height:1.3}
.step.blocked .t{color:var(--text-3);font-weight:500}
.step .s{font-size:13.5px;color:var(--text-2);line-height:1.35;margin-top:2px}
.step .s.me{color:var(--sel);font-weight:600}
.dhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.dhead h2{font-size:22px}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px;border-radius:10px;background:var(--soft)}
@media (max-width:1200px){.meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.meta .k{font-size:13px;color:var(--text-3)} .meta .v{font-size:15px;line-height:1.35}
.okc{color:var(--ok-fg)} .noc{color:var(--text-3)}
.note{font-size:14.5px;color:var(--text-2)}
.po{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--act-fg);background:var(--act-bg);height:22px;padding:0 8px;border-radius:999px}
.callout{border-radius:10px;padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.callout.info{background:var(--info-bg);color:var(--info-fg)} .callout.warn{background:var(--warn-bg);color:var(--warn-fg)}
.callout.bad{background:var(--bad-bg);color:var(--bad-fg)} .callout.ok{background:var(--ok-bg);color:var(--ok-fg)}
.rows{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--hair);font-size:15px}
.row:last-child{border-bottom:0}
.row .src{font-size:13px;color:var(--text-3)}
.pick{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}.pick legend{padding:0;margin-bottom:2px}
.opts{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.opt{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--hair);cursor:pointer}.opt:last-child{border-bottom:0}.opt .grow{flex:1;min-width:0}
.opt input{accent-color:var(--sel);width:18px;height:18px;flex:none}.opt:has(input:checked){background:var(--sel-bg)}
.hist{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--text-2)}
.hist li{display:flex;gap:8px;align-items:flex-start}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.in{min-height:40px;border:1px solid var(--field);border-radius:8px;background:var(--raised);padding:8px 12px;width:100%}
textarea.in{min-height:64px;resize:vertical}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.lbl2{font-size:15px}
.drop{position:relative;display:flex;align-items:center;gap:12px;min-height:72px;padding:14px 16px;border:1.5px dashed var(--border);border-radius:10px;background:var(--soft);cursor:pointer;transition:border-color 150ms ease,background-color 150ms ease}
.drop.over{border-color:var(--sel);background:var(--sel-bg)} .drop.bad{border-color:var(--bad-fg)}
.drop:focus-within{outline:2px solid var(--sel);outline-offset:2px}
.drop .grow{flex:1;min-width:0;overflow-wrap:anywhere}
@media (hover:hover) and (pointer:fine){.drop:hover{border-color:var(--hover-border)}}
.vers{display:flex;flex-direction:column;gap:8px}
.field .src,.vers>.src{font-size:14px;color:var(--text-2)}
.linkbox{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}.linkbox code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;background:var(--raised);color:var(--text);padding:6px 10px;border-radius:8px;overflow-wrap:anywhere}
.qa{display:flex;flex-direction:column;gap:12px}.qh{font-size:18px;font-weight:600;letter-spacing:-.03em}
.ver{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--hair);font-size:15px}
.rows .ver:last-child{border-bottom:0}
.ver .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.ver-note{margin:0 14px 10px;border-radius:8px}
.play{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--inverse);color:var(--inverse-fg);display:grid;place-items:center;cursor:pointer;transition:transform 120ms var(--ease)}
.play:active{transform:scale(.94)} .play[aria-pressed="true"]{background:var(--sel);color:#fff}
.wave{display:block;height:3px;margin-top:6px;border-radius:2px;background:var(--hair);overflow:hidden}
.wave i{display:block;height:100%;width:100%;background:var(--sel);transform-origin:left;animation:wave 194s linear forwards}
@keyframes wave{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.wave i{animation:none;transform:scaleX(.3)}}
.in[aria-invalid="true"]{border-color:var(--bad-fg)}
.err{font-size:13px;color:var(--bad-fg)}

/* Overview + lists */
.wfgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.wfgrid{grid-template-columns:minmax(0,1fr)}}
.wf{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--hair);border-radius:12px;background:var(--raised);text-align:left;cursor:pointer}
@media (hover:hover) and (pointer:fine){.wf:hover{border-color:var(--hover-border)}}
.bar{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sel);border-radius:999px;transform-origin:left;transition:transform 300ms var(--ease)}
.table{border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--raised)}
.tr{display:grid;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--hair);font-size:15px}
.tr:last-child{border-bottom:0}
.tr.h{font-size:13.5px;color:var(--text-3);background:var(--soft)}
.tr.link{cursor:pointer}
@media (hover:hover) and (pointer:fine){.tr.link:hover{background:var(--soft)}}
@media (max-width:760px){.tr{grid-template-columns:minmax(0,1fr)!important}.tr.h{display:none}}
.cols4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.cols4{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--soft)}
.col h3{font-size:14px;color:var(--text-2);font-weight:600}
.chip{padding:10px 12px;border-radius:8px;background:var(--raised);border:1px solid var(--hair);font-size:14.5px}
.po-input{display:flex;gap:8px;align-items:center;padding:8px 8px 8px 16px;border:1px solid var(--border);border-radius:16px;background:var(--raised)}
.po-input input{flex:1;border:0;background:transparent;outline:none;min-width:0;height:36px}

/* Portal */
.portal{min-height:100%;background:var(--app)}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:1px solid var(--hair);background:var(--page);flex-wrap:wrap}
.pwrap{max-width:820px;margin:0 auto;padding:28px 16px 150px;display:flex;flex-direction:column;gap:18px}
.lockline{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-3)}

/* Proto bar & toast */
.proto{position:fixed;left:0;right:0;margin-inline:auto;width:fit-content;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--glass);color:var(--glass-fg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgb(0 0 0 / .25)}
.proto .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--glass-2);padding:0 6px}
.proto label{font-size:13px;color:var(--glass-2)}
.proto select{height:34px;border-radius:10px;border:1px solid rgb(255 255 255 / .18);background:rgb(255 255 255 / .08);color:var(--glass-fg);padding:0 10px;font-size:14px;max-width:280px}
.proto select option{color:#000;background:#fff}
.proto button{height:34px;border-radius:10px;border:1px solid rgb(255 255 255 / .18);background:none;color:var(--glass-fg);padding:0 12px;font-size:14px;cursor:pointer}
@media (max-width:720px){.proto label{display:none}.proto select{max-width:44vw}}
.toast{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--inverse);color:var(--inverse-fg);padding:12px 16px;border-radius:12px;font-size:15px;box-shadow:var(--shadow);max-width:min(420px,calc(100% - 40px));transition:opacity 180ms ease,transform 180ms var(--ease)}
.toast[hidden]{display:block!important;opacity:0;transform:translateY(8px);pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}

/* V2 — production externe selon le ticket d'Ibé du 15/10 */

    if(f.k) return parFact(f.k,{edit:mode==="edit",copy:mode==="copy",src:S.parBy[f.k]?null:f.k==="cover"?"Conception · désignée dans les paramètres":"Distribution · paramètres"});
    let side=f.missing?pill("bad","Manquant"):f.audio?`<button class="btn ghost sm" type="button" data-act="dl">Télécharger</button>`:"";

    return fact(f.l,v,esc(f.src),{cls:f.changed?"changed":"",side});
  };
  return `<div class="doccard"><div class="dochead">${I.file}<span class="grow"><b>Dossier de livraison · V${n}</b><br><span class="src">${esc(state)}</span></span>${pill(tone[0],tone[1])}${mode!=="copy"?`<button class="btn ghost sm" type="button" data-act="pdf">Exporter en PDF</button>`:""}</div>${chg}
    ${dossierSecs().map(([t,rows])=>`<div class="dsec"><div class="dsec-h">${esc(t)}</div><div class="rows">${rows.map(row).join("")}</div></div>`).join("")}</div>`;
}
function versionsList(){

function checksBlock(editable){

function platformsView(s,st){

  let h=`<div class="rows">${fact("Disponibilité publique",`<b>${esc(avail)}</b>`,`${n} plateforme${n>1?"s":""} de référence vérifiée${n>1?"s":""} sur 5 · ${d?`déclarée le ${esc(d.at)} par ${esc(d.by)}, ${d.proof?"preuve jointe":"sans preuve"}`:"pas encore déclarée"}`,{side:pill(n===5?"ok":"",`${n} sur 5`)+(mineHere&&!d?`<button class="btn out sm" type="button" data-act="declavail">Déclarer la disponibilité publique</button>`:"")})}</div>`;

    let btns="";
    if(mineHere&&S.verifying!==k&&S.linking!==k){
      const ask=p.ver==="unchecked"||S.rechk[k];
      if(!p.url) btns=`<button class="btn out sm" type="button" data-act="plink" data-k="${k}">Renseigner le lien</button>`;
      else if(ask) btns=`<button class="btn ghost sm" type="button" data-act="ext" data-v="${esc(name)}">Ouvrir</button><button class="btn out sm" type="button" data-act="pok" data-k="${k}">${I.check} Tout est bon</button><button class="btn ghost sm" type="button" data-act="pver" data-k="${k}">Il y a un problème</button>${S.rechk[k]?`<button class="btn ghost sm" type="button" data-act="rechkno" data-k="${k}">Annuler</button>`:""}`;
      else btns=`<button class="btn ghost sm" type="button" data-act="ext" data-v="${esc(name)}">Ouvrir</button><button class="btn ghost sm" type="button" data-act="rechk" data-k="${k}">Revérifier</button>`;
    }
    let body="";
    if(S.linking===k) body=`<div class="edit">${fieldIn("plinkIn","Lien officiel","",{req:true,type:"url",ph:"https://…",src:"Commence par https://. Changer le lien remet sa vérification à faire."})}<div class="btnrow"><button class="btn sm" type="button" data-act="plinksave" data-k="${k}">Enregistrer</button><button class="btn ghost sm" type="button" data-act="plinkcancel">Annuler</button></div></div>`;

        ${pp?fieldIn("pnote",pp==="unavailable"?"Ce que vous avez vu":"Ce qui diffère","",{req:true,area:true,rows:2,ph:pp==="unavailable"?"Ex. « Ce titre n'est pas disponible dans votre pays »":"Ex. la pochette affichée est l'ancienne version."})+`<div class="field"><label for="pmod">À corriger dans *</label><select class="in" id="pmod">${MODULES.map(m=>`<option ${dv("pmod",pp==="unavailable"?"Côté distributeur":"Conception")===m?"selected":""}>${esc(m)}</option>`).join("")}</select></div>`:""}

}

function availState(){const n=verifiedN();if(n===5) return "Vérifiée";if(n) return "Vérifiée partiellement";if(S.decl.available||allPlats().some(p=>platOf(p[0]).declared)) return "Déclarée, non vérifiée";return "Non déclarée";}
/* A new logical version of the dossier: the previous one and its deposit cycle stay in the history. */
function newVersion(note){
  const before=snap(), at=stamp(); S.clock--;
  const v=S.vers.filter(x=>x.status==="approved").pop();
  if(v){v.status="superseded";v.dec=Object.assign({},v.dec,{at,by:P[me()].name,note});}
  hist("dossier",`V${S.v+1} en préparation : « ${note} » · la V${S.v} et son cycle de dépôt restent dans l'historique ; les six contrôles repartent à « non vérifié »`);
  S.v++;S.ph.dossier=0;S.ph.deposit=0;S.ph.orchard=0;S.decl={};S.proof={};S.chk={};S.chkEdit={};S.drift=false;S.sel="dossier";
  return before;
}

  return fact(typeLabel(a.type)+(a.plat?" · "+PNAME(a.plat):""),`« ${esc(a.desc)} »`,`Signalée le ${esc(a.at)} par ${esc(a.by)}${a.from?` (déclarée de ${esc(a.from)})`:""} · dossier V${a.ver} · à corriger dans : ${esc(a.mod)}${a.why?` · ${esc(ASTATE[a.state][1].toLowerCase())} : « ${esc(a.why)} »`:""}`,{side,edit});

}

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true;},3600);}
const snap=()=>Object.fromEntries(STEPS.map(s=>[s.id,statusOf(s.id)]));
function after(id,title,before){
  const lines=[];
  actorsOf(id).forEach(a=>lines.push(a.wait?`Ensuite : en attente ${esc(deOf(a.waitWho).slice(0,-a.waitWho.length))}<b>${esc(a.waitWho)}</b> · ${esc(a.waitText)}`:`Ensuite : <b>${esc(P[a.r].name)}</b> · ${esc(lc(a.todo))}`));
  STEPS.filter(s=>before[s.id]==="blocked"&&statusOf(s.id)==="current").forEach(s=>{const a=actorsOf(s.id)[0];if(!a) return;lines.push(`Débloqué : <b>${esc(s.title)}</b> · ${a.wait?`en attente ${esc(deOf(a.waitWho))} : ${esc(a.waitText)}`:`${esc(P[a.r].name)} · ${esc(lc(a.todo))}`}`);});
  if(id==="prep"&&done("prep")) lines.push("Rien ne bloque plus le dossier.");
  S.flash={title,lines:lines.slice(0,4),step:S.sel};
  toast(title+".");
}
function advance(id,text,who){
  const before=snap(), s=STEP(id), a=s.acts[ph(id)];
  S.ph[id]=ph(id)+1; delete S.ret[id];
  hist(id,text||a.done,who);
  after(id,text||a.done,before);
}
const need=(id,msg,def)=>{const v=String(dv(id,def||"")).trim();if(v) return v;S.err[id]=msg;return null;};
function doStep(id){
  const s=STEP(id), a=s.acts[ph(id)];
  switch(a.ui){
    case "params":{
      const miss=Object.keys(PAR).filter(k=>PAR[k].req&&S.par[k]==null);
      if(miss.length){miss.forEach(k=>{S.err["par-"+k]=PAR[k].req;});S.focusErr=true;break;}
      clearEd();
      advance(id);S.sel=null;break;}
    case "submit":{
      if(blockers().length){S.err.submit="La Préparation n'est pas prête : corrigez d'abord à la source ce qui bloque.";break;}
      if(CHECKS.some(c=>S.chk[c[0]]&&S.chk[c[0]].r==="non_compliant")){S.err.submit="Un contrôle est non conforme : corrigez à la source d'abord.";break;}
      clearEd();const at=stamp();S.clock--;S.vers.push({n:S.v,status:"pending",at,to:valOf()});
      advance(id,`V${S.v} soumise à ${P[valOf()].name}`);break;}
    case "decide":{const at=stamp();S.clock--;const v=S.vers[S.vers.length-1];v.status="approved";v.dec={at,by:P[me()].name};advance(id,`V${S.v} validée : prête à déposer`);break;}
    case "declare":{
      const k=a.kind, date=String(dv("dd-date",S.base)).trim();
      S.decl[k]={date,orchardId:k==="deposit"?String(dv("dd-id","")).trim():"",proof:S.proof[k]||null,by:P[me()].name,at:null};
      const text=`${a.done}${S.proof[k]?" · preuve jointe":" · sans preuve"}`;
      advance(id,text);S.decl[k].at=S.log[0].at;
      ["dd-date","dd-id"].forEach(x=>delete S.draft[x]);break;}
    case "orchard":{
      const ticked=TELL.filter(t=>!S.decl[t[0]]&&dv("oc-"+t[0],false));
      if(!ticked.length){S.err.tell="Cochez ce que The Orchard vous a fait savoir.";break;}
      const before=snap(), pfs=Object.fromEntries(ticked.map(([k])=>[k,proofOf(k).file||null]));
      ticked.forEach(([k])=>{const act=STEP("orchard").acts[ph("orchard")], pf=pfs[k];S.decl[k]={date:String(dv("od-"+k,S.base)),proof:pf,by:P[me()].name,at:null};S.ph.orchard=ph("orchard")+1;S.decl[k].at=hist("orchard",`${act.done}${pf?" · preuve jointe":" · sans preuve"}`).at;delete S.draft["oc-"+k];delete S.draft["od-"+k];});
      S.oproof={};
      after("orchard",ticked.length>1?`${ticked.length} réponses de The Orchard enregistrées`:STEP("orchard").acts.find(a=>a.kind===ticked[0][0]).done,before);break;}
    case "closeprop":{
      const res=reservesNow();
      if(res.length){let ok=true;const arb=need("arb","L'arbitrage est obligatoire : c'est ce que lira "+P[valOf()].name+".");if(!arb) ok=false;if(!dv("ack",false)){S.err.ack="Confirmez que les réserves restent non vérifiées.";ok=false;}if(!ok) break;
        S.close={reserves:res.map(r=>({res:r.res,detail:r.detail})),arb,at:null};}
      else S.close={reserves:[],arb:"",at:null};
      advance(id,res.length?`Clôture avec réserves proposée (${res.length})`:"Clôture normale proposée");S.close.at=S.log[0].at;delete S.draft.arb;delete S.draft.ack;break;}
    case "closedec":{const at=stamp();S.clock--;S.close.dec={at,by:P[me()].name};advance(id,S.close.reserves.length?`Clôturée avec réserves (${S.close.reserves.length})`:"Clôturée normalement");break;}
  }
}
function altDo(id){
  const s=STEP(id), a=s.acts[ph(id)], n=String(dv("altNote","")).trim();
  if(!n){S.err.altNote=id==="orchard"?"Dites ce que The Orchard demande.":"Dites pourquoi : c'est ce que Lina Haddad lira en tête de l'étape.";S.draft["alt-"+id]=true;return;}
  const before=snap();
  if(id==="dossier"){
    const at=stamp();S.clock--;const v=S.vers[S.vers.length-1];v.status="rejected";v.dec={at,by:P[me()].name,note:n};
    S.v++;S.ph.dossier=0;hist(id,`V${v.n} refusée : « ${n} »`);after(id,`V${v.n} refusée : renvoyée à Lina Haddad`,before);
    S.ret.dossier={who:P[me()].name,label:"Refuser",note:n,mod:"Paramètres de distribution"};
  }else if(id==="closure"){
    S.ph.closure=0;S.close=null;hist(id,`Clôture refusée : « ${n} »`);after(id,"Clôture refusée : renvoyée à Lina Haddad",before);
    S.ret.closure={who:P[me()].name,label:"Refuser",note:n};
  }else if(id==="orchard"){
    const type=dv("altType","credit_isrc"), mod=dv("altMod",defMod(type)), sev=dv("altSev","major"), at=stamp();S.clock--;
    S.anom.push({id:"a"+S.anom.length,type,desc:n,plat:null,sev,mod,state:"open",by:P[me()].name,at,ver:S.v,from:"The Orchard"});
    hist("orchard",`Corrections demandées par The Orchard : « ${n} » · anomalie ouverte, à corriger dans : ${mod}`);
    newVersion("corrections demandées par The Orchard");S.whyV[S.v]="orchard";
    S.ret.dossier={who:"The Orchard",label:"Corrections demandées, déclarées par Lina Haddad",note:n,mod};
    S.sel="dossier";after("dossier",`Corrections demandées : V${S.v} à préparer`,before);
    S.ret.dossier={who:"The Orchard",label:"Corrections demandées, déclarées par Lina Haddad",note:n,mod};
  }
  delete S.draft.altNote;delete S.draft["alt-"+id];delete S.draft.altMod;delete S.draft.altType;delete S.draft.altSev;
}
document.addEventListener("input",e=>{
  const t=e.target; if(!t.id&&!t.name) return;

  S.draft[t.id]=t.type==="checkbox"?t.checked:t.value;

  if(t.id&&t.id.startsWith("oc-")){S.draft[t.id]=t.checked;if(!t.checked) delete S.oproof[t.id.slice(3)];if(!t.checked){const i=TELL.findIndex(x=>"oc-"+x[0]===t.id);TELL.slice(i+1).forEach(x=>delete S.draft["oc-"+x[0]]);}render();return;}
  if(t.type==="radio"&&t.name){S.draft[t.name]=t.value;if(["ed-mode","ed-on","pp","an-st"].includes(t.name)) render();return;}
  if(t.tagName==="SELECT"&&t.id&&!["roleSel","scenSel"].includes(t.id)){S.draft[t.id]=t.value;if(t.id==="an-type"){delete S.draft["an-mod"];render();}if(t.id==="altType"){delete S.draft.altMod;S.draft["alt-"+S.sel]=true;render();}}
});
document.addEventListener("keydown",e=>{
  if(e.target.id&&e.target.id.startsWith("ed-")&&e.target.tagName==="INPUT"){if(e.key==="Enter"){e.preventDefault();S.err={};saveEdit(S.editing);render();}else if(e.key==="Escape"){clearEd();render();}}
});
document.addEventListener("click",e=>{
  const sm=e.target.closest("summary"); if(sm){const d=sm.parentElement; if(d.querySelector("#altNote")) S.draft["alt-"+S.sel]=!d.open; if(d.querySelector("#reopenNote")) S.draft.reopenOpen=!d.open; return;}
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, st=el.dataset.step, k=el.dataset.k;
  S.err={}; S.focusErr=false;
  switch(a){
    case "go": S.view="parcours"; S.sel=st; S.flash=null; clearEd(); S.chkOpen=null; S.verifying=null; S.linking=null; window.scrollTo({top:0}); break;
    case "view": S.view=el.dataset.v; S.flash=null; break;
    case "unflash": S.flash=null; break;
    case "do": doStep(st); break;
    case "alt": altDo(st); break;
    case "altex":{const s=STEP(st);S.draft.altNote=(s.acts[ph(st)].alt||s.acts.find(x=>x.alt).alt).ex;S.draft["alt-"+st]=true;break;}
    case "edit": clearEd(); S.editing=k; break;
    case "editsave": saveEdit(k); break;
    case "editcancel": clearEd(); break;
    case "ctog":{const cs=dv("ed-c",S.par.terr.countries.slice()), v=el.dataset.v;S.draft["ed-c"]=cs.includes(v)?cs.filter(x=>x!==v):cs.concat(v);break;}
    case "chk":{const v=el.dataset.v;if(v==="non_compliant"){S.chkOpen=k;delete S.draft.chkNote;break;}
      S.chk[k]={r:v,by:P[me()].name,at:stamp()};S.clock--;delete S.chkEdit[k];hist("dossier",`Contrôle « ${CHECKS.find(c=>c[0]===k)[1]} » : ${RES[v][1]}`);toast("Contrôle enregistré.");break;}
    case "chkedit": S.chkEdit[k]=true; break;
    case "chksave":{const n=need("chkNote","Dites ce qui ne correspond pas.");if(!n) break;S.chk[k]={r:"non_compliant",by:P[me()].name,at:stamp(),note:n};S.clock--;S.chkOpen=null;delete S.chkEdit[k];hist("dossier",`Contrôle « ${CHECKS.find(c=>c[0]===k)[1]} » : Non conforme · « ${n} »`);toast("Contrôle enregistré.");break;}
    case "chkcancel": S.chkOpen=null; break;
    case "sim":{const b=el.dataset.v, x=BLOCK[b], before=snap(), at=stamp();S.clock--;S.src[b]=true;S.srcAt[b]=at.split(",")[0];
      hist("prep",`${x.path} : ${lc(x.done)}`,x.who?P[x.who].name:"Lina Haddad");after("prep",x.done,before);break;}
    case "fix": S.fixed=true; S.fixedAt=stamp().split(",")[0]; S.clock--; hist("dossier","Catalogue : compositeur corrigé en Samir Kader","Lina Haddad"); toast("Correction faite au Catalogue : le dossier la reprend."); break;
    case "ext": toast(`Ouvre ${el.dataset.v} sur l'élément à corriger ; « Revenir à la Distribution » ramène ici, à la même étape (hors de ce proto).`); return;
    case "pdf": toast("PDF non ouvert dans le proto."); return;
    case "copy": try{navigator.clipboard&&navigator.clipboard.writeText(el.dataset.v);}catch(_){} toast(`Copié : ${el.dataset.v}`); return;
    case "play": S.playing=!S.playing; break;
    case "oproofown": S.oproof[k]=`Mail_TheOrchard_${SLUG[k]}_V${S.v}.eml`; break;
    case "oproofrm": S.oproof[k]=false; break;
    case "nodeproof":{const d=S.decl[k];d.proof=k==="deposit"?`Capture_TheOrchard_Neons_V${S.v}.png`:`Mail_TheOrchard_${SLUG[k]}_V${S.v}.eml`;hist(k==="deposit"?"deposit":"orchard",`Preuve ajoutée : ${TELL_SHORT[k]} · ${d.proof}`);toast("Preuve ajoutée : la déclaration passe « preuve jointe ».");break;}
    case "proof": S.proof[k]=k==="deposit"?`Capture_TheOrchard_Neons_V${S.v}.png`:`Courriel_TheOrchard_${k}.eml`; break;
    case "proofrm": delete S.proof[k]; break;
    case "detect":{const before=snap();S.detected=true;const day=frDate(S.base).slice(5,10);PLAT.forEach(([pk,,url])=>{if(pk!=="amazon") Object.assign(platOf(pk),{url,fromDetect:day});});hist("platforms","Détection automatique : 4 liens trouvés sur 5","PDS OS");after("platforms","4 liens trouvés par la détection",before);break;}
    case "usesug":{const p=platOf(k);p.url=p.sug;p.ver="unchecked";p.comp="unchecked";hist("platforms",`${PNAME(k)} : lien de la détection repris`);toast("Lien repris : il reste à le vérifier.");break;}
    case "plink": S.linking=k; break;
    case "plinkcancel": S.linking=null; break;
    case "plinksave":{const v=String(dv("plinkIn","")).trim();if(!/^https:\/\/\S+\.\S+/.test(v)){S.err.plinkIn="Collez le lien officiel : il commence par https://.";break;}const p=platOf(k);p.url=v;p.ver="unchecked";p.comp="unchecked";p.by=null;S.linking=null;delete S.draft.plinkIn;hist("platforms",`${PNAME(k)} : lien renseigné`);toast("Lien enregistré : il reste à le vérifier.");break;}
    case "pver": S.verifying=k; ["pp","pnote","pmod"].forEach(x=>delete S.draft[x]); break;
    case "pvercancel": S.verifying=null; break;
    case "rechk": S.rechk[k]=true; break;
    case "rechkno": delete S.rechk[k]; break;
    case "pok":{const before=snap(), p=platOf(k), at=stamp();S.clock--;Object.assign(p,{ver:"verified",comp:"compliant",by:P[me()].name,at,note:""});delete S.rechk[k];
      hist("platforms",`${PNAME(k)} : vérifiée, disponible et conforme`);
      if(platDone()) after("platforms","Cinq plateformes vérifiées",before);else toast(`${PNAME(k)} vérifiée : ${verifiedN()} sur 5.`);break;}
    case "pversave":{const pp=dv("pp","");
      if(!pp){S.err.pp="Dites ce que vous avez constaté.";break;}
      const v=pp==="unavailable"?"unavailable":"verified", c=pp==="unavailable"?"":"non_compliant";delete S.rechk[k];
      const neg=v==="unavailable"||c==="non_compliant";let note="";
      if(neg){note=need("pnote","Dites ce que vous avez constaté.");if(!note) break;}
      const before=snap(), p=platOf(k), at=stamp();S.clock--;
      Object.assign(p,{ver:v,comp:v==="verified"?c:"unchecked",by:P[me()].name,at,note});
      if(neg) S.anom.push({id:"a"+S.anom.length,type:v==="unavailable"?"platform_unavailable":"metadata",desc:note,plat:k,sev:"major",mod:dv("pmod",v==="unavailable"?"Côté distributeur":"Conception"),state:"open",by:P[me()].name,at,ver:S.v});
      S.verifying=null;
      const text=`${PNAME(k)} : ${v==="verified"?"vérifiée disponible":"indisponible"}${v==="verified"?(c==="compliant"?", conforme":", non conforme"):""}`;
      hist("platforms",text+(neg?" · anomalie ouverte":""));
      if(platDone()) after("platforms","Cinq plateformes vérifiées",before);else toast(`Vérification enregistrée : ${verifiedN()} sur 5.`);
      break;}
    case "anomnew": S.reporting=true; ["an-type","an-mod","an-desc","an-plat","an-sev"].forEach(x=>delete S.draft[x]); break;
    case "anomcancelnew": S.reporting=false; break;
    case "anomex": S.draft["an-type"]="metadata"; S.draft["an-mod"]="Catalogue"; S.draft["an-desc"]="Sur Deezer, l'artiste principal apparaît « MonaLys », sans espace."; S.draft["an-plat"]="deezer"; S.draft["an-sev"]="minor"; break;
    case "anomsend":{const d=need("an-desc","Décrivez ce qui ne va pas.");if(!d) break;const type=dv("an-type","metadata"), at=stamp();S.clock--;
      S.anom.push({id:"a"+S.anom.length,type,desc:d,plat:dv("an-plat","")||null,sev:dv("an-sev","major"),mod:dv("an-mod",defMod(type)),state:"open",by:P[me()].name,at,ver:S.v});
      S.reporting=false;log(`Anomalie signalée : ${typeLabel(type)}`);toast("Anomalie signalée.");break;}
    case "anomedit": S.anomEdit=k; delete S.draft["an-st"]; delete S.draft["an-why"]; break;
    case "anomeditcancel": S.anomEdit=null; break;
    case "anomstate":{const an=S.anom.find(x=>x.id===k), st2=dv("an-st",an.state);
      if((st2==="resolved"||st2==="dismissed")&&!need("an-why","Dites pourquoi : une anomalie résolue ou écartée reste dans l'historique.")) break;
      an.state=st2;an.why=String(dv("an-why","")).trim();an.stAt=stamp();S.clock--;an.stBy=P[me()].name;S.anomEdit=null;
      log(`Anomalie « ${typeLabel(an.type)} » : ${ASTATE[st2][1].toLowerCase()}${an.why?` · « ${an.why} »`:""}`);toast("État enregistré.");break;}
    case "declavail":{const before=snap();S.decl.available={date:S.base,by:P[me()].name,proof:null,at:null};S.decl.available.at=hist("platforms","Disponibilité publique déclarée · sans preuve").at;toast("Disponibilité déclarée : elle reste à vérifier plateforme par plateforme.");void before;break;}
    case "pdecl":{const p=platOf(k);p.declared={by:P[me()].name,at:stamp()};S.clock--;hist("platforms",`${PNAME(k)} : disponibilité déclarée`);toast("Déclarée : il reste à la vérifier.");break;}
    case "padd": S.adding=true; break;
    case "paddcancel": S.adding=false; break;
    case "paddsave":{const nm=need("paddName","Donnez le nom de la plateforme.");if(!nm) break;const u=String(dv("paddUrl","")).trim();if(u&&!/^https:\/\/\S+\.\S+/.test(u)){S.err.paddUrl="Le lien commence par https://.";break;}
      const id="x"+S.extra.length;S.extra.push({id,name:nm});if(u) platOf(id).url=u;S.adding=false;delete S.draft.paddName;delete S.draft.paddUrl;hist("platforms",`Plateforme ajoutée : ${nm}`);toast("Plateforme ajoutée.");break;}
    case "drift":{const before=snap();S.drift=true;S.driftDone=true;S.coverV++;hist("dossier",`Conception : pochette « Néons » v${S.coverV} validée, après la V${S.v} du dossier`,"Nadia Benali");after("dossier","La pochette a changé à la source",before);break;}
    case "newver":{const n=need("nvNote","Dites ce qui a été corrigé, et où.",S.drift?"Pochette v"+S.coverV+" validée en Conception":"");if(!n) break;const why=S.drift?"drift":"anomaly";const before=newVersion(n);S.whyV[S.v]=why;after("dossier",`V${S.v} en préparation`,before);delete S.draft.nvNote;break;}
    case "dl": toast("Téléchargement de Neons_master_V2.wav (le fichier validé, même référence que dans Master et le Catalogue)."); return;
    case "arbex": S.draft.arb="Amazon Music relivré par The Orchard sous 10 jours ; on ne bloque pas le bilan de la sortie pour ça."; S.draft.ack=true; break;
    case "reopen":{const n=need("reopenNote","Dites pourquoi.");if(!n) break;const before=snap();S.ph.closure=0;S.close=null;hist("closure",`Suivi rouvert : « ${n} »`);after("closure","Suivi rouvert",before);delete S.draft.reopenNote;break;}
  }
  render();
  if(S.focusErr){const f=document.querySelector(".fact.missing [data-act='edit'], [aria-invalid='true']");if(f) f.focus();}
});

/* Proto controls: who is looking, and jumping to key moments. ---------------- */
function forceTo(id,n){const s=STEP(id);while(ph(id)<n){const a=s.acts[ph(id)];S.ph[id]=ph(id)+1;hist(id,a.done,P[byOf(a)].name);}}
const simAll=()=>Object.keys(BLOCK).forEach(b=>{S.src[b]=true;S.srcAt[b]=b==="master"?"21/11":b==="cover"?"20/11":"18/11";hist("prep",`${BLOCK[b].path} : ${lc(BLOCK[b].done)}`,BLOCK[b].who?P[BLOCK[b].who].name:"Lina Haddad");});
function paramsDone(){S.par.listen={on:false};S.par.tier="front";S.parBy.listen="Lina Haddad";S.parBy.tier="Lina Haddad";forceTo("params",1);}
function checksAll(){CHECKS.forEach(([k,l])=>{S.chk[k]={r:"compliant",by:"Lina Haddad",at:stamp()};hist("dossier",`Contrôle « ${l} » : Conforme`,"Lina Haddad");});}
function submitV1(){const at=stamp();S.vers.push({n:1,status:"pending",at,to:"dg"});S.ph.dossier=1;hist("dossier","V1 soumise à Claire Morel","Lina Haddad");}
function approveV1(){const at=stamp();const v=S.vers[0];v.status="approved";v.dec={at,by:"Claire Morel"};S.ph.dossier=2;hist("dossier","V1 validée : prête à déposer","Claire Morel");}
function declareTo(kinds){kinds.forEach(k=>{const id=k==="deposit"?"deposit":"orchard";const a=STEP(id).acts[ph(id)];S.decl[k]={date:S.base,orchardId:k==="deposit"?"10458823":"",proof:k==="deposit"?"Capture_TheOrchard_Neons_V1.png":null,by:"Lina Haddad",at:null};S.ph[id]=ph(id)+1;S.decl[k].at=hist(id,a.done+(S.decl[k].proof?" · preuve jointe":" · sans preuve"),"Lina Haddad").at;});}
function detectAll(){S.detected=true;const day=frDate(S.base).slice(5,10);PLAT.forEach(([k,,url])=>{if(k!=="amazon") Object.assign(platOf(k),{url,fromDetect:day});});hist("platforms","Détection automatique : 4 liens trouvés sur 5","PDS OS");}
const SCEN={
  start(){},
  ready(){S.base="2026-11-23";simAll();paramsDone();S.sel="dossier";},
  review(){S.base="2026-11-23";simAll();paramsDone();checksAll();submitV1();S.role="dg";},
  orchard(){S.base="2026-11-24";simAll();paramsDone();checksAll();submitV1();approveV1();declareTo(["deposit"]);S.sel="orchard";},
  online(){S.base="2026-12-05";simAll();paramsDone();checksAll();submitV1();approveV1();declareTo(["deposit","received","accepted","delivered"]);detectAll();S.sel="platforms";},
  closing(){S.base="2026-12-07";simAll();paramsDone();checksAll();submitV1();approveV1();declareTo(["deposit","received","accepted","delivered"]);detectAll();
    PLAT.forEach(([k])=>{if(k==="amazon") return;const p=platOf(k);Object.assign(p,{ver:"verified",comp:"compliant",by:"Lina Haddad",at:stamp()});hist("platforms",`${PNAME(k)} : vérifiée disponible, conforme`,"Lina Haddad");});S.sel="closure";}
};
const SC_KEY="pds-distribution-scen";
function go(scen){document.getElementById("toast").hidden=true;S=fresh();(SCEN[scen]||SCEN.start)();S.flash=null;try{localStorage.setItem(SC_KEY,scen);}catch(_){}render();window.scrollTo({top:0});}
document.getElementById("roleSel").addEventListener("change",e=>{S.role=e.target.value;S.sel=null;S.flash=null;clearEd();S.view="parcours";S.verifying=null;S.chkOpen=null;render();window.scrollTo({top:0});});
document.getElementById("scenSel").addEventListener("change",e=>go(e.target.value));
document.getElementById("resetBtn").addEventListener("click",()=>{document.getElementById("scenSel").value="start";go("start");});
let first="start";try{const h=location.hash.slice(1);first=SCEN[h]?h:(localStorage.getItem(SC_KEY)||"start");}catch(_){}
if(!SCEN[first]) first="start";
document.getElementById("scenSel").value=first;go(first);
})();
</script>
</body>
