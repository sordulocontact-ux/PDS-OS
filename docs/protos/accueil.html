<title>Accueil PDS OS</title>

<style>
/* Tokens recopiés de app/globals.css (docs/DESIGN.md). Coquille : barre latérale collée au bord,
   page blanche, colonne de 896 px pour l'accueil. */
:root{
  --text-primary:#000;--text-secondary:#5e5e5e;--text-tertiary:#767676;--text-muted:#afafaf;
  --surface-app:#fbfbfb;--surface-page:#fff;--surface-raised:#fff;--surface-soft:#f4f4f4;--surface-sunken:#ececec;
  --surface-pressed:#e2e2e2;--surface-tint:rgb(64 64 64 / .06);
  --border-hairline:#ececec;--border-default:#d4d4d4;--border-hover:#afafaf;
  --nav-bg:#fff;--nav-fg:#000;--nav-fg-muted:#767676;--nav-item-hover-bg:#f4f4f4;--nav-item-active-bg:#ececec;--nav-border:rgb(0 0 0 / .08);
  --nav-brand-bg:#000;--nav-brand-fg:#fff;
  --tone-neutral-bg:#ececec;--tone-neutral-fg:#111;--tone-info-bg:#e2eefc;--tone-info-fg:#0b3d8c;
  --tone-warning-bg:#fcefd2;--tone-warning-fg:#6e4300;--tone-success-bg:#daf3e2;--tone-success-fg:#0d5226;
  --tone-danger-bg:#fce1df;--tone-danger-fg:#9a1b1b;--tone-action-bg:#ececec;--tone-action-fg:#111;
  --selection:#155dfc;--selection-bg:rgb(21 93 252 / .07);
  --primary-bg:#000;--primary-fg:#fff;--primary-hover:#282828;--control-hover:#f4f4f4;
  --shadow-card:0 1px 2px rgb(0 0 0 / .04),0 2px 8px rgb(0 0 0 / .04);
  --glass:rgb(20 20 20 / .82);--glass-fg:#fff;--glass-2:#b5b5b5;
  --font:"Google Sans Flex",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --text-primary:#ededed;--text-secondary:#a8a8a8;--text-tertiary:#8f8f8f;--text-muted:#5e5e5e;
  --surface-app:#0a0a0a;--surface-page:#0f0f0f;--surface-raised:#161616;--surface-soft:rgb(255 255 255 / .05);--surface-sunken:rgb(255 255 255 / .08);

  --border-hairline:rgb(255 255 255 / .08);--border-default:rgb(255 255 255 / .12);--border-hover:rgb(255 255 255 / .28);
  --nav-bg:#0f0f0f;--nav-fg:#ededed;--nav-fg-muted:#8f8f8f;--nav-item-hover-bg:rgb(255 255 255 / .05);--nav-item-active-bg:rgb(255 255 255 / .09);--nav-border:rgb(255 255 255 / .08);

  --tone-danger-bg:#3a1616;--tone-danger-fg:#ff9b94;--tone-action-bg:#262626;--tone-action-fg:#ededed;
  --selection:#4d8bff;--selection-bg:rgb(77 139 255 / .12);
  --primary-bg:#ededed;--primary-fg:#000;--primary-hover:#d4d4d4;--control-hover:rgb(255 255 255 / .05);
  --shadow-card:0 0 0 1px rgb(255 255 255 / .02);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --text-primary:#ededed;--text-secondary:#a8a8a8;--text-tertiary:#8f8f8f;--text-muted:#5e5e5e;
  --surface-app:#0a0a0a;--surface-page:#0f0f0f;--surface-raised:#161616;--surface-soft:rgb(255 255 255 / .05);--surface-sunken:rgb(255 255 255 / .08);
  --surface-pressed:rgb(255 255 255 / .12);--surface-tint:rgb(255 255 255 / .06);
  --border-hairline:rgb(255 255 255 / .08);--border-default:rgb(255 255 255 / .12);--border-hover:rgb(255 255 255 / .28);
  --nav-bg:#0f0f0f;--nav-fg:#ededed;--nav-fg-muted:#8f8f8f;--nav-item-hover-bg:rgb(255 255 255 / .05);--nav-item-active-bg:rgb(255 255 255 / .09);--nav-border:rgb(255 255 255 / .08);
  --nav-brand-bg:#ededed;--nav-brand-fg:#000;
  --tone-neutral-bg:#262626;--tone-neutral-fg:#d4d4d4;--tone-info-bg:#12233d;--tone-info-fg:#9ec5ff;
  --tone-warning-bg:#33260c;--tone-warning-fg:#f5c869;--tone-success-bg:#0f2e1c;--tone-success-fg:#7fdca0;
  --tone-danger-bg:#3a1616;--tone-danger-fg:#ff9b94;--tone-action-bg:#262626;--tone-action-fg:#ededed;
  --selection:#4d8bff;--selection-bg:rgb(77 139 255 / .12);
  --primary-bg:#ededed;--primary-fg:#000;--primary-hover:#d4d4d4;--control-hover:rgb(255 255 255 / .05);
  --shadow-card:0 0 0 1px rgb(255 255 255 / .02);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface-app);color:var(--text-primary);font-family:var(--font);font-weight:500;font-size:16px;line-height:24px;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;letter-spacing:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--selection);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Coquille */
.shell{display:flex;min-height:100%}
.side{position:sticky;top:0;height:100dvh;width:218px;flex-shrink:0;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:8px;background:var(--nav-bg);border-right:1px solid var(--nav-border);overflow-y:auto}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0}
.brand{width:60px;height:60px;border-radius:16px;background:var(--nav-brand-bg);color:var(--nav-brand-fg);display:grid;place-items:center;font-weight:700;font-size:18px;letter-spacing:-.02em}
.iconbtn{width:40px;height:40px;border-radius:10px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--nav-fg)}
.nav{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;color:var(--nav-fg);text-decoration:none}
.nav a[aria-current="page"]{background:var(--nav-item-active-bg)}
.nav a[aria-disabled="true"]{cursor:default}
.nav .count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--primary-bg);color:var(--primary-fg);font-size:13px;line-height:20px;text-align:center;font-weight:600}
.side-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--nav-border);padding-top:8px}
.me{display:flex;align-items:center;gap:8px;padding:6px 8px;flex:1;min-width:0}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.av{width:28px;height:28px;border-radius:50%;background:var(--surface-sunken);color:var(--text-primary);display:inline-grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:0;flex-shrink:0}
.main{flex:1;min-width:0;background:var(--surface-page)}
.topbar{display:none}

/* Accueil */
.home{max-width:896px;margin:0 auto;padding-block:96px 160px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:40px}
.greet{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.greet h1{font-size:46px;line-height:52px;letter-spacing:-.04em;font-weight:500;text-wrap:balance}
.greet p{font-size:22px;line-height:30px;color:var(--text-secondary);text-wrap:balance}
.po{display:flex;flex-direction:column;gap:12px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill-btn{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--border-default);background:none;font-size:14px;cursor:pointer}
.composer{display:flex;align-items:flex-end;gap:8px;padding:16px;border-radius:12px;background:var(--surface-tint)}
.composer textarea{flex:1;min-width:0;border:0;background:none;resize:none;outline:none;padding:4px;font-size:16px;line-height:24px;height:80px}
.composer textarea::placeholder{color:var(--text-tertiary)}
.sq{width:32px;height:32px;border-radius:8px;border:0;display:grid;place-items:center;cursor:pointer}
.sq.light{background:var(--surface-raised);color:var(--text-primary)}
.sq.dark{background:var(--primary-bg);color:var(--primary-fg)}

.stack{display:flex;flex-direction:column;gap:16px}
.now{display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:16px;border:1px solid var(--border-default);background:var(--surface-raised);box-shadow:var(--shadow-card)}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;line-height:20px;color:var(--text-secondary)}
.now h2{font-size:20px;line-height:28px;letter-spacing:-.04em;font-weight:500;text-wrap:balance}
.why{font-size:15px;line-height:22px;color:var(--text-secondary);text-wrap:pretty;max-width:68ch}
.facts{display:flex;flex-wrap:wrap;gap:4px 24px;margin:0;font-size:15px;line-height:22px;color:var(--text-secondary)}
.facts div{display:flex;gap:6px}.facts dd{margin:0;color:var(--text-primary);font-weight:600}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:13px;line-height:18px;font-weight:600;white-space:nowrap}
.badge.sm{height:20px;padding:0 8px}
.t-info{background:var(--tone-info-bg);color:var(--tone-info-fg)}.t-neutral{background:var(--tone-neutral-bg);color:var(--tone-neutral-fg)}
.t-warn{background:var(--tone-warning-bg);color:var(--tone-warning-fg)}.t-danger{background:var(--tone-danger-bg);color:var(--tone-danger-fg)}
.t-ok{background:var(--tone-success-bg);color:var(--tone-success-fg)}.t-act{background:var(--tone-action-bg);color:var(--tone-action-fg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:var(--primary-bg);color:var(--primary-fg);cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap;transition:transform 140ms var(--ease),background-color 150ms ease}
.btn:active{transform:scale(.97)}
.btn.outline{background:var(--surface-page);color:var(--text-primary);border-color:var(--border-default)}
.btn.ghost{background:none;color:var(--text-primary)}
.btn.sm{height:32px;padding:0 14px;font-size:14px}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--text-primary);text-decoration:underline;text-decoration-color:var(--border-hover);text-underline-offset:3px;font-size:14px}

.sec{display:flex;flex-direction:column;gap:8px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px}
.sec-head h2{font-size:14px;line-height:20px;font-weight:600;color:var(--text-secondary);letter-spacing:-.01em}
.sec-head .n{color:var(--text-tertiary);font-weight:500;margin-left:6px}
.list{border:1px solid var(--border-default);border-radius:12px;overflow:hidden;background:var(--surface-raised)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border-hairline);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .title{font-size:16px;line-height:24px;font-weight:600;overflow-wrap:anywhere}
.row .cap{font-size:14px;line-height:20px;color:var(--text-secondary);overflow-wrap:anywhere}
.row .side-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.chev{color:var(--text-tertiary);flex-shrink:0}
.more{padding:10px 16px;border-top:1px solid var(--border-hairline);font-size:14px;color:var(--text-secondary)}

.proj{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.2fr) 112px;align-items:center;gap:16px}
.proj.nolead{grid-template-columns:minmax(0,2.6fr) minmax(0,1.2fr) 112px}
.proj.nolead .c-lead{display:none}
.proj .side-r{justify-content:flex-end}
.proj .cell{min-width:0;display:flex;flex-direction:column}
.head-row{cursor:default;padding-block:8px;font-size:14px;line-height:20px;color:var(--text-tertiary)}

.welcome{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:16px;border:1px solid var(--border-default)}
.welcome ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--text-secondary)}
.welcome li b{color:var(--text-primary);font-weight:600}
.empty{padding:20px 16px;color:var(--text-secondary);font-size:15px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}

/* Étape ouverte (repère de destination) */
.page{max-width:1180px;margin:0 auto;padding-block:32px 160px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--text-secondary)}
.crumbs b{color:var(--text-primary);font-weight:500}
.page h1{font-size:30px;line-height:36px;letter-spacing:-.04em;font-weight:500}
.panel{display:flex;flex-direction:column;gap:16px;padding:24px;border-radius:16px;border:1px solid var(--border-default);background:var(--surface-raised)}
.grid4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:16px 0;border-block:1px solid var(--border-hairline)}
.grid4 .k{font-size:13px;line-height:18px;color:var(--text-tertiary)}
.grid4 .v{font-size:15px;line-height:22px}
.lead{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:12px;background:var(--selection-bg);border:1px solid color-mix(in srgb,var(--selection) 30%,transparent)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--tone-success-bg);color:var(--tone-success-fg);font-size:15px;line-height:22px}
.banner.info{background:var(--tone-info-bg);color:var(--tone-info-fg)}
.wait{padding:12px 14px;border-radius:12px;background:var(--surface-soft);font-size:15px;color:var(--text-secondary)}
.wait b{color:var(--text-primary);font-weight:600}
label.fl{font-size:14px;font-weight:600}
textarea.field{width:100%;min-height:88px;padding:10px 12px;border-radius:10px;border:1px solid var(--border-default);background:var(--surface-page);resize:vertical}
textarea.field[aria-invalid="true"]{border-color:var(--tone-danger-fg)}
.err{color:var(--tone-danger-fg);font-size:14px}
.quote{font-size:15px;color:var(--text-secondary);border-left:2px solid var(--border-default);padding-left:10px}
.groups{display:flex;flex-direction:column;gap:24px}

/* Barre du proto et toast : hors du produit */
.proto{position:fixed;left:0;right:0;margin-inline:auto;width:fit-content;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--glass);color:var(--glass-fg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgb(0 0 0 / .25)}
.proto .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--glass-2);padding:0 6px}
.proto label{font-size:13px;color:var(--glass-2)}
.proto select{height:34px;border-radius:10px;border:1px solid rgb(255 255 255 / .18);background:rgb(255 255 255 / .08);color:var(--glass-fg);padding:0 10px;font-size:14px;max-width:260px}
.proto select option{color:#000;background:#fff}
.proto button{height:34px;border-radius:10px;border:1px solid rgb(255 255 255 / .18);background:none;color:var(--glass-fg);padding:0 12px;font-size:14px;cursor:pointer}
.toast{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--primary-bg);color:var(--primary-fg);padding:12px 16px;border-radius:12px;font-size:15px;max-width:min(420px,calc(100% - 40px));transition:opacity 180ms ease,transform 180ms var(--ease)}
.toast.off{opacity:0;transform:translateY(8px);pointer-events:none}

@media (hover:hover) and (pointer:fine){
  .nav a:not([aria-current="page"]):not([aria-disabled="true"]):hover,.iconbtn:hover{background:var(--nav-item-hover-bg)}
  .row:not(.head-row):hover{background:var(--control-hover)}
  .btn:hover{background:var(--primary-hover)}
  .btn.outline:hover,.btn.ghost:hover{background:var(--control-hover);border-color:var(--border-hover)}
  .pill-btn:hover{border-color:var(--border-hover);background:var(--control-hover)}
}
@media (max-width:860px){
  .side{display:none}
  .side.open{display:flex;position:fixed;inset:0 auto 0 0;z-index:40;box-shadow:0 10px 40px rgb(0 0 0 / .3)}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--nav-border);background:var(--nav-bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
  .topbar .brand{width:40px;height:40px;border-radius:12px;font-size:13px}
  .home{padding-block:40px 160px;gap:32px}
  .greet h1{font-size:36px;line-height:42px}.greet p{font-size:18px;line-height:26px}
  .proj{grid-template-columns:minmax(0,1fr) auto}
  .proj .c-lead,.proj .c-rel{display:none}
  .proj .c-rel-m{display:block}
  .head-row{display:none}
  .grid4{grid-template-columns:minmax(0,1fr)}
}
.c-rel-m{display:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>

<div class="shell">

  <div class="main">
    <div class="topbar"><span class="brand">PDS</span><button class="iconbtn" type="button" id="menuBtn" aria-label="Ouvrir le menu" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg></button></div>
    <main id="app"></main>
  </div>
</div>
<div class="toast off" id="toast" role="status" aria-live="polite"></div>
<div class="proto" role="region" aria-label="Commandes du prototype">

    <option value="first">Premier jour dans PDS OS</option>
  </select>
  <button type="button" id="resetBtn">Recommencer</button>
</div>

let S;
function fresh(){return {role:"cp",view:"home",step:null,done:{},extra:[],hidden:{lueur:true},empty:false,flash:null,altOpen:false,altErr:false,menu:false};}
const allSteps=()=>STEPS.concat(S.extra);
const byId=id=>allSteps().find(s=>s.id===id);
const isDone=id=>!!S.done[id];
const isOpen=s=>!isDone(s.id)&&(!s.pre||isDone(s.pre))&&!allSteps().some(x=>x.blocks===s.id&&!isDone(x.id));
const visibleProject=(k,role)=>{const p=PROJECTS[k];if(S.empty||S.hidden[k])return false;if(role==="dg"||p.lead===role)return true;return allSteps().some(s=>s.p===k&&(s.by===role||s.validator===role));};
const live=role=>allSteps().filter(s=>visibleProject(s.p,role)&&isOpen(s));
const rank=s=>(s.first?-1e7:0)+(overdue(s)?0:1)*1e6+(s.due?daysFrom(s.due)+1000:999999);
const mineOf=role=>live(role).filter(s=>s.by===role).sort((a,b)=>rank(a)-rank(b));
/* Ce que la personne attend : ce que les autres font dans ses projets, ce qu'elle validera ensuite. */
const waitingOf=role=>live(role).filter(s=>s.by!==role&&(role==="dg"||PROJECTS[s.p].lead===role||s.validator===role||allSteps().some(n=>n.pre===s.id&&n.by===role))).sort((a,b)=>rank(a)-rank(b));
const where=s=>[PROJECTS[s.p].title,s.place.join(" › ")].join(" · ");
const nextOf=s=>allSteps().find(n=>n.pre===s.id&&!isDone(n.id));

function badges(s){

}
function dueText(s){return s.due?(overdue(s)?`attendu le ${fmtDay(s.due)}`:`avant le ${fmtDay(s.due)}`):"";}

}

/* ---------- Travail (lien « Tout voir ») ---------- */
function work(){
  const mine=mineOf(S.role),[first,...rest]=mine;
  const g={late:[],week:[],later:[],none:[]};
  rest.forEach(s=>{if(!s.due)g.none.push(s);else if(overdue(s))g.late.push(s);else if(daysFrom(s.due)<=3)g.week.push(s);else g.later.push(s);});
  const block=(t,l)=>l.length?`<section class="sec"><div class="sec-head"><h2>${t}<span class="n num">${l.length}</span></h2></div><div class="list">${l.map(actionRow).join("")}</div></section>`:"";
  return `<div class="page" style="max-width:896px"><h1>Travail</h1><p class="why">Ce qui vous attend dans tous vos projets, calculé depuis leurs parcours.</p>
    ${nowCard(first)}<div class="groups">${block("En retard",g.late)}${block("Cette semaine",g.week)}${block("Plus tard",g.later)}${block("Sans échéance",g.none)}</div></div>`;
}

function step(){
  const s=byId(S.step),p=PROJECTS[s.p],mineNow=isOpen(s)&&s.by===S.role,done=isDone(s.id);
  const nx=nextOf(s);
  const flash=S.flash?`<div class="banner ${S.flash.info?"info":""}" role="status">${I.check}<span>${S.flash.html}</span></div>`:"";
  let body;
  if(mineNow){
    body=`<div class="lead"><div class="eyebrow"><span class="badge t-info">À vous</span>${badges(s)}${s.due?`<span>${esc(dueText(s))}</span>`:""}</div>
      <h2 style="font-size:20px;line-height:28px;font-weight:500;letter-spacing:-.04em">${esc(s.title)}</h2>
      ${s.quote?`<p class="quote">${esc(s.quote)}</p>`:""}
      ${flash}
      ${S.altOpen?`<div style="display:flex;flex-direction:column;gap:6px"><label class="fl" for="altNote">Motif *</label><textarea class="field" id="altNote" ${S.altErr?'aria-invalid="true" aria-describedby="altErr"':""} placeholder="Ce qui doit changer, et pourquoi"></textarea>${S.altErr?`<p class="err" id="altErr">Dites ce qui doit changer : le motif est obligatoire.</p>`:""}
        <div class="actions"><button class="btn" type="button" data-act="altSend">${esc(s.alt.label||"Demander une modification")}</button><button class="btn ghost" type="button" data-act="altCancel">Annuler</button></div></div>`
      :`<div class="actions"><button class="btn" type="button" data-act="do">${esc(s.title)}</button>${s.alt?`<button class="btn outline" type="button" data-act="altOpen">${esc(s.alt.label||"Demander une modification")}</button>`:""}</div>`}</div>`;
  } else if(done){
    body=`${flash}<div class="wait">${I.check} ${esc(s.done)}.${nx?` Ensuite : <b>${esc(who(nx.by))}</b>, ${esc(lowerFirst(nx.title))}.`:""}</div>`;
  } else {
    body=`${flash}<div class="wait">En attente de <b>${esc(who(s.by))}</b> : ${esc(lowerFirst(s.title))}${s.due?`, ${esc(dueText(s))}`:""}.</div>`;
  }
  return `<div class="page"><div><button class="btn ghost sm" type="button" data-act="go" data-v="${S.from||"home"}">${I.back}${S.from==="work"?"Travail":"Accueil"}</button></div>
    <nav class="crumbs" aria-label="Fil d'Ariane"><span>${esc(p.title)}</span>${s.place.map((x,i)=>`<span aria-hidden="true">›</span>${i===s.place.length-1?`<b>${esc(x)}</b>`:`<span>${esc(x)}</span>`}`).join("")}</nav>
    <h1>${esc(s.place[s.place.length-1])}</h1>
    <section class="panel" aria-label="Étape ouverte">
      <p class="why">${esc(s.why)}</p>
      <div class="grid4"><div><div class="k">Responsable</div><div class="v">${esc(who(s.by))}</div></div>
        <div><div class="k">Validation</div><div class="v">${s.validator?esc(P[s.validator].name):s.kind==="validate"?esc(P[s.by].name):"Aucune"}</div></div>
        <div><div class="k">Ensuite</div><div class="v">${esc(s.then||"—")}</div></div></div>
      ${body}
    </section></div>`;
}

/* ---------- Rendu et gestes ---------- */
function render(){
  document.getElementById("side").innerHTML=side();
  document.getElementById("side").classList.toggle("open",S.menu);
  document.getElementById("menuBtn").setAttribute("aria-expanded",String(S.menu));
  document.getElementById("app").innerHTML=S.view==="step"?step():S.view==="work"?work():home();
  document.getElementById("roleSel").innerHTML=ROLES.map(k=>`<option value="${k}" ${k===S.role?"selected":""}>${esc(P[k].name)} · ${esc(P[k].role)}</option>`).join("");
}
let tt;
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.remove("off");clearTimeout(tt);tt=setTimeout(()=>el.classList.add("off"),3200);}

function complete(s){
  S.done[s.id]=true;
  const nx=nextOf(s);
  toast(s.done);
  if(nx&&nx.by===S.role){S.step=nx.id;S.flash={info:true,html:`${esc(s.done)}. Étape ouverte pour vous : <b>${esc(nx.title)}</b>.`};}
  else S.flash={html:`${esc(s.done)}.${nx?` En attente de <b>${esc(who(nx.by))}</b> : ${esc(lowerFirst(nx.title))}.`:""}`};
}
function sendAlt(s,note){
  const id=s.id+"-r"+S.extra.length;
  S.extra.push({id,p:s.p,place:s.place,title:s.alt.title,kind:"do",by:s.alt.by,due:s.due,blocks:s.id,quote:`${P[S.role].name} (${lowerFirst(s.alt.label||"Demander une modification")}) : « ${note} »`,
    why:`${P[S.role].name} demande une reprise avant de décider. Une fois fait, la décision lui revient.`,then:s.title,done:"Reprise envoyée"});
  S.altOpen=false;S.altErr=false;
  const label=(s.alt.label||"Demander une modification");
  toast(label==="Demander une précision"?"Précision demandée":"Modification demandée");
  S.flash={html:`${label==="Demander une précision"?"Précision demandée":"Modification demandée"}. En attente de <b>${esc(who(s.alt.by))}</b> : ${esc(lowerFirst(s.alt.title))}.`};
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act;
  if(t.tagName==="A")e.preventDefault();
  if(a==="go"){S.view=t.dataset.v;S.flash=null;S.menu=false;S.altOpen=false;render();window.scrollTo({top:0});}
  else if(a==="open"){S.from=S.view==="work"?"work":"home";S.view="step";S.step=t.dataset.id;S.flash=null;S.altOpen=false;S.altErr=false;render();window.scrollTo({top:0});}
  else if(a==="do"){const s=byId(S.step);complete(s);render();}
  else if(a==="altOpen"){S.altOpen=true;S.altErr=false;render();document.getElementById("altNote").focus();}
  else if(a==="altCancel"){S.altOpen=false;S.altErr=false;render();}
  else if(a==="altSend"){const v=document.getElementById("altNote").value.trim();if(!v){S.altErr=true;render();document.getElementById("altNote").focus();return;}sendAlt(byId(S.step),v);render();}
  else if(a==="ask"){const el=document.getElementById("poInput");el.value=t.dataset.q;el.focus();}
  else if(a==="dismiss"){S.welcomeGone=true;render();}
});
document.getElementById("menuBtn").addEventListener("click",()=>{S.menu=!S.menu;render();});
document.getElementById("roleSel").addEventListener("change",e=>{S.role=e.target.value;S.view="home";S.flash=null;S.menu=false;render();window.scrollTo({top:0});});
document.getElementById("scenSel").addEventListener("change",e=>{const role=S.role;S=fresh();S.role=role;const v=e.target.value;
  if(v==="handover")S.hidden={};
  if(v==="first"){S.empty=true;}
  if(v==="clear"){let guard=0;while(mineOf(S.role).length&&guard++<50)mineOf(S.role).forEach(s=>S.done[s.id]=true);}
  render();window.scrollTo({top:0});});
document.getElementById("resetBtn").addEventListener("click",()=>{S=fresh();document.getElementById("scenSel").value="day";render();window.scrollTo({top:0});});
S=fresh();render();
})();
</script>
