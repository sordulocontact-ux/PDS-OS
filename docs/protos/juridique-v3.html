<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Juridique PDS OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@500;600;700&display=swap">
<style>
/* Layout: PDS OS shell (main nav, project nav) and, in every module, the same
   guided pattern — « Maintenant », the journey on the left, the open step on the
   right. Tokens mirror app/globals.css. */
:root{
  --app:#fbfbfb; --page:#ffffff; --raised:#ffffff; --soft:#f4f4f4; --sunken:#ececec;
  --inverse:#000; --inverse-fg:#fff;
  --text:#000; --text-2:#5e5e5e; --text-3:#767676; --muted:#afafaf;
  --hair:#ececec; --border:#d4d4d4; --field:#dcdcdc; --hover-border:#afafaf;
  --sel:#155dfc; --sel-bg:rgb(21 93 252 / .07);
  --info-bg:#e2eefc; --info-fg:#0b3d8c; --warn-bg:#fcefd2; --warn-fg:#6e4300;
  --ok-bg:#daf3e2; --ok-fg:#0d5226; --bad-bg:#fce1df; --bad-fg:#9a1b1b;
  --act-bg:#ece1fb; --act-fg:#4c1d9e; --neutral-bg:#ececec; --neutral-fg:#111;
  --glass:rgb(24 24 24 / .86); --glass-fg:#fff; --glass-2:#bdbdbd;
  --shadow:0 1px 2px rgb(0 0 0 / .04), 0 8px 24px rgb(0 0 0 / .06);
  --font:"Google Sans Flex","Google Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --app:#0a0a0a; --page:#0f0f0f; --raised:#161616; --soft:rgb(255 255 255 / .05); --sunken:rgb(255 255 255 / .08);
  --inverse:#ededed; --inverse-fg:#0f0f0f; --text:#ededed; --text-2:#a8a8a8; --text-3:#8f8f8f; --muted:#5e5e5e;
  --hair:rgb(255 255 255 / .08); --border:rgb(255 255 255 / .12); --field:rgb(255 255 255 / .14); --hover-border:rgb(255 255 255 / .28);
  --sel:#3b7bff; --sel-bg:rgb(59 123 255 / .16);
  --info-bg:#12233d; --info-fg:#9ec5ff; --warn-bg:#33260c; --warn-fg:#f5c869; --ok-bg:#0f2e1c; --ok-fg:#7fdca0;
  --bad-bg:#3a1616; --bad-fg:#ff9b94; --act-bg:#2a1c47; --act-fg:#c9b2ff; --neutral-bg:#262626; --neutral-fg:#d4d4d4;
  --glass:rgb(40 40 40 / .9); --glass-fg:#f2f2f2; --glass-2:#a8a8a8; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --app:#0a0a0a; --page:#0f0f0f; --raised:#161616; --soft:rgb(255 255 255 / .05); --sunken:rgb(255 255 255 / .08);
  --inverse:#ededed; --inverse-fg:#0f0f0f; --text:#ededed; --text-2:#a8a8a8; --text-3:#8f8f8f; --muted:#5e5e5e;
  --hair:rgb(255 255 255 / .08); --border:rgb(255 255 255 / .12); --field:rgb(255 255 255 / .14); --hover-border:rgb(255 255 255 / .28);
  --sel:#3b7bff; --sel-bg:rgb(59 123 255 / .16);
  --info-bg:#12233d; --info-fg:#9ec5ff; --warn-bg:#33260c; --warn-fg:#f5c869; --ok-bg:#0f2e1c; --ok-fg:#7fdca0;
  --bad-bg:#3a1616; --bad-fg:#ff9b94; --act-bg:#2a1c47; --act-fg:#c9b2ff; --neutral-bg:#262626; --neutral-fg:#d4d4d4;
  --glass:rgb(40 40 40 / .9); --glass-fg:#f2f2f2; --glass-2:#a8a8a8; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--app);color:var(--text);font-family:var(--font);font-weight:500;font-size:16px;line-height:1.5;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.04em;text-wrap:balance}
p{margin:0;text-wrap:pretty}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.cap{font-size:14px;color:var(--text-2)}
.t3{color:var(--text-3)}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.shell{display:grid;grid-template-columns:68px 200px minmax(0,1fr);min-height:100%}
.shell.noproj{grid-template-columns:68px minmax(0,1fr)}
.mainnav{position:sticky;top:0;height:100vh;border-right:1px solid var(--hair);background:var(--page);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px}
.brand{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--inverse);color:var(--inverse-fg);font-weight:700;font-size:12px;letter-spacing:0;margin-bottom:8px}
.navbtn{position:relative;width:44px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--text-2);border:0;background:none;cursor:pointer}
.navbtn.on{background:var(--sunken);color:var(--text)}
.navbtn[disabled]{opacity:.35;cursor:not-allowed}
.navbtn .cnt{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--inverse);color:var(--inverse-fg);font-size:10.5px;font-weight:700;display:grid;place-items:center;letter-spacing:0}
.navbtn .tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--inverse);color:var(--inverse-fg);font-size:13px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 120ms ease;z-index:20}
@media (hover:hover) and (pointer:fine){.navbtn:hover:not([disabled]){background:var(--soft);color:var(--text)}.navbtn:hover .tip{opacity:1}}
.mainnav .grow{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none;color:var(--text)}
.avatar.sm{width:24px;height:24px;font-size:10.5px}
.projnav{position:sticky;top:0;height:100vh;border-right:1px solid var(--hair);background:var(--page);padding:8px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.switcher{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 12px;border-bottom:1px solid var(--hair);margin-bottom:6px;font-weight:600}
.group{font-size:13px;color:var(--text-3);padding:12px 10px 4px}
.pitem{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:8px;color:var(--text-2);font-size:15px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.pitem.on{background:var(--sunken);color:var(--text)}
.pitem .grow{flex:1}
@media (hover:hover) and (pointer:fine){.pitem:hover{background:var(--soft);color:var(--text)}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.run{background:var(--sel)} .dot.wait{background:var(--warn-fg)} .dot.block{background:var(--bad-fg)} .dot.done{background:var(--ok-fg)}
.mine{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--sel);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.content{min-width:0;padding:28px 40px 130px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (max-width:1100px){.shell{grid-template-columns:68px minmax(0,1fr)}.projnav{display:none}}
@media (max-width:720px){.shell,.shell.noproj{grid-template-columns:minmax(0,1fr)}.mainnav{display:none}.content{padding:20px 16px 150px}}

/* Head */
.h1{font-size:30px;letter-spacing:-.04em}
.chevrons{display:flex;flex-wrap:wrap;gap:4px}
.chev{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--soft);color:var(--text-2);font-size:15px;border:0;cursor:pointer}
.chev.on{background:var(--inverse);color:var(--inverse-fg)}
.chev .ok{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok-fg)}
.chev .lock{opacity:.6}
.headrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--text-2)}
.facts b{color:var(--text);font-weight:600}

/* Pills, buttons */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--neutral-bg);color:var(--neutral-fg);white-space:nowrap}
.pill.info{background:var(--info-bg);color:var(--info-fg)} .pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)} .pill.bad{background:var(--bad-bg);color:var(--bad-fg)} .pill.act{background:var(--act-bg);color:var(--act-fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid transparent;background:var(--inverse);color:var(--inverse-fg);font-weight:600;font-size:15px;cursor:pointer;transition:transform 140ms var(--ease),background-color 160ms ease;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.out{background:transparent;color:var(--text);border-color:var(--border)}
.btn.ghost{background:transparent;color:var(--text-2)}
.btn.sm{height:32px;padding:0 14px;font-size:14px}
@media (hover:hover) and (pointer:fine){.btn.out:hover{border-color:var(--hover-border)}.btn.ghost:hover{background:var(--soft);color:var(--text)}}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Cards */
.card{background:var(--raised);border:1px solid var(--hair);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:20px} .card h3{font-size:16px;font-weight:600;letter-spacing:-.02em}
.now{border-color:var(--border);box-shadow:var(--shadow)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2);flex-wrap:wrap}
.now h2{font-size:22px}
.rowlist{display:flex;flex-direction:column;gap:8px}
.wr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--soft);font-size:15px}
.wr .grow{flex:1;min-width:0}
.flash{background:var(--ok-bg);color:var(--ok-fg);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.flash .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.flash button{background:none;border:0;color:inherit;cursor:pointer;padding:4px;border-radius:6px}

/* Layout + spine */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.spine{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px;padding:12px;background:var(--raised);border:1px solid var(--hair);border-radius:12px}
.spine h2{font-size:15px;color:var(--text-2);letter-spacing:-.02em;padding:4px 8px 8px}
.step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:9px 8px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;width:100%;position:relative}
.step:not(:last-child)::after{content:"";position:absolute;left:19px;top:34px;bottom:-6px;width:2px;background:var(--hair)}
.step.sel{background:var(--sunken)}
@media (hover:hover) and (pointer:fine){.step:not(.sel):hover{background:var(--soft)}}
.mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--border);background:var(--raised);position:relative;z-index:1;color:var(--text-3)}
.step.done .mark{background:var(--ok-bg);border-color:transparent;color:var(--ok-fg)}
.step.current .mark{border-color:var(--sel);background:var(--sel-bg)}
.step.current .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sel)}
.step.me .mark{border-color:var(--sel);background:var(--sel)} .step.me .mark::after{background:#fff}
.step.blocked .mark{border-style:dashed}
.step .t,.step .s{display:block}
.step .t{font-size:15px;font-weight:600;line-height:1.3}
.step.blocked .t{color:var(--text-3);font-weight:500}
.step .s{font-size:13.5px;color:var(--text-2);line-height:1.35;margin-top:2px}
.step .s.me{color:var(--sel);font-weight:600}
.dhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.dhead h2{font-size:22px}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px;border-radius:10px;background:var(--soft)}
@media (max-width:1200px){.meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.meta .k{font-size:13px;color:var(--text-3)} .meta .v{font-size:15px;line-height:1.35}
.okc{color:var(--ok-fg)} .noc{color:var(--text-3)}
.note{font-size:14.5px;color:var(--text-2)}
.po{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--act-fg);background:var(--act-bg);height:22px;padding:0 8px;border-radius:999px}
.callout{border-radius:10px;padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.callout.info{background:var(--info-bg);color:var(--info-fg)} .callout.warn{background:var(--warn-bg);color:var(--warn-fg)}
.callout.bad{background:var(--bad-bg);color:var(--bad-fg)} .callout.ok{background:var(--ok-bg);color:var(--ok-fg)}
.rows{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--hair);font-size:15px}
.row:last-child{border-bottom:0}
.row .src{font-size:13px;color:var(--text-3)}
.pick{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}.pick legend{padding:0;margin-bottom:2px}
.opts{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.opt{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--hair);cursor:pointer}.opt:last-child{border-bottom:0}.opt .grow{flex:1;min-width:0}
.opt input{accent-color:var(--sel);width:18px;height:18px;flex:none}.opt:has(input:checked){background:var(--sel-bg)}
.hist{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--text-2)}
.hist li{display:flex;gap:8px;align-items:flex-start}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.in{min-height:40px;border:1px solid var(--field);border-radius:8px;background:var(--raised);padding:8px 12px;width:100%}
textarea.in{min-height:64px;resize:vertical}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.lbl2{font-size:15px}
.drop{position:relative;display:flex;align-items:center;gap:12px;min-height:72px;padding:14px 16px;border:1.5px dashed var(--border);border-radius:10px;background:var(--soft);cursor:pointer;transition:border-color 150ms ease,background-color 150ms ease}
.drop.over{border-color:var(--sel);background:var(--sel-bg)} .drop.bad{border-color:var(--bad-fg)}
.drop:focus-within{outline:2px solid var(--sel);outline-offset:2px}
.drop .grow{flex:1;min-width:0;overflow-wrap:anywhere}
@media (hover:hover) and (pointer:fine){.drop:hover{border-color:var(--hover-border)}}
.vers{display:flex;flex-direction:column;gap:8px}
.field .src,.vers>.src{font-size:14px;color:var(--text-2)}
.linkbox{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}.linkbox code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;background:var(--raised);color:var(--text);padding:6px 10px;border-radius:8px;overflow-wrap:anywhere}
.qa{display:flex;flex-direction:column;gap:12px}.qh{font-size:18px;font-weight:600;letter-spacing:-.03em}
.ver{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--hair);font-size:15px}
.rows .ver:last-child{border-bottom:0}
.ver .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.ver-note{margin:0 14px 10px;border-radius:8px}
.play{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--inverse);color:var(--inverse-fg);display:grid;place-items:center;cursor:pointer;transition:transform 120ms var(--ease)}
.play:active{transform:scale(.94)} .play[aria-pressed="true"]{background:var(--sel);color:#fff}
.wave{display:block;height:3px;margin-top:6px;border-radius:2px;background:var(--hair);overflow:hidden}
.wave i{display:block;height:100%;width:100%;background:var(--sel);transform-origin:left;animation:wave 194s linear forwards}
@keyframes wave{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.wave i{animation:none;transform:scaleX(.3)}}
.in[aria-invalid="true"]{border-color:var(--bad-fg)}
.err{font-size:13px;color:var(--bad-fg)}

/* Overview + lists */
.wfgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.wfgrid{grid-template-columns:minmax(0,1fr)}}
.wf{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--hair);border-radius:12px;background:var(--raised);text-align:left;cursor:pointer}
@media (hover:hover) and (pointer:fine){.wf:hover{border-color:var(--hover-border)}}
.bar{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sel);border-radius:999px;transform-origin:left;transition:transform 300ms var(--ease)}
.table{border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--raised)}
.tr{display:grid;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--hair);font-size:15px}
.tr:last-child{border-bottom:0}
.tr.h{font-size:13.5px;color:var(--text-3);background:var(--soft)}
.tr.link{cursor:pointer}
@media (hover:hover) and (pointer:fine){.tr.link:hover{background:var(--soft)}}
@media (max-width:760px){.tr{grid-template-columns:minmax(0,1fr)!important}.tr.h{display:none}}
.cols4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.cols4{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--soft)}
.col h3{font-size:14px;color:var(--text-2);font-weight:600}
.chip{padding:10px 12px;border-radius:8px;background:var(--raised);border:1px solid var(--hair);font-size:14.5px}
.po-input{display:flex;gap:8px;align-items:center;padding:8px 8px 8px 16px;border:1px solid var(--border);border-radius:16px;background:var(--raised)}
.po-input input{flex:1;border:0;background:transparent;outline:none;min-width:0;height:36px}

/* Portal */
.portal{min-height:100%;background:var(--app)}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:1px solid var(--hair);background:var(--page);flex-wrap:wrap}
.pwrap{max-width:820px;margin:0 auto;padding:28px 16px 150px;display:flex;flex-direction:column;gap:18px}
.lockline{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-3)}

/* Proto bar & toast */
.proto{position:fixed;left:0;right:0;margin-inline:auto;width:fit-content;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--glass);color:var(--glass-fg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgb(0 0 0 / .25)}
.proto .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--glass-2);padding:0 6px}
.proto label{font-size:13px;color:var(--glass-2)}
.proto select{height:34px;border-radius:10px;border:1px solid rgb(255 255 255 / .18);background:rgb(255 255 255 / .08);color:var(--glass-fg);padding:0 10px;font-size:14px;max-width:280px}
.proto select option{color:#000;background:#fff}
.proto button{height:34px;border-radius:10px;border:1px solid rgb(255 255 255 / .18);background:none;color:var(--glass-fg);padding:0 12px;font-size:14px;cursor:pointer}
@media (max-width:720px){.proto label{display:none}.proto select{max-width:44vw}}

const overdue=s=>{s=stepOf(s);return !!(s.demarche&&S.launched&&active(s)&&!isObsolete(s)&&!done(s.id)&&dueOf(s)&&dueOf(s)<today());};
const daysLate=s=>Math.round((Date.parse(today())-Date.parse(dueOf(stepOf(s))))/864e5);
function preOk(p){
  const [id,n]=p.split(":");
  if(!active(id)||isObsolete(id)) return true;
  return n?ph(id)>=+n:done(id);
}
const preLabel=p=>{const [id,n]=p.split(":");return n?`la fiche de ${P[id].name}`:STEP(id).title;};
// Dependencies on other workflows: shown with their source and due date, never hidden.
const extOk=e=>e[0]==="Master final"?!!S.masterFinal:true;
const isPerson=k=>!!PERSON[k];
const noDeal=k=>!!(S.map[k]&&S.map[k].none);
function done(id){
  const s=STEP(id);
  if(id==="inv") return true;
  if(id==="ready") return !!S.finalOk;
  if(id==="track") return S.launched&&STEPS.filter(x=>x.demarche&&active(x)).every(x=>isObsolete(x)||done(x.id));
  if(isPerson(id)&&noDeal(id)) return ph(id)>=3;
  if(id==="borrow"&&S.borrow.outcome) return true;
  return ph(id)>=s.acts.length;
}
function statusOf(id){
  const s=STEP(id);
  if(isObsolete(s)) return "obsolete";
  if(!s.prereq.every(preOk)) return "blocked";
  if((s.demarche||id==="track")&&!S.launched) return "blocked";
  return done(id)?"done":"current";
}

/* Fiche de renseignements (JUR-06): sent, opened, received, complete, validated — received is not complete. */
function ficheNeeds(k){
  const f=ficheOf(k), roles=f.roles||PERSON[k].roles, n=[["fNom","État civil"]];
  if(f.fAs==="Société") n.push(["fCo","Raison sociale"],["fSiret","SIREN ou SIRET"],["fBill","Adresse de facturation"]); else n.push(["fAddr","Adresse"]);
  n.push(["fMail","E-mail"]);
  if(roles.some(r=>["Auteur·rice (paroles)","Compositeur·rice","Arrangeur·se"].includes(r))) n.push(["fIpi","Numéro IPI/COAD"]);
  if(PERSON[k].pay) n.push(["fIban","IBAN"],["fBic","BIC"]);
  return n.map(([x,l])=>({x,l,ok:!!String(f[x]||"").trim()}));
}
function ficheState(k){
  const l=S.links[k], n=ph(k);
  if(n>=3) return ["ok","Validée"];
  if(n===2) return S.ficheAsk[k]?["warn","En attente · complément demandé"]:ficheNeeds(k).some(x=>!x.ok)?["bad","À vérifier · incomplète"]:["info","Complète · à valider"];
  if(n===1) return l&&l.opened?["warn","En attente · ouverte, pas renvoyée"]:["info","Envoyée"];
  return ["","À créer"];
}
// Contract state per person (JUR-12): needed, existing, not needed with a reason, model missing, being prepared, being signed.
function contractState(k){
  if(k==="mona"||k==="karim") return ["ok","Contrat existant"];
  const m=S.map[k];
  if(m&&m.none) return ["","Non nécessaire · justifié"];
  if(!m) return fittingFor(k).length||(S.imported[k]&&S.imported[k].validated)?["info","Contrat nécessaire"]:["bad","Modèle manquant"];
  if(!S.launched||ph(k)<3) return ["info","Contrat nécessaire"];
  if(ph(k)>=7) return ["ok","Signé"];
  if(ph(k)>=6) return ["warn","En signature"];
  if(ph(k)>=5) return ["info","Validé · à envoyer"];
  if(ph(k)===4) return ["warn","En préparation · chez la direction"];
  return ["info","En préparation"];
}
function personView(k){
  if(!S.launched||isObsolete(k)) return "";
  // One line at a time: the fiche while it is the object at work, then the contract (its validation is in « Déjà fait »).
  const fs=ficheState(k);
  let h=ph(k)<3?`<div class="eyebrow"><h3 class="sub" style="margin:0">Fiche de renseignements</h3>${pill(fs[0],fs[1])}</div>`:"";
  if(noDeal(k)) h+=`<div class="callout info">${I.info}<span><b>Pas de contrat</b> : « ${esc(S.map[k].reason)} » · décidé au plan d'action, motif gardé.</span></div>`;
  else if(ph(k)>=3){const cs=contractState(k);h+=`<div class="eyebrow"><h3 class="sub" style="margin:0">Contrat · ${esc((S.map[k]||{}).model||"")}</h3>${pill(cs[0],cs[1])}</div>`;}
  return h;
}

    if(p>=4) return ["warn","En signature",`Licence envoyée le ${w[4]||""} · envoyée n'est pas signée`];

  };
  const hw=dv("holderWork",p>=1?"nocturne":""), hr=dv("holderRec",p>=1?"velvet":"");
  const row=(label,holder,which)=>{const x=st(which);return fact(label,`<b>${holder?esc(holderName(holder)):"Ayant droit à identifier"}</b>`,esc(x[2]),{side:pill(x[0],x[1])});};

/* Money (ticket 03, ticket Master § 9): proposed, then accepted, then engaged, never « paid » by itself. */
function moneyOf(k){

    add("Droits & juridique","Autorisation du sample « Night Lights »",done("borrow"),{key:"borrow",blocking:true,step:"borrow",owner:ownerOf(STEP("borrow")),

  if(active("split")&&!isObsolete("split")) add("Droits & juridique","Répartition des droits",done("split"),{key:"split",blocking:false,risk:true,step:"split",owner:ownerOf(STEP("split")),reason:done("split")?"Confirmée par chaque personne":"Pas encore confirmée",next:(actorsOf("split")[0]||{}).todo||"",source:"Juridique › Répartition",proof:done("split")?"Confirmations par lien, horodatées":"—"});
  if(active("sacem")&&!isObsolete("sacem")) add("Droits & juridique","Déclaration SACEM",ph("sacem")>=4,{key:"sacem",blocking:S.policy.sacemBlocks,risk:true,step:"sacem",owner:ownerOf(STEP("sacem")),reason:ph("sacem")>=4?"Enregistrée par la SACEM":S.sacem.rejected?"Rejetée par la SACEM":ph("sacem")>=3?"Déposée, pas encore enregistrée":S.sacem.fix?"À corriger à la demande de la SACEM":ph("sacem")>=1?"Version à signer : signatures en cours":"Pas encore déposée",next:(actorsOf("sacem")[0]||{}).todo||"",source:"Juridique › SACEM",proof:ph("sacem")>=4?"Confirmation de la SACEM : "+(S.sacem.proof||""):ph("sacem")>=3?"Accusé de dépôt (pas une preuve d'enregistrement)":"—"});
  add("Métadonnées","ISRC FR-PDS-26-00041",true,{key:"isrc",blocking:true,owner:"cp",reason:"Au Catalogue",next:"",source:"Catalogue › Fiche du titre",proof:"Fiche du titre"});
  add("Métadonnées","Crédits du titre",true,{key:"credits",blocking:true,owner:"cp",reason:"Complets d'après le Cadrage juridique",next:"",source:"Catalogue › Crédits",proof:"Dossier confirmé"});
  add("Assets & contenus","Pochette validée",true,{key:"cover",blocking:true,owner:"cp",reason:"Validée par Nadia Benali le Mer. 14/10/2026",next:"",source:"Marketing › Conception",proof:"Fichier validé"});
  ["yanis","ines"].filter(k=>active(k)&&!isObsolete(k)&&done(k)&&!noDeal(k)).forEach(k=>add("Distribution & validations",`Facture de ${P[k].name} · ${PERSON[k].pay.v}`,invState(k)==="paid",invControl(k)));
  if(ph("borrow")>=5&&!S.borrow.outcome){const m=moneyOf("borrow");if(m) add("Distribution & validations",`Facture de la licence · ${m.amount}`,false,{key:"inv-borrow",blocking:false,invoice:true,owner:"cp",reason:"Licence signée : en attente de facture",next:"Recevoir la facture",source:"Budget du projet",proof:"—"});}
  add("Distribution & validations","Validation finale avant The Orchard",!!S.finalOk,{key:"final",blocking:true,final:true,owner:"dg",reason:S.finalOk?`Validée par Claire Morel le ${S.finalOk}`:"En dernier, par la direction",next:"Valider la sortie",source:"Prêt pour la sortie",proof:S.finalOk?"Validation horodatée":"—"});

const openBlocking=()=>controls().filter(c=>c.blocking&&c.status==="open"&&!c.final);
const blockers=openBlocking;
function verdict(){
  const c=controls();
  if(c.some(x=>x.blocking&&x.status==="open"&&!x.final)) return "no";
  if(c.some(x=>x.status==="waived")||c.some(x=>x.risk&&x.status==="open")) return "risk";
  return "ok";
}
const VERDICT={no:["bad","Non prête"],risk:["warn","Prête à être validée"],ok:["ok","Prête à être validée"]};
// Three states kept apart (JUR-07): ready to be validated, validated by the direction, delivered to the distributor.
const readyPill=()=>S.delivered?["ok","Livrée au distributeur"]:S.finalOk?["ok","Sortie validée"]:VERDICT[verdict()];

/* Who is expected now on a step. `wait`: the next gesture is the owner's, but
   only once an outside answer arrives (ticket 07: a watched wait, not a task). */
function actorsOf(id){
  const s=STEP(id);
  if(id==="ready"){if(!S.launched||S.finalOk||openBlocking().length) return [];return [{r:"dg",todo:"Valider la sortie avant The Orchard",step:id}];}
  if(isLate(s)) return [{r:"cp",todo:"Ajouter au plan",step:id}];
  if(statusOf(id)!=="current"||!s.acts.length) return [];
  if(id==="plan"){const l=[];Object.values(S.imported).forEach(im=>{if(im&&im.sent&&!im.validated) l.push({r:"dg",todo:`Valider le modèle « ${im.name} »`,step:id});});
    l.push({r:"cp",todo:S.mapConfirmed?"Lancer le plan d'action":"Confirmer les contrats nécessaires",step:id});return l;}
  const a=s.acts[ph(id)];
  if(a.by==="conf") return splitConfirmers().filter(k=>S.split.conf[k]!=="ok").map(k=>({r:k,todo:"Confirmer la répartition",ext:true,step:id}));
  if(isPerson(id)&&ph(id)===2&&S.ficheAsk[id]) return [{r:id,todo:"Compléter sa fiche",ext:true,step:id}];
  if(a.ext) return [{r:a.by,todo:a.label,ext:true,step:id}];
  // The contract goes back through the person's private link; until then it is their move.
  if(a.waitFor&&P[a.waitFor]&&!(S.files[id]||{}).byLink) return [{r:a.waitFor,todo:"Signer et renvoyer le contrat",ext:true,step:id}];
  if(isPerson(id)&&a.ui==="signed"&&!S.pdsSig[id]) return [{r:"dg",todo:"Signer le contrat pour PDS",step:id}];
  let todo=S.ret[id]&&a.again?a.again:a.label;
  if(a.ui==="link") todo=S.links[id]?`Envoyer le lien à ${P[id].name}`:PERSON[id].reseau?"Envoyer la fiche":"Créer le lien de la fiche";
  if(id==="sacem"&&ph(id)===1){if(!S.sacem.sent) todo="Envoyer le bulletin à signer";else{
    const l=sacemSigners().filter(k=>k!=="pds"&&!S.sacem.sigs[k]).map(k=>({r:k,todo:"Signer le bulletin SACEM",ext:true,step:id}));
    if(!S.sacem.sigs.pds) l.push({r:"dg",todo:"Signer le bulletin pour PDS Éditions",step:id});
    return l;}}
  if(id==="sacem"&&ph(id)===3&&S.sacem.rejected) return [{r:ownerOf(s),todo:"Préparer une nouvelle déclaration",step:id}];
  if(id==="framing"){const n=QA.length-answered();todo=n>1?`Répondre aux ${n} questions`:"Répondre à la question";}
  if(id==="confirm"&&S.reopened) todo="Confirmer à nouveau le dossier";
  const r=byOf(s,a);
  if(id==="borrow"&&ph(id)===1&&S.borrow.refused) return [{r,todo:"Décider de la suite",step:id}];
  if(id==="borrow"&&ph(id)===1&&S.borrow.round>0&&!S.borrow.counterSent&&!S.borrow.mail) return [{r,todo:"Envoyer la contre-proposition",step:id}];
  if(id==="borrow"&&((ph(id)===1&&S.borrow.mail)||(ph(id)===4&&(S.files.borrow||{}).byMail))) return [{r,todo:ph(id)===1?"Vérifier leur réponse":"Vérifier la licence signée",step:id}];
  if(a.waitFor) return [{r,todo,wait:true,waitWho:WAITERS[a.waitFor]||P[a.waitFor].name,waitText:a.waitText,step:id}];
  return [{r,todo,step:id}];
}
const allActors=()=>STEPS.filter(s=>active(s)&&!isObsolete(s)).flatMap(s=>actorsOf(s.id)).concat(invActors());
const myActs=()=>allActors().filter(a=>a.r===me()&&!a.wait);
// « de » elides before a vowel: « En attente d'Éditions Nocturne ».
const deOf=n=>(/^[AEIOUÉÈÊÀ]/i.test(n)?"d'":"de ")+n;
const low=t=>t?t.charAt(0).toLowerCase()+t.slice(1):"";
const waitLine=a=>a.wait?`En attente ${deOf(a.waitWho).slice(0,-a.waitWho.length)}<b>${esc(a.waitWho)}</b> : ${esc(a.waitText)}`:`En attente de <b>${esc(P[a.r].name)}</b>${P[a.r].where==="lien"?" (lien privé)":""} : ${esc(low(a.todo))}`;
function summary(id){
  switch(id){
    case "inv":{const c=invCounts();return `${c.known} connus · ${c.confirm} à confirmer · ${c.missing} manquants`;}
    case "framing":return answered()===1?"1 réponse enregistrée":`${answered()} réponses enregistrées`;
    case "confirm":return "Dossier confirmé";
    case "plan":{const n=STEPS.filter(s=>s.demarche&&active(s)&&!isObsolete(s)).length;return n>1?`${n} démarches lancées`:"1 démarche lancée";}
    case "track":return "Toutes les démarches sont faites";
    case "sami":case "yanis":case "ines":return noDeal(id)?"Pas d'accord nécessaire":S.inv[id]?`Contrat signé · ${low(INV_LABEL[invState(id)][1])}`:"Contrat signé";
    case "borrow":return S.borrow.outcome==="withdrawn"?"Élément retiré du titre":S.borrow.outcome==="nothing"?"Rien à autoriser":"Autorisation finalisée";
    case "split":return "Confirmée par tous";
    case "sacem":return "Enregistrée par la SACEM · preuve gardée";
    case "ready":return S.delivered?"Livrée au distributeur":"Sortie validée";
  }
  return "";
}
// One line of state for a démarche, the same in the spine and in the Suivi.
function stateText(s){
  const st=statusOf(s.id), acts=actorsOf(s.id);
  if(st==="obsolete") return "Obsolète · "+(S.obsolete[s.id]||"plus dans le dossier");
  if(st==="blocked") return "Après : "+s.prereq.filter(p=>!preOk(p)).map(preLabel).join(", ");
  if(st==="done") return summary(s.id);
  if(!acts.length) return "";
  if(acts[0].wait) return `En attente ${deOf(acts[0].waitWho)} · ${acts[0].waitText}`;
  return `${acts.map(a=>P[a.r].name).join(" et ")} · ${low(acts[0].todo)}`;
}
// Ticket 07's « Décision requise »: a direction's decision, a refusal, a SACEM answer to handle, a démarche to add.
const isDecision=s=>isLate(s)||actorsOf(s.id).some(x=>x.r==="dg")||(s.id==="borrow"&&!!S.borrow.refused)||(s.id==="sacem"&&!!(S.sacem.rejected||S.sacem.fix));
function trackGroups(){
  const g={now:[],dec:[],ext:[],quiet:[]};
  STEPS.filter(s=>s.demarche&&active(s)).forEach(s=>{
    const st=statusOf(s.id), a=actorsOf(s.id);
    if(st==="obsolete"||st==="done"||st==="blocked") g.quiet.push(s);
    else if(overdue(s)||a.some(x=>x.r==="dg")||(s.id==="borrow"&&S.borrow.refused)||(s.id==="sacem"&&(S.sacem.rejected||S.sacem.fix))) g.dec.push(s);
    else if(a.length&&a.every(x=>x.wait||x.ext)) g.ext.push(s);
    else g.now.push(s);
  });
  STEPS.filter(isLate).forEach(s=>g.dec.push(s));
  return g;
}

    let h=PERSON[k].reseau?`<p class="note">${esc(P[k].name)} est dans le Réseau : son lien ne lui demande que ce qui manque à son contrat. La rémunération lui est montrée pour qu'il la confirme.</p>`
      :`<p class="note">La fiche demande à ${esc(P[k].name)} son rôle, puis ce que le contrat ne sait pas encore.</p>`;
    h+=`<h3 class="sub">Déjà connu, pré-rempli dans sa fiche</h3><div class="rows">${PERSON[k].known.map(r=>fact(r[0],esc(r[1]),esc(r[2]))).join("")}${PERSON[k].pay?fact("Rémunération, à confirmer",esc(PERSON[k].pay.v),esc(PERSON[k].pay.src)):""}</div>`;
    if(ro) return h;
    const l=S.links[k], r=PERSON[k].reseau;
    if(l) return h+`<p class="note">Envoyez ce lien à ${esc(P[k].name)} par votre canal habituel, puis dites-le : l'étape passera en attente de sa fiche.</p>${linkInline(k)}
      <div class="btnrow"><button class="btn" type="button" data-act="do" data-step="${k}">Marquer comme envoyée</button><button class="btn out" type="button" data-act="copy" data-v="${esc(l.url)}">Copier le lien</button></div>`;
    if(r) return h+mailCard(s,{to:[[P[k].name,r.mail]],toSrc:"Réseau",subject:"« Néons » : quelques informations pour votre contrat",
        body:`Bonjour ${P[k].name.split(" ")[0]}, PDS prépare la sortie de « Néons » de Mona Lys et a besoin de quelques informations pour votre contrat. Tout se fait depuis votre lien privé, sans compte. Lina Haddad, PDS`,links:[[P[k].name,null]],note:""})
      +`<div class="btnrow"><button class="btn" type="button" data-act="do" data-step="${k}">Envoyer la fiche à ${esc(P[k].name)}</button><button class="btn out" type="button" data-act="mklink" data-step="${k}">Copier le lien plutôt</button></div>`;
    return h+`<div class="callout info">${I.info}<span>PDS OS n'a pas encore l'adresse de ${esc(P[k].name)} : c'est justement la fiche qui la recueille. Créez le lien, envoyez-le-lui par votre canal habituel, puis marquez la fiche comme envoyée.</span></div>
      <div class="btnrow"><button class="btn" type="button" data-act="mklink" data-step="${k}">Créer le lien de la fiche</button></div>`;
  },
  fiche(){return "";},
  review(s){
    const k=pk(s), f=ficheOf(k), diff=f.fNom&&f.fNom!==P[k].name, need=ficheNeeds(k), miss=need.filter(x=>!x.ok);
    const skip=["fNom","fArt","fPayNote","fAs","roles"];
    const newRows=Object.keys(FIELD).filter(x=>!skip.includes(x)&&f[x]).map(x=>fact(FIELD[x][0],x==="fIban"&&me()!=="dg"?esc(maskIban(f[x]))+" · visible par la direction seulement":esc(f[x]),x==="fIban"||x==="fBic"||x==="fHolder"?`Fourni par ${esc(P[k].name)} · gardé dans sa fiche du Réseau`:`Fournie par ${esc(P[k].name)}, dans sa fiche`));
    let h=`${diff?`<h3 class="sub">Corrections à vérifier</h3><div class="rows">${fact(FIELD.fNom[0],`« ${esc(P[k].name)} » → « <b>${esc(f.fNom)}</b> »`,`Corrigé par ${esc(P[k].name)} dans sa fiche · rien n'est appliqué avant votre accord`)}</div>`:""}
      <h3 class="sub">Nouvelles informations${PERSON[k].reseau?" · ajoutées à sa fiche Réseau":""}</h3><div class="rows">${fact("Rôle sur le projet",esc((f.roles||[]).join(", ")),"Choisi par "+esc(P[k].name))}${fact("Intervient en tant que",esc(f.fAs||"Personne"),"")}${newRows.join("")}${f.fPayNote?fact("Remarque sur la rémunération",`« ${esc(f.fPayNote)} »`,""):""}</div>`;
    if(miss.length) return h+`<div class="callout warn">${I.warn}<span><b>Reçue, pas complète.</b> Il manque à la fiche : ${esc(miss.map(x=>x.l).join(", "))}. Elle ne se valide qu'une fois complète.</span></div>
      ${fieldIn("askMsg-"+k,"Message à "+P[k].name,`Bonjour ${P[k].name.split(" ")[0]}, il manque à votre fiche : ${miss.map(x=>x.l).join(", ")}.${miss.some(x=>x.x==="fIpi")?" Vous le trouvez sur vos relevés SACEM.":""} Complétez-la depuis votre lien privé, le même qu'avant. Lina Haddad, PDS`,{area:true,rows:3,src:"Envoyé par PDS OS, avec son lien privé : il ne verra que ce qui manque."})}
      ${errOf("review")}<div class="btnrow">${btn("ficheask","Redemander ce qui manque",{step:k})}</div>`;
    return h+(diff?`<div class="btnrow"><button class="btn" type="button" data-act="do" data-step="${s.id}">Accepter les corrections et valider</button><button class="btn out" type="button" data-act="do" data-step="${s.id}" data-v="keep">Garder les anciennes valeurs</button></div>`:primary(s,"Valider la fiche"));
  },
  contract(s,ro){
    const k=pk(s), list=contractVals(k), miss=list.filter(x=>!x.v).length, deciding=ph(k)===4;
    const own=!ro&&!deciding&&me()===ownerOf(s);
    const cl=S.clauses[k]||[];
    let h=`<div class="doccard"><div class="dochead">${I.file}<span class="grow"><b>${esc(docName(k))}</b><br><span class="src">Généré depuis les valeurs ci-dessous · ${miss} bloquante${miss>1?"s":""} sur ${list.length} · chaque valeur se corrige à sa source</span></span><button class="btn out sm" type="button" data-act="pdf">Voir le PDF</button></div>
      ${cl.length?`<div class="docchg">${I.info}<span><b>Changé depuis la v1</b> : ${cl.map(c=>`clause « ${esc(c.clause)} » (${esc(c.by)}, v${c.v}) : « ${esc(c.text)} »`).join(" · ")}</span></div>`:""}
      ${valRows(k,list,own)}</div>${moneyFact(k)?`<div class="rows">${moneyFact(k)}</div>`:""}`;
    if(ro) return h;
    if(deciding) return h+`<p class="note">Vous décidez sur ce document, tel qu'il partira. Une valeur fausse se corrige à sa source ; un texte à changer, c'est une clause.</p>`+primary(s,"Valider le document")+altBlock(s,s.acts[4]);
    h+=`<details class="vcard" ${S.draft["clauseOpen-"+k]||S.err["clauseText-"+k]||S.err["clauseWhy-"+k]?"open":""}><summary data-act="clauseopen" data-step="${k}"><span class="chv">${I.chevR}</span><h3>Modifier une clause</h3><span class="cap">Crée une nouvelle version du document</span></summary><div class="vb">
      <div class="field"><label for="clause-${k}">Clause</label><select class="in" id="clause-${k}">${["Crédit","Durée","Territoire","Rémunération","Exclusivité","Autre"].map(c=>`<option ${dv("clause-"+k,"Crédit")===c?"selected":""}>${c}</option>`).join("")}</select></div>
      ${fieldIn("clauseText-"+k,"Nouvelle rédaction","",{req:true,area:true,rows:2,ph:"« co-composé par Sami Kader » figure sur toutes les exploitations."})}
      ${fieldIn("clauseWhy-"+k,"Pourquoi","",{req:true,ph:"Demande de la direction du 19/10."})}
      <div class="btnrow">${btn("clause","Créer la nouvelle version",{cls:"out sm",step:k})}${btn("clauseex","Remplir avec un exemple",{cls:"ghost sm",step:k})}</div></div></details>`;
    return h+primary(s,S.ret[s.id]?"Répondre et transmettre à nouveau":"Soumettre à la direction");
  },
  send(s){
    const m=mailOf(s.id), other=S.draft["sendOther-"+s.id], how=dv("sendHow","Remis en main propre");
    let h=mailCard(s,m);
    if(other) return h+`<fieldset class="pick"><legend class="lbl2"><b>Comment l'avez-vous remis ?</b> *</legend><div class="opts">${["Remis en main propre","Envoyé par un outil de signature","Envoyé depuis ma messagerie"].map(o=>`<label class="opt"><input type="radio" name="sendHow" value="${o}" ${how===o?"checked":""}><span class="grow">${o}</span></label>`).join("")}</div></fieldset>
      ${fieldIn("sendDate","Le",dv("sendDate",today()),{type:"date",req:true,src:esc(frDate(dv("sendDate",today())))})}
      <div class="btnrow"><button class="btn" type="button" data-act="do" data-step="${s.id}" data-v="other">Noter la remise</button><button class="btn ghost sm" type="button" data-act="sendother" data-step="${s.id}" data-v="">Annuler</button></div>`;
    return h+`<div class="btnrow"><button class="btn" type="button" data-act="do" data-step="${s.id}">${s.id==="borrow"?"Envoyer aux ayants droit":"Envoyer à "+esc(P[s.id].name)}</button><button class="btn out" type="button" data-act="sendother" data-step="${s.id}" data-v="1">Je l'ai remis autrement</button></div>`;
  },
  signed(s,ro,waiting){
    const n=s.id==="borrow"?"Licence":"Contrat", who=s.id==="borrow"?"Nocturne_Velvet":P[s.id].name.split(" ")[1], f=S.files[s.id]||{};

      <h3 class="sub">Vérification de la signature</h3>${checkList([
        {ok:true,label:"Version signée",detail:`v${docVersion(k)}, la version validée par la direction et envoyée${S.sent[k]?" le "+S.sent[k].at:""} · comparée par le code`},
        {ok:true,label:"Signataire",detail:`${civilOf(k)} · déposé par son lien privé, envoyé à ${to} (sa fiche)`},
        {ok:!!pds,block:true,label:"Signature pour PDS",detail:pds?`Claire Morel, directrice générale, habilitée à signer pour PDS Records · le ${pds.at}`:"Manquante : Claire Morel, habilitée à signer pour PDS Records, doit signer"},
        {ok:true,label:"Dispositifs de signature",detail:`${P[k].name} : signature manuscrite, document scanné et déposé · PDS : signature électronique simple dans PDS OS, horodatée. Une confirmation dans PDS OS n'est jamais une signature.`}])}
      ${ro?"":`<label class="checks" style="display:flex;flex-direction:row;align-items:flex-start;gap:10px;font-size:15px"><input type="checkbox" id="sigId-${k}" ${dv("sigId-"+k,false)?"checked":""} style="width:18px;height:18px;accent-color:var(--sel)"><span>J'ai vérifié que la signature est bien celle de ${esc(civilOf(k))}, sur chaque page à parapher *</span></label>${errOf("sigId-"+k)}`+primary(s,"Marquer comme signé")}`;}
    if(f.byMail) return `<h3 class="sub">Reçue par e-mail</h3><div class="rows">${fact("Licence signée",`<b>${esc(f.signed)}</b>`,`Pièce jointe de ${esc(f.from)}, reçue le ${esc(f.at)}`,{side:`<button class="btn ghost sm" type="button" data-act="pdf">Voir le PDF</button>`})}${fact("Preuve de signature","L'e-mail de retour, horodaté","Gardé dans l'historique")}</div>${readNote}
      <p class="note">Vérifiez que c'est bien la licence envoyée, signée, avant de finaliser l'autorisation.</p>`+primary(s,"Marquer l'autorisation comme finalisée");
    if(s.id==="borrow"&&waiting===true) return `<div class="btnrow">${protoArrive("licence","faire arriver la licence signée")}</div><details class="vcard" ${S.err["file-signed"]||S.err["file-proof"]?"open":""}><summary><span class="chv">${I.chevR}</span><h3>La licence signée est arrivée par un autre canal ?</h3></summary><div class="vb">${pickFile(s,"signed",n+" signée",`${n}_${who}_Neons_signee.pdf`)}${pickFile(s,"proof","Preuve de signature",`Retour_signe_${who}.eml`)}${primary(s,"Marquer l'autorisation comme finalisée")}</div></details>`;
    return `<h3 class="sub">${waiting==="other"?"Le signé vous est parvenu autrement ?":waiting?"Le signé est arrivé ?":"Signé et preuve"}</h3>${pickFile(s,"signed",n+(n==="Licence"?" signée":" signé"),`${n}_${who}_Neons_signe.pdf`)}${pickFile(s,"proof","Preuve de signature",`Retour_signe_${who}.eml`)}`
      +primary(s,s.id==="borrow"?"Marquer l'autorisation comme finalisée":"Marquer comme signé");
  },
  countersign(s){
    const k=s.id, f=S.files[k];
    return `<div class="doccard"><div class="dochead">${I.file}<span class="grow"><b>${esc(f.signed)}</b><br><span class="src">Signé par ${esc(P[k].name)}, déposé par son lien le ${esc(f.at)} · version ${docVersion(k)}, celle que vous avez validée</span></span>${btn("pdf","Voir le PDF",{cls:"out sm"})}</div></div>
      <div class="rows">${fact("Vous signez pour","<b>PDS Records SAS</b>","Habilitation : directrice générale, mandataire sociale · Équipe")}${fact("Dispositif","Signature électronique simple dans PDS OS","Horodatée, liée à votre compte et à l'empreinte de cette version")}</div>`+primary(s,"Signer le contrat pour PDS");
  },
  ask(s){
    const t=k=>dv("ask-"+k,true);

      <div class="field"><span class="lbl2"><b>Ce qui est repris</b></span><div class="pchips">${[["work","L'œuvre"],["rec","L'enregistrement"]].map(([k,l])=>`<button class="chipbtn" type="button" data-act="asktog" data-k="${k}" aria-pressed="${t(k)}" style="${t(k)?"border-color:var(--sel);background:var(--sel-bg)":""}">${t(k)?I.check:""}${l}</button>`).join("")}</div><span class="src">${repl?"Une version rejouée ne reprend que l'œuvre.":"Proposé par le code pour un sample : l'œuvre et l'enregistrement. À corriger si besoin."}</span></div>
      ${t("work")?sel("holderWork","Qui détient l'œuvre « Night Lights » ?",`Pas sûr ? <a href="https://repertoire.sacem.fr/" target="_blank" rel="noopener">Chercher « Night Lights » dans le répertoire SACEM</a> : l'éditeur y est indiqué`):""}
      ${t("rec")?sel("holderRec","Qui détient l'enregistrement original de « Night Lights » ?","Pas sûr ? Le titulaire est celui de la mention ℗ du disque de 1978, ou des crédits sur les plateformes"):""}

function invAct(a,el,before){
  const st=el.dataset.step, name=P[me()].name, d=x=>String(dv(x,"")).trim();
  switch(a){
    case "invpick": S.draft["invFile-"+me()]=INV_EX[me()].file; return true;
    case "invex":{const k=me();S.draft["invFile-"+k]=INV_EX[k].file;S.draft["invNum-"+k]=INV_EX[k].num;S.draft["invAmt-"+k]=String(PERSON[k].pay.n);return true;}
    case "invribtog": S.draft["invRibNew-"+me()]=!dv("invRibNew-"+me(),false); return true;
    case "invsend":{const k=me(), pay=PERSON[k].pay;let ok=true;
      if(!S.draft["invFile-"+k]){S.err["invFile-"+k]="Ajoutez votre facture en PDF.";ok=false;}
      if(!d("invNum-"+k)){S.err["invNum-"+k]="Indiquez le numéro de votre facture.";ok=false;}
      const amt=parseFloat(d("invAmt-"+k).replace(",",".").replace(/\s|€|HT/gi,""));
      if(isNaN(amt)){S.err["invAmt-"+k]="Indiquez le montant HT de votre facture.";ok=false;}
      const ribNew=dv("invRibNew-"+k,false);
      if(ribNew){if(!d("invIban-"+k)){S.err["invIban-"+k]="Indiquez votre nouvel IBAN.";ok=false;}if(!d("invBic-"+k)){S.err["invBic-"+k]="Indiquez le BIC.";ok=false;}}
      if(ok&&amt!==pay.n&&!d("invWhy-"+k)){S.draft["invGap-"+k]=true;if(S.draft["invGapSeen-"+k]) S.err["invWhy-"+k]="Expliquez l'écart pour envoyer la facture quand même.";S.draft["invGapSeen-"+k]=true;ok=false;}
      if(!ok) return true;
      const at=stamp();S.clock--;
      Object.assign(S.inv[k],{file:S.draft["invFile-"+k],num:d("invNum-"+k),amt,why:d("invWhy-"+k),at,due:addIso(today(),30),by:"link",ribNew:ribNew?{iban:d("invIban-"+k),bic:d("invBic-"+k)}:null,ribOk:null});
      hist(k,`Facture n° ${d("invNum-"+k)} déposée par son lien · ${euroHT(amt)}`,P[k].name);
      if(ribNew) hist(k,"Nouveau RIB indiqué sur la facture : à confirmer par la direction","PDS OS");
      S.flash={title:"Facture envoyée",lines:[`PDS la paie avant le ${esc(frDate(S.inv[k].due))}.${ribNew?" PDS vous appelle d'abord pour confirmer votre nouveau RIB.":""}`]};toast("Facture envoyée.");
      return true;}
    case "invotheropen": openDlg({kind:"invother",step:st}); return true;
    case "invopick": S.draft["invOFile-"+st]=INV_EX[st].file; return true;
    case "invother":{const k=st;let ok=true;
      if(!S.draft["invOFile-"+k]){S.err["invOFile-"+k]="Ajoutez la facture en PDF.";ok=false;}
      if(!d("invONum-"+k)){S.err["invONum-"+k]="Indiquez le numéro de la facture.";ok=false;}
      const amt=parseFloat(d("invOAmt-"+k).replace(",",".").replace(/\s|€|HT/gi,""));if(isNaN(amt)){S.err["invOAmt-"+k]="Indiquez le montant HT.";ok=false;}
      const day=String(dv("invODate-"+k,today()));if(!day){S.err["invODate-"+k]="Indiquez quand elle est arrivée.";ok=false;}
      if(!ok) return true;
      Object.assign(S.inv[k],{file:S.draft["invOFile-"+k],num:d("invONum-"+k),amt,why:amt!==PERSON[k].pay.n?"reçue autrement, écart à voir avec lui":"",at:frDate(day),due:addIso(day,30),by:"other",ribNew:null,ribOk:null});
      S.dlg=null;
      hist(k,`Facture n° ${d("invONum-"+k)} reçue autrement, ajoutée par ${name}`);
      S.flash={title:"Facture ajoutée",lines:[`Ensuite : <b>Claire Morel</b> · payer la facture de ${esc(P[k].name)} avant le ${esc(frDate(S.inv[k].due))}`]};toast("Facture ajoutée.");
      return true;}
    case "invrib":{const how=d("invRibHow-"+st);if(!how){S.err["invRibHow-"+st]="Dites comment vous l'avez vérifié : c'est ce qui protège le paiement.";return true;}
      S.inv[st].ribOk={by:name,how};hist(st,`Nouveau RIB de ${P[st].name} confirmé : « ${how} »`);toast("Nouveau RIB confirmé.");
      S.flash={title:"Nouveau RIB confirmé",lines:[`Ensuite : <b>Claire Morel</b> · payer la facture de ${esc(P[st].name)}`]};return true;}
    case "invproof": S.draft["invProof-"+st]=`Virement_${S.inv[st].num}.pdf`; return true;
    case "invpaid":{const k=st;let ok=true;
      if(invState(k)==="rib"){S.err["invPay-"+k]="Confirmez d'abord le nouveau RIB : on ne paie pas sur un RIB non vérifié.";return true;}
      const day=d("invPaidDate-"+k);if(!day){S.err["invPaidDate-"+k]="Indiquez la date du virement.";ok=false;}
      if(!S.draft["invProof-"+k]){S.err["invProof-"+k]="Ajoutez la preuve du virement.";ok=false;}
      if(!ok) return true;
      S.inv[k].paid={at:frDate(day),proof:S.draft["invProof-"+k],by:name};hist(k,`Facture n° ${S.inv[k].num} payée le ${frDate(day)} · ${euroHT(S.inv[k].amt)}`);
      S.flash={title:"Facture marquée payée",lines:[`${esc(P[k].name)} le voit sur son lien. Le Budget du projet passe à « Payé ».`]};toast("Facture marquée payée.");
      return true;}
  }
  return false;
}

    case "mklink":{hist(st,`Lien de la fiche créé pour ${P[st].name}`);S.links[st]=mkLink(null,"f");toast("Lien créé : copiez-le pour l'envoyer.");break;}
    case "pdf": toast("PDF non ouvert dans le proto."); return;
    case "copy": try{navigator.clipboard&&navigator.clipboard.writeText(el.dataset.v).catch(()=>{});}catch(_){} toast("Lien copié."); return;
    case "addnet": toast("Ouvre le formulaire du Réseau, sans quitter l'étape."); return;
    case "pickfile":{(S.files[st]=S.files[st]||{})[key]=el.dataset.v;break;}
    case "asktog": S.draft["ask-"+key]=!dv("ask-"+key,true); break;
    // Cadrage juridique
    case "qaread":{const i=S.qa.i; if(!String(qaText(i)).trim()){S.err["qaText-"+i]="Écrivez ou dictez votre réponse : PO ne lit que ce que vous dites.";break;}
      S.qa.reading=true; render(); setTimeout(()=>{S.qa.reading=false;S.qa.read[i]=true;render();},700); return;}
    case "qaex":{const i=S.qa.i, t=qaText(i);S.draft["qaText-"+i]=i===0&&t.includes(QA[0].example)?t.replace(/\s*$/,"")+" "+QA[0].example2:t.replace(/\s*$/,"")+(i===0?"\n":"")+QA[i].example;break;}
    case "qaremove": S.qa.removed[S.qa.i+":"+el.dataset.j]=true; break;
    case "qaback": S.qa.read[S.qa.i]=false; break;
    case "qanone": case "qasave":{const i=S.qa.i;
      S.qa.saved[i]=a==="qanone"?[]:qaFound(i,qaText(i)).filter(f=>!S.qa.removed[i+":"+f.j]);
      const n=S.qa.saved[i].length;
      hist("framing",a==="qanone"?`${QA[i].short} : ${low(QA[i].none)}`:`${QA[i].short} : ${n} information${n>1?"s":""} gardée${n>1?"s":""}`);
      if(answered()===QA.length){S.ph.framing=1;
        // After the launch, a correction recalculates: obsolete démarches, new ones proposed.
        if(S.launched){const gone=STEPS.filter(x=>x.demarche&&launchedWith(x.need)&&!known(x.need)&&!S.obsolete[x.id]);gone.forEach(x=>{S.obsolete[x.id]=`${P[x.need]?P[x.need].name:"l'élément"} n'est plus dans le dossier (correction du Cadrage par ${name})`;hist(x.id,"Démarche devenue obsolète",name,"Correction du Cadrage juridique");});
          const late=STEPS.filter(isLate);S.flash={title:"Réponse corrigée : le plan est recalculé",lines:gone.map(x=>`Obsolète : <b>${esc(x.title)}</b>`).concat(late.map(x=>`Apparue : <b>${esc(x.title)}</b> · à ajouter au plan dans le Suivi`)).concat(S.reopened?["Le dossier est à confirmer à nouveau."]:[])};toast("Plan recalculé.");}
        else after("framing",S.reopened?"Réponse corrigée : le dossier est à confirmer à nouveau":"Cadrage juridique enregistré : 2 réponses",before);}
      else{const nx=QA.findIndex((q,j)=>!S.qa.saved[j]);S.qa.i=nx;toast("Réponse enregistrée.");}
      break;}
    case "qafix":{const i=+el.dataset.i;delete S.qa.saved[i];S.qa.read[i]=false;S.qa.i=i;S.ph.framing=0;if(ph("confirm")&&!S.launched){S.ph.confirm=0;S.reopened=true;}S.sel="framing";break;}
    // Fiche (lien privé)
    case "frole":{const k=me(), r=fRoles(k), v=el.dataset.v;S.draft["fRoles-"+k]=r.includes(v)?r.filter(x=>x!==v):r.concat(v);break;}
    case "fnext":{const k=me();if(!fRoles(k).length){S.err["fRoles-"+k]="Choisissez au moins un rôle.";break;}S.ficheStep[k]="form";break;}
    case "fback": S.ficheStep[me()]=el.dataset.v; break;
    case "fex":{const k=me(), ex=PERSON[k].example;S.draft["fRoles-"+k]=PERSON[k].roles.slice();Object.keys(ex).forEach(x=>{if(x==="fAs") S.draft["fAs-"+k]=ex[x];else S.draft[(x==="fSoc"?"fSoc":x)+"-"+k]=ex[x];});S.draft["fConsent-"+k]=true;if((S.ficheStep[k]||"role")==="role") S.ficheStep[k]="form";break;}
    case "fverify":{const k=me();let ok=true;
      fFields(k).forEach(x=>{if(FIELD[x][1]&&!fVal(k,x)){S.err[x+"-"+k]=x==="fSiret"?"Nécessaire pour vous payer sur facture.":"Nécessaire à votre contrat.";ok=false;}});
      if(!dv("fConsent-"+k,false)){S.err["fConsent-"+k]="Cochez la case pour continuer.";ok=false;}
      if(ok) S.ficheStep[k]="verify"; break;}
    case "fsend":{const k=me(), vals={roles:fRoles(k),fAs:fAs(k)};fFields(k).forEach(x=>{vals[x]=fVal(k,x);});if(PERSON[k].reseau) vals.fMail=PERSON[k].reseau.mail;
      S.fiche[k]=vals; advance(k,null,P[k].name); S.flash={title:"Fiche envoyée",lines:["Reçu gardé chez PDS, daté. Lina Haddad la vérifie, puis votre contrat se prépare."]}; break;}
    case "sigex": break;
    case "fillask":{const k=me();S.ficheAsk[k].fields.forEach(x=>{S.draft[x+"-"+k]=x==="fIpi"?"00734 291 556":(PERSON[k].example[x]||"");});break;}
    case "ficheask":{const k=st, miss=ficheNeeds(k).filter(x=>!x.ok);S.ficheAsk[k]={at:stamp(),fields:miss.map(x=>x.x)};S.clock--;
      hist(k,`Complément demandé à ${P[k].name} par PDS OS : ${miss.map(x=>x.l).join(", ")}`);after(k,"Complément demandé",before);break;}
    case "fcomplete":{const k=me(), x=S.ficheAsk[k];let ok=true;x.fields.forEach(f=>{if(!fVal(k,f)){S.err[f+"-"+k]="Nécessaire à votre contrat.";ok=false;}});if(!ok) break;
      S.fiche[k]=Object.assign({},ficheOf(k),Object.fromEntries(x.fields.map(f=>[f,fVal(k,f)])));delete S.ficheAsk[k];
      hist(k,"Fiche complétée par son lien privé",P[k].name);S.flash={title:"Fiche complétée",lines:["Merci. Lina Haddad la vérifie, puis votre contrat se prépare."]};toast("Fiche complétée.");break;}
    default: invAct(a,el,before);
  }
  render();
});

/* Proto controls: who is looking, and jumping to key moments. ---------------- */
function forceTo(id,n){const s=STEP(id);while(ph(id)<n){const a=s.acts[ph(id)];S.ph[id]=ph(id)+1;hist(id,a.done,a.by==="conf"?"Le code":P[byOf(s,a)].name);S.when[id]=Object.assign(S.when[id]||{},{[ph(id)]:S.log[0].at});}}
function qaAll(){QA.forEach((q,i)=>{S.draft["qaText-"+i]=q.start.replace(/\s*$/,"")+(i===0?"\n":"")+q.example;S.qa.read[i]=true;S.qa.saved[i]=qaFound(i,qaText(i));hist("framing",`${q.short} : ${S.qa.saved[i].length} informations gardées`,"Lina Haddad");});S.ph.framing=1;}
function mapAll(){S.imported.yanis={name:IMPORTED.name,file:IMPORTED.file,roles:["Musicien·ne","Choriste"],sent:true,validated:true};hist("plan",`Modèle « ${IMPORTED.name} » validé : il entre dans la bibliothèque`,"Claire Morel");
  S.map.sami={model:LIBRARY[0].name};S.map.yanis={model:IMPORTED.name,imported:true};S.mapConfirmed={by:"Lina Haddad",at:stamp()};S.clock--;hist("plan","Contrats nécessaires confirmés : 2","Lina Haddad");}
function launch(){STEPS.filter(x=>x.demarche).forEach(x=>{S.keep[x.id]=true;S.resp[x.id]="cp";});S.launched=true;S.launchKnown=[...new Set(STEPS.filter(x=>x.demarche&&known(x.need)).map(x=>x.need))];S.ph.plan=1;hist("plan","Plan d'action lancé : 5 démarches","Lina Haddad");}
function base(){qaAll();forceTo("confirm",1);mapAll();launch();}
function personTo(k,n){if(n>=1){S.links[k]=mkLink(stamp(),"f");S.links[k].sent=PERSON[k].reseau?`envoyé par PDS OS à ${PERSON[k].reseau.mail} le ${S.links[k].at}`:`envoyé par Lina Haddad le ${S.links[k].at}`;}
  if(n>=2) S.fiche[k]=Object.assign({roles:PERSON[k].roles.slice()},PERSON[k].example);
  if(n>=6) S.sent[k]={how:"Envoyé par PDS OS",to:PERSON[k].example.fMail||PERSON[k].reseau.mail,at:stamp()};forceTo(k,n);if(n>=2) S.links[k].opened=whenOf(k,2);
  if(n>=7){S.pdsSig[k]={at:S.log[0].at};if(PERSON[k].pay&&!noDeal(k)) invAsk(k);}}
function borrowTo(n){S.draft.holderWork="nocturne";S.draft.holderRec="velvet";if(n>=2){S.draft[replyId()]=REPLIES[0];S.borrow.read=true;S.borrow.mail={from:"Hélène Brun · Éditions Nocturne",at:stamp()};S.borrow.terms=termsFound(REPLIES[0]);}if(n>=4) S.sent.borrow={how:"Envoyé par PDS OS",to:"h.brun@editions-nocturne.fr, licensing@velvet-records.com",at:stamp()};forceTo("borrow",n);}
function splitTo(n){S.split.pubs={sami:pubDefault("sami")};S.split.parts={mona:50,sami:25,pds:25};S.split.versions=[{v:1,parts:Object.assign({},S.split.parts),why:"",at:stamp()}];
  if(n>=2){const at=stamp();S.split.links={};splitConfirmers().forEach(k=>{S.split.links[k]=mkLink(at,"s");S.split.links[k].sent="envoyé par PDS OS le "+at;});}
  if(n>=3){S.split.conf={};S.split.answers={1:{}};splitConfirmers().forEach(k=>{S.split.conf[k]="ok";S.split.answers[1][k]="ok";});}forceTo("split",n);}
function sacemTo(n){S.draft["sac-genre"]="Variétés / pop";S.draft["sac-partsok"]=true;S.draft["sac-firstok"]=true;S.masterFinal=S.masterFinal||frDate(today());
  S.sacem.v=1;S.sacem.versions=[{v:1,at:stamp()}];S.clock--;forceTo("sacem",Math.min(n,1));
  if(n>=2){S.sacem.sent=stamp();sacemSigners().forEach(k=>{S.sacem.sigs[k]=k==="pds"?{at:stamp(),how:"Signé dans l'app par Claire Morel, habilitée",proof:"Signature dans PDS OS, horodatée"}:{at:stamp(),how:"Signé et déposé par son lien privé",proof:`Bulletin_725_Neons_v1_signe_${k}.pdf`};});forceTo("sacem",2);}
  if(n>=3){S.files.sacem={deposit:"Accuse_depot_SACEM_Neons.pdf"};forceTo("sacem",3);}
  if(n>=4){S.files.sacem.regproof="Confirmation_SACEM_Neons.pdf";S.sacem.proof="Confirmation_SACEM_Neons.pdf";S.sacem.ref="0412 775 931 00";S.sacem.iswc="T-930.412.775-1";forceTo("sacem",4);}}
function payable(k){Object.assign(S.inv[k],{file:INV_EX[k].file,num:INV_EX[k].num,amt:PERSON[k].pay.n,why:"",at:stamp(),due:addIso(today(),30),by:"link",ribNew:null,ribOk:null});hist(k,`Facture n° ${INV_EX[k].num} déposée par son lien · ${euroHT(PERSON[k].pay.n)}`,P[k].name);}
const SCEN={
  start(){},
  confirm(){qaAll();S.sel="confirm";},
  plan(){qaAll();forceTo("confirm",1);S.sel="plan";},
  launched(){base();personTo("sami",1);personTo("yanis",1);},
  direction(){base();personTo("sami",4);personTo("yanis",2);borrowTo(2);S.role="dg";},
  modified(){base();personTo("sami",4);personTo("yanis",2);const n=STEP("sami").acts[4].alt.ex;
    S.ph.sami=3;hist("sami",`Demander des modifications : « ${n} »`,"Claire Morel");S.ret.sami={who:"Claire Morel",label:"Demander des modifications",note:n};S.sel="sami";},
  refusal(){base();personTo("sami",2);borrowTo(1);S.draft[replyId()]=REFUSAL;S.borrow.mail={from:"Hélène Brun · Éditions Nocturne",at:stamp()};S.borrow.read=true;S.borrow.refused=true;hist("borrow","Refus des ayants droit reçu et rattaché par PDS OS","PDS OS");S.sel="borrow";},
  incomplete(){base();personTo("sami",2);delete S.fiche.sami.fIpi;personTo("yanis",1);S.sel="sami";},
  missingsig(){base();personTo("sami",6);personTo("yanis",2);S.files.sami={signed:"Contrat_Kader_Neons_v1_signe.pdf",byLink:true,at:stamp()};hist("sami","Contrat signé déposé par son lien privé","Sami Kader");S.sel="sami";},
  split(){base();S.map.sami={model:"Contrat de co-édition"};personTo("sami",7);S.fiche.sami.fPub2="Éditions Lumen";personTo("yanis",7);borrowTo(5);S.sel="split";},
  nopub(){base();S.map.sami={none:true,reason:"Sami Kader n'a pas d'éditeur et garde l'édition de sa part : aucun contrat d'édition, sa contribution est couverte par la répartition qu'il confirme"};personTo("sami",3);personTo("yanis",7);borrowTo(5);S.sel="split";},
  contest(){base();personTo("sami",7);personTo("yanis",7);borrowTo(5);splitTo(2);S.split.answers={1:{mona:"ok",sami:"contest"}};S.split.conf={sami:"contest"};S.ph.split=0;S.split.v=2;
    const n="J'ai composé la moitié de la musique : 25 % ne correspond pas à ma part, je demande 30 %.";hist("split","Répartition confirmée (version 1)","Mona Lys");hist("split",`Répartition contestée : « ${n} »`,"Sami Kader");S.ret.split={who:"Sami Kader",label:"Contester",note:n};S.sel="split";},
  sacemfix(){base();personTo("sami",7);personTo("yanis",7);borrowTo(5);splitTo(3);sacemTo(3);const n="Le genre « Variétés / pop » ne correspond pas à l'œuvre déclarée : précisez-le.";
    S.sacem.fix={field:"genre",note:n,at:stamp()};S.ph.sacem=0;S.sacem.sent=null;delete S.draft["sac-genre"];hist("sacem",`La SACEM demande une correction : « ${n} » · la v1 et ses signatures seront remplacées`,"Lina Haddad");S.sel="sacem";},
  validated(){base();personTo("sami",7);personTo("yanis",7);borrowTo(5);splitTo(3);sacemTo(3);payable("yanis");S.finalOk=stamp();hist("ready","Sortie validée avant The Orchard : la Distribution peut livrer","Claire Morel");S.role="dg";S.sel="ready";},
  overdue(){base();S.today="2026-10-22";personTo("sami",2);personTo("yanis",1);borrowTo(1);S.sel="borrow";},
  correction(){base();personTo("sami",3);personTo("yanis",2);borrowTo(2);S.sel="framing";},
  sacem(){base();personTo("sami",7);personTo("yanis",7);borrowTo(5);splitTo(3);S.sel="sacem";},
  invoice(){base();personTo("sami",7);personTo("yanis",7);borrowTo(5);splitTo(3);
    Object.assign(S.inv.yanis,{file:INV_EX.yanis.file,num:INV_EX.yanis.num,amt:250,why:"",at:stamp(),due:addIso(today(),30),by:"link",ribNew:Object.assign({},NEW_RIB),ribOk:null});
    hist("yanis",`Facture n° ${INV_EX.yanis.num} déposée par son lien · ${euroHT(250)}`,"Yanis Morel");hist("yanis","Nouveau RIB indiqué sur la facture : à confirmer par la direction","PDS OS");S.role="dg";},
  ready(){base();personTo("sami",7);personTo("yanis",7);borrowTo(4);splitTo(3);S.role="dg";S.sel="ready";}
};
document.getElementById("roleSel").addEventListener("change",e=>{S.modal=null;S.dlg=null;S.role=e.target.value;S.sel=null;S.flash=null;S.editing=null;S.view="parcours";if(P[S.role].where==="lien") markOpened(S.role);render();window.scrollTo({top:0});});
document.getElementById("scenSel").addEventListener("change",e=>{document.getElementById("toast").hidden=true;S=fresh();SCEN[e.target.value]();S.flash=null;render();window.scrollTo({top:0});});
document.getElementById("resetBtn").addEventListener("click",()=>{document.getElementById("toast").hidden=true;S=fresh();document.getElementById("scenSel").value="start";render();window.scrollTo({top:0});});
render();
})();
