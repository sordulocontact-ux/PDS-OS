<title>Production externe V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@500;600;700&display=swap">
<style>
/* Layout: PDS OS shell (main nav, project nav) and, in every module, the same
   guided pattern — « Maintenant », the journey on the left, the open step on the
   right. Tokens mirror app/globals.css. */
:root{
  --app:#fbfbfb; --page:#ffffff; --raised:#ffffff; --soft:#f4f4f4; --sunken:#ececec;
  --inverse:#000; --inverse-fg:#fff;
  --text:#000; --text-2:#5e5e5e; --text-3:#767676; --muted:#afafaf;
  --hair:#ececec; --border:#d4d4d4; --field:#dcdcdc; --hover-border:#afafaf;
  --sel:#155dfc; --sel-bg:rgb(21 93 252 / .07);
  --info-bg:#e2eefc; --info-fg:#0b3d8c; --warn-bg:#fcefd2; --warn-fg:#6e4300;
  --ok-bg:#daf3e2; --ok-fg:#0d5226; --bad-bg:#fce1df; --bad-fg:#9a1b1b;
  --act-bg:#ece1fb; --act-fg:#4c1d9e; --neutral-bg:#ececec; --neutral-fg:#111;
  --glass:rgb(24 24 24 / .86); --glass-fg:#fff; --glass-2:#bdbdbd;
  --shadow:0 1px 2px rgb(0 0 0 / .04), 0 8px 24px rgb(0 0 0 / .06);
  --font:"Google Sans Flex","Google Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --app:#0a0a0a; --page:#0f0f0f; --raised:#161616; --soft:rgb(255 255 255 / .05); --sunken:rgb(255 255 255 / .08);
  --inverse:#ededed; --inverse-fg:#0f0f0f; --text:#ededed; --text-2:#a8a8a8; --text-3:#8f8f8f; --muted:#5e5e5e;
  --hair:rgb(255 255 255 / .08); --border:rgb(255 255 255 / .12); --field:rgb(255 255 255 / .14); --hover-border:rgb(255 255 255 / .28);
  --sel:#3b7bff; --sel-bg:rgb(59 123 255 / .16);
  --info-bg:#12233d; --info-fg:#9ec5ff; --warn-bg:#33260c; --warn-fg:#f5c869; --ok-bg:#0f2e1c; --ok-fg:#7fdca0;
  --bad-bg:#3a1616; --bad-fg:#ff9b94; --act-bg:#2a1c47; --act-fg:#c9b2ff; --neutral-bg:#262626; --neutral-fg:#d4d4d4;
  --glass:rgb(40 40 40 / .9); --glass-fg:#f2f2f2; --glass-2:#a8a8a8; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --app:#0a0a0a; --page:#0f0f0f; --raised:#161616; --soft:rgb(255 255 255 / .05); --sunken:rgb(255 255 255 / .08);
  --inverse:#ededed; --inverse-fg:#0f0f0f; --text:#ededed; --text-2:#a8a8a8; --text-3:#8f8f8f; --muted:#5e5e5e;
  --hair:rgb(255 255 255 / .08); --border:rgb(255 255 255 / .12); --field:rgb(255 255 255 / .14); --hover-border:rgb(255 255 255 / .28);
  --sel:#3b7bff; --sel-bg:rgb(59 123 255 / .16);
  --info-bg:#12233d; --info-fg:#9ec5ff; --warn-bg:#33260c; --warn-fg:#f5c869; --ok-bg:#0f2e1c; --ok-fg:#7fdca0;
  --bad-bg:#3a1616; --bad-fg:#ff9b94; --act-bg:#2a1c47; --act-fg:#c9b2ff; --neutral-bg:#262626; --neutral-fg:#d4d4d4;
  --glass:rgb(40 40 40 / .9); --glass-fg:#f2f2f2; --glass-2:#a8a8a8; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--app);color:var(--text);font-family:var(--font);font-weight:500;font-size:16px;line-height:1.5;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.04em;text-wrap:balance}
p{margin:0;text-wrap:pretty}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.cap{font-size:14px;color:var(--text-2)}
.t3{color:var(--text-3)}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.shell{display:grid;grid-template-columns:68px 200px minmax(0,1fr);min-height:100%}
.shell.noproj{grid-template-columns:68px minmax(0,1fr)}
.mainnav{position:sticky;top:0;height:100vh;border-right:1px solid var(--hair);background:var(--page);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px}
.brand{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--inverse);color:var(--inverse-fg);font-weight:700;font-size:12px;letter-spacing:0;margin-bottom:8px}
.navbtn{position:relative;width:44px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--text-2);border:0;background:none;cursor:pointer}
.navbtn.on{background:var(--sunken);color:var(--text)}
.navbtn[disabled]{opacity:.35;cursor:not-allowed}
.navbtn .cnt{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--inverse);color:var(--inverse-fg);font-size:10.5px;font-weight:700;display:grid;place-items:center;letter-spacing:0}
.navbtn .tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--inverse);color:var(--inverse-fg);font-size:13px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 120ms ease;z-index:20}
@media (hover:hover) and (pointer:fine){.navbtn:hover:not([disabled]){background:var(--soft);color:var(--text)}.navbtn:hover .tip{opacity:1}}
.mainnav .grow{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none;color:var(--text)}
.avatar.sm{width:24px;height:24px;font-size:10.5px}
.projnav{position:sticky;top:0;height:100vh;border-right:1px solid var(--hair);background:var(--page);padding:8px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.switcher{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 12px;border-bottom:1px solid var(--hair);margin-bottom:6px;font-weight:600}
.group{font-size:13px;color:var(--text-3);padding:12px 10px 4px}
.pitem{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:8px;color:var(--text-2);font-size:15px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.pitem.on{background:var(--sunken);color:var(--text)}
.pitem .grow{flex:1}
@media (hover:hover) and (pointer:fine){.pitem:hover{background:var(--soft);color:var(--text)}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.run{background:var(--sel)} .dot.wait{background:var(--warn-fg)} .dot.block{background:var(--bad-fg)} .dot.done{background:var(--ok-fg)}
.mine{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--sel);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.content{min-width:0;padding:28px 40px 130px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (max-width:1100px){.shell{grid-template-columns:68px minmax(0,1fr)}.projnav{display:none}}
@media (max-width:720px){.shell,.shell.noproj{grid-template-columns:minmax(0,1fr)}.mainnav{display:none}.content{padding:20px 16px 150px}}

/* Head */
.h1{font-size:30px;letter-spacing:-.04em}
.chevrons{display:flex;flex-wrap:wrap;gap:4px}
.chev{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--soft);color:var(--text-2);font-size:15px;border:0;cursor:pointer}
.chev.on{background:var(--inverse);color:var(--inverse-fg)}
.chev .ok{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok-fg)}
.chev .lock{opacity:.6}
.headrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--text-2)}
.facts b{color:var(--text);font-weight:600}

/* Pills, buttons */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--neutral-bg);color:var(--neutral-fg);white-space:nowrap}
.pill.info{background:var(--info-bg);color:var(--info-fg)} .pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)} .pill.bad{background:var(--bad-bg);color:var(--bad-fg)} .pill.act{background:var(--act-bg);color:var(--act-fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid transparent;background:var(--inverse);color:var(--inverse-fg);font-weight:600;font-size:15px;cursor:pointer;transition:transform 140ms var(--ease),background-color 160ms ease;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.out{background:transparent;color:var(--text);border-color:var(--border)}
.btn.ghost{background:transparent;color:var(--text-2)}
.btn.sm{height:32px;padding:0 14px;font-size:14px}
@media (hover:hover) and (pointer:fine){.btn.out:hover{border-color:var(--hover-border)}.btn.ghost:hover{background:var(--soft);color:var(--text)}}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Cards */
.card{background:var(--raised);border:1px solid var(--hair);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:20px} .card h3{font-size:16px;font-weight:600;letter-spacing:-.02em}
.now{border-color:var(--border);box-shadow:var(--shadow)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2);flex-wrap:wrap}
.now h2{font-size:22px}
.rowlist{display:flex;flex-direction:column;gap:8px}
.wr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--soft);font-size:15px}
.wr .grow{flex:1;min-width:0}
.flash{background:var(--ok-bg);color:var(--ok-fg);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.flash .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.flash button{background:none;border:0;color:inherit;cursor:pointer;padding:4px;border-radius:6px}

/* Layout + spine */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.spine{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px;padding:12px;background:var(--raised);border:1px solid var(--hair);border-radius:12px}
.spine h2{font-size:15px;color:var(--text-2);letter-spacing:-.02em;padding:4px 8px 8px}
.step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:9px 8px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;width:100%;position:relative}
.step:not(:last-child)::after{content:"";position:absolute;left:19px;top:34px;bottom:-6px;width:2px;background:var(--hair)}
.step.sel{background:var(--sunken)}
@media (hover:hover) and (pointer:fine){.step:not(.sel):hover{background:var(--soft)}}
.mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--border);background:var(--raised);position:relative;z-index:1;color:var(--text-3)}
.step.done .mark{background:var(--ok-bg);border-color:transparent;color:var(--ok-fg)}
.step.current .mark{border-color:var(--sel);background:var(--sel-bg)}
.step.current .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sel)}
.step.me .mark{border-color:var(--sel);background:var(--sel)} .step.me .mark::after{background:#fff}
.step.blocked .mark{border-style:dashed}
.step .t,.step .s{display:block}
.step .t{font-size:15px;font-weight:600;line-height:1.3}
.step.blocked .t{color:var(--text-3);font-weight:500}
.step .s{font-size:13.5px;color:var(--text-2);line-height:1.35;margin-top:2px}
.step .s.me{color:var(--sel);font-weight:600}
.dhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.dhead h2{font-size:22px}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px;border-radius:10px;background:var(--soft)}
@media (max-width:1200px){.meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.meta .k{font-size:13px;color:var(--text-3)} .meta .v{font-size:15px;line-height:1.35}
.okc{color:var(--ok-fg)} .noc{color:var(--text-3)}
.note{font-size:14.5px;color:var(--text-2)}
.po{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--act-fg);background:var(--act-bg);height:22px;padding:0 8px;border-radius:999px}
.callout{border-radius:10px;padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.callout.info{background:var(--info-bg);color:var(--info-fg)} .callout.warn{background:var(--warn-bg);color:var(--warn-fg)}
.callout.bad{background:var(--bad-bg);color:var(--bad-fg)} .callout.ok{background:var(--ok-bg);color:var(--ok-fg)}
.rows{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--hair);font-size:15px}
.row:last-child{border-bottom:0}
.row .src{font-size:13px;color:var(--text-3)}
.pick{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}.pick legend{padding:0;margin-bottom:2px}
.opts{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.opt{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--hair);cursor:pointer}.opt:last-child{border-bottom:0}.opt .grow{flex:1;min-width:0}
.opt input{accent-color:var(--sel);width:18px;height:18px;flex:none}.opt:has(input:checked){background:var(--sel-bg)}
.hist{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--text-2)}
.hist li{display:flex;gap:8px;align-items:flex-start}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.in{min-height:40px;border:1px solid var(--field);border-radius:8px;background:var(--raised);padding:8px 12px;width:100%}
textarea.in{min-height:64px;resize:vertical}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.lbl2{font-size:15px}
.drop{position:relative;display:flex;align-items:center;gap:12px;min-height:72px;padding:14px 16px;border:1.5px dashed var(--border);border-radius:10px;background:var(--soft);cursor:pointer;transition:border-color 150ms ease,background-color 150ms ease}
.drop.over{border-color:var(--sel);background:var(--sel-bg)} .drop.bad{border-color:var(--bad-fg)}
.drop:focus-within{outline:2px solid var(--sel);outline-offset:2px}
.drop .grow{flex:1;min-width:0;overflow-wrap:anywhere}
@media (hover:hover) and (pointer:fine){.drop:hover{border-color:var(--hover-border)}}
.vers{display:flex;flex-direction:column;gap:8px}
.field .src,.vers>.src{font-size:14px;color:var(--text-2)}
.linkbox{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}.linkbox code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;background:var(--raised);color:var(--text);padding:6px 10px;border-radius:8px;overflow-wrap:anywhere}
.qa{display:flex;flex-direction:column;gap:12px}.qh{font-size:18px;font-weight:600;letter-spacing:-.03em}
.ver{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--hair);font-size:15px}
.rows .ver:last-child{border-bottom:0}
.ver .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.ver-note{margin:0 14px 10px;border-radius:8px}
.play{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--inverse);color:var(--inverse-fg);display:grid;place-items:center;cursor:pointer;transition:transform 120ms var(--ease)}
.play:active{transform:scale(.94)} .play[aria-pressed="true"]{background:var(--sel);color:#fff}
.wave{display:block;height:3px;margin-top:6px;border-radius:2px;background:var(--hair);overflow:hidden}
.wave i{display:block;height:100%;width:100%;background:var(--sel);transform-origin:left;animation:wave 194s linear forwards}
@keyframes wave{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.wave i{animation:none;transform:scaleX(.3)}}
.in[aria-invalid="true"]{border-color:var(--bad-fg)}
.err{font-size:13px;color:var(--bad-fg)}

/* Overview + lists */
.wfgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.wfgrid{grid-template-columns:minmax(0,1fr)}}
.wf{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--hair);border-radius:12px;background:var(--raised);text-align:left;cursor:pointer}
@media (hover:hover) and (pointer:fine){.wf:hover{border-color:var(--hover-border)}}
.bar{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sel);border-radius:999px;transform-origin:left;transition:transform 300ms var(--ease)}
.table{border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--raised)}
.tr{display:grid;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--hair);font-size:15px}
.tr:last-child{border-bottom:0}
.tr.h{font-size:13.5px;color:var(--text-3);background:var(--soft)}
.tr.link{cursor:pointer}
@media (hover:hover) and (pointer:fine){.tr.link:hover{background:var(--soft)}}
@media (max-width:760px){.tr{grid-template-columns:minmax(0,1fr)!important}.tr.h{display:none}}
.cols4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.cols4{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--soft)}
.col h3{font-size:14px;color:var(--text-2);font-weight:600}
.chip{padding:10px 12px;border-radius:8px;background:var(--raised);border:1px solid var(--hair);font-size:14.5px}
.po-input{display:flex;gap:8px;align-items:center;padding:8px 8px 8px 16px;border:1px solid var(--border);border-radius:16px;background:var(--raised)}
.po-input input{flex:1;border:0;background:transparent;outline:none;min-width:0;height:36px}

/* Portal */
.portal{min-height:100%;background:var(--app)}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:1px solid var(--hair);background:var(--page);flex-wrap:wrap}
.pwrap{max-width:820px;margin:0 auto;padding:28px 16px 150px;display:flex;flex-direction:column;gap:18px}
.lockline{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-3)}

/* Proto bar & toast */
.proto{position:fixed;left:0;right:0;margin-inline:auto;width:fit-content;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--glass);color:var(--glass-fg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgb(0 0 0 / .25)}
.proto .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--glass-2);padding:0 6px}
.proto label{font-size:13px;color:var(--glass-2)}
.proto select{height:34px;border-radius:10px;border:1px solid rgb(255 255 255 / .18);background:rgb(255 255 255 / .08);color:var(--glass-fg);padding:0 10px;font-size:14px;max-width:280px}
.proto select option{color:#000;background:#fff}
.proto button{height:34px;border-radius:10px;border:1px solid rgb(255 255 255 / .18);background:none;color:var(--glass-fg);padding:0 12px;font-size:14px;cursor:pointer}
@media (max-width:720px){.proto label{display:none}.proto select{max-width:44vw}}
.toast{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--inverse);color:var(--inverse-fg);padding:12px 16px;border-radius:12px;font-size:15px;box-shadow:var(--shadow);max-width:min(420px,calc(100% - 40px));transition:opacity 180ms ease,transform 180ms var(--ease)}
.toast[hidden]{display:block!important;opacity:0;transform:translateY(8px);pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}

/* V2 — production externe selon le ticket d'Ibé du 15/10 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--hair);overflow-x:auto}
.tab{height:40px;padding:0 14px;border:0;background:none;color:var(--text-2);font-size:15px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.tab.on{color:var(--text);border-bottom-color:var(--text)}
.tab .n{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--sunken);font-size:12px;font-weight:700;display:grid;place-items:center}
.strip{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--hair);background:var(--raised);font-size:14px;cursor:pointer;color:var(--text)}
.chipbtn .d{width:8px;height:8px;border-radius:50%}
.d.bad{background:var(--bad-fg)} .d.warn{background:var(--warn-fg)} .d.info{background:var(--info-fg)}
.meta5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:14px;border-radius:10px;background:var(--soft)}
@media (max-width:1200px){.meta5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.meta5 .k{font-size:13px;color:var(--text-3)} .meta5 .v{font-size:15px;line-height:1.35}
.step.rework .mark{border-color:var(--warn-fg);background:var(--warn-bg)}
.step .flag{display:inline-flex;margin-left:6px;vertical-align:1px}
.kv{display:grid;grid-template-columns:180px minmax(0,1fr);gap:4px 14px;font-size:15px}
@media (max-width:720px){.kv{grid-template-columns:minmax(0,1fr)}}
.kv dt{color:var(--text-3);font-size:14px} .kv dd{margin:0}
.locs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.locs{grid-template-columns:minmax(0,1fr)}}
.loc{border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--raised);display:flex;flex-direction:column}
.loc.active{border-color:var(--ok-fg);box-shadow:0 0 0 1px var(--ok-fg)}
.loc .ph{height:96px;display:grid;place-items:end start;padding:8px;color:#fff;font-size:12px;font-weight:600}
.ph.p0{background:linear-gradient(135deg,#5b6170,#2f3540)} .ph.p1{background:linear-gradient(135deg,#d58a5b,#6b3a5a)} .ph.p2{background:linear-gradient(135deg,#e8e8e8,#b9bcc4);color:#222} .ph.p3{background:linear-gradient(135deg,#6d8f6a,#2f4a3a)}
.loc .bd{padding:12px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.grid2{grid-template-columns:minmax(0,1fr)}}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--sel);margin-top:2px;flex:none}
.syn .row .src{max-width:none}
.miss{color:var(--bad-fg);font-weight:600}
.dec .row{grid-template-columns:minmax(0,1fr) auto}
.contra{border:1px solid var(--warn-fg);border-radius:10px;overflow:hidden}
.contra .row{border-bottom:1px solid var(--hair)}
.strike{text-decoration:line-through;color:var(--text-3)}
select.in{height:40px}

<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="proto" role="region" aria-label="Commandes du prototype">

</div>

<script>
(function(){
"use strict";
const I={
  check:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>',
  lock:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>',
  spark:'<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1l1.6 4.4L14 7l-4.4 1.6L8 13l-1.6-4.4L2 7l4.4-1.6z"/></svg>',
  ok:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.2l2 2 4-4.4"/></svg>',
  warn:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 2l6.5 11.5h-13z"/><path d="M8 6.5v3M8 11.6v.1"/></svg>',
  stop:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M4 12l8-8"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  updown:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6l3-3 3 3M5 10l3 3 3-3"/></svg>',
  home:'<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 9l7-6 7 6v8H3z"/></svg>',
  work:'<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2.5" y="6" width="15" height="10.5" rx="2"/><path d="M7 6V4.5h6V6"/></svg>',
  folder:'<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 5.5h5l2 2h8v8.5h-15z"/></svg>',
  nodes:'<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="5" cy="5" r="2"/><circle cx="15" cy="7" r="2"/><circle cx="8" cy="15" r="2"/><path d="M6.7 6l6.4.6M14 8.8l-4.5 4.8M5.5 7l2 6"/></svg>',
  bell:'<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 14V9a5 5 0 0110 0v5l1.5 1.5h-13zM8.5 17.5h3"/></svg>'
};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro=n=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(n)+" € HT";
const ENVELOPE=18000;

/* People: accounts of PDS, or outside people through a private link. */
const P={
  cp:{name:"Lina Haddad",role:"Cheffe de projet",ini:"LH",where:"app"},
  charge:{name:"Tom Mercier",role:"Chargé de production",ini:"TM",where:"app"},
  dg:{name:"Claire Morel",role:"Directrice générale",ini:"CM",where:"app"},
  da:{name:"Nadia Benali",role:"Directrice créative",ini:"NB",where:"app"},
  societe:{name:"Studio Ressac",role:"Société de production",ini:"SR",where:"lien",link:"/p/"},
  realExt:{name:"Bastien Roy",role:"Réalisateur · Studio Ressac",ini:"BR",where:"lien",link:"/p/"},
  mgmt:{name:"Jade Petit",role:"Management de Mona Lys",ini:"JP",where:"lien",link:"/v/"}
};
const ROLE_ORDER=["cp","charge","dg","da","societe","realExt","mgmt"];
const MEMBERS=["cp","charge","dg","da"];

/* Responsibilities (Ibé § 5): who executes, who coordinates, who validates.
   One person may hold several; a change keeps the previous holder. */
const SLOTS=[
  {k:"project",label:"Responsable du projet",kind:"Coordonne",what:"Suit l'ensemble, retient le lieu, confirme avant le tournage.",pool:MEMBERS},
  {k:"production",label:"Responsable de production",kind:"Coordonne",what:"Vérifie les devis, suit la préproduction, les rushes et le transfert.",pool:MEMBERS},
  {k:"exec",label:"Production exécutive",kind:"Exécute",what:"Devis, préproduction, lieux, tournage, montage.",pool:["societe"]},
  {k:"director",label:"Réalisation",kind:"Exécute",what:"Traitement, moodboard, découpage technique.",pool:["realExt"]},
  {k:"creative",label:"Responsable créatif",kind:"Coordonne",what:"Suit la création côté PDS.",pool:MEMBERS},
  {k:"budget",label:"Validation budgétaire",kind:"Valide",what:"Valide les devis et les révisions de budget.",pool:MEMBERS},
  {k:"creativeInt",label:"Validation créative interne",kind:"Valide",what:"Valide la proposition et les versions du montage.",pool:MEMBERS},
  {k:"creativeExt",label:"Validation créative externe",kind:"Valide",what:"Valide en plus de la validation interne, jamais à sa place.",pool:["mgmt",""]}
];
const SLOT=k=>SLOTS.find(s=>s.k===k);
const holder=k=>S.roles[k]||null;
const nameOf=k=>k&&P[k]?P[k].name:"Personne";

/* The journey. exec / coord / valid name slots, never people: changing a
   holder never resets a step (Ibé § 5). */
const STEPS=[
  {id:"org",title:"Organisation et rôles",why:"Qui exécute, qui coordonne, qui valide : choisi au départ, modifiable sans rien réinitialiser.",exec:"project",coord:null,valid:[],prereq:[]},
  {id:"kickoff",title:"Call de présentation",why:"Studio Ressac découvre le projet, les attentes, les contraintes et l'enveloppe avant de chiffrer.",exec:"project",coord:null,valid:[],prereq:["org"]},
  {id:"quote",title:"Devis",why:"Déposé par la société, vérifié par la production, validé par la validation budgétaire. Un dépôt ne vaut jamais validation.",exec:"exec",coord:"production",valid:["budget"],prereq:["kickoff"]},
  {id:"creative",title:"Proposition de réalisation",why:"Traitement, moodboard, découpage : ce qu'on tourne. Validé en interne, et en externe quand c'est requis.",exec:"director",coord:"creative",valid:["creativeInt","creativeExt"],prereq:["quote"]},
  {id:"prep",title:"Préproduction",why:"Studio Ressac organise ; PDS suit les tâches, les échéances et les blocages.",exec:"exec",coord:"production",valid:[],prereq:["quote"]},
  {id:"locs",title:"Lieux",why:"La société propose, PDS retient un lieu. Le remplacer crée une nouvelle décision, l'ancienne reste.",exec:"exec",coord:"production",valid:["project"],prereq:["creative"]},
  {id:"ready",title:"Contrôle avant tournage",why:"La synthèse de ce qui est réellement prêt, confirmée explicitement, puis gardée telle quelle.",exec:"project",coord:"production",valid:[],prereq:["quote","creative","locs"]},
  {id:"shoot",title:"Tournage",why:"Confirmer qu'il a eu lieu ; ensuite, les fichiers sont attendus.",exec:"exec",coord:"production",valid:["project"],prereq:["ready"]},
  {id:"rushes",title:"Rushes et transfert",why:"Le lien des rushes, l'accès vérifié, puis le transfert à la postproduction.",exec:"exec",coord:"production",valid:[],prereq:["shoot"]},
  {id:"post",title:"Montage et retours",why:"Chaque version a son lien et ses retours ; elle est en revue, à modifier ou validée.",exec:"exec",coord:"creative",valid:["creativeInt","creativeExt"],prereq:["rushes"]},
  {id:"delivery",title:"Livraison et clôture",why:"Le fichier final validé, sa date, son valideur et son destinataire ; puis la clôture.",exec:"exec",coord:"project",valid:["project"],prereq:["post"]}
];
const STEP=id=>STEPS.find(s=>s.id===id);

/* State ------------------------------------------------------------------- */
const LOC_SEED=[
  {name:"Entrepôt Quai de Seine",addr:"12 quai de Seine, Aubervilliers",price:1400,avail:"23 et 24/10",constraints:"Électricité 63 A sur place · accès camion par la cour",ph:"p0"},
  {name:"Rooftop Belleville",addr:"48 rue de Belleville, Paris 20e",price:2200,avail:"23/10 seulement",constraints:"Autorisation de la copropriété · 6 personnes au plus sur le toit",ph:"p1"},
  {name:"Studio Rive Gauche",addr:"5 rue Molière, Ivry-sur-Seine",price:1100,avail:"23 et 24/10",constraints:"Cyclo blanc, régie · aucune contrainte",ph:"p2"}
];
function fresh(){
  return {role:"charge",tab:"parcours",sel:null,flash:null,log:[],clock:0,form:null,err:{},
    roles:{project:"cp",production:"charge",exec:"societe",director:"realExt",creative:"da",budget:"dg",creativeInt:"da",creativeExt:"mgmt"},
    roleHist:[],links:{societe:{state:"active",n:1},realExt:{state:"active",n:1},mgmt:{state:"active",n:1}},
    tasks:[],quote:{versions:[],revision:null},creative:{versions:[],requested:null},
    locs:{cands:[],active:null,decisions:[]},decisions:[],blockers:[],
    ready:null,shoot:false,rushes:{link:null,verified:false,received:false,transfer:"to_send"},post:{versions:[]},delivery:{link:null,confirmed:null,closed:null}};
}
let S=fresh();
const stamp=()=>{S.clock++;const d=new Date(...(S.base||[2026,9,16,18,30]));d.setMinutes(d.getMinutes()+S.clock*9);return d.toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).replace(" ",", ");};
const me=()=>S.role;
const log=(text,who)=>S.log.unshift({text,who:who||P[me()].name,at:stamp()});
let uid=0;const id=p=>p+(++uid);

/* Derived ----------------------------------------------------------------- */
const lastOf=a=>a[a.length-1]||null;
const activeQuote=()=>[...S.quote.versions].reverse().find(v=>v.status==="approved")||null;
const retainedCreative=()=>[...S.creative.versions].reverse().find(v=>v.int==="approved"&&(v.ext==="approved"||v.ext==="none"))||null;
const prepOpen=()=>S.tasks.filter(t=>t.step==="prep"&&t.status!=="done");
const contradictions=()=>{const g={};S.decisions.filter(d=>d.group).forEach(d=>{(g[d.group]=g[d.group]||[]).push(d);});return Object.values(g).filter(l=>!l.some(d=>d.foi));};
function openBlockers(){
  const list=S.blockers.filter(b=>b.open);
  contradictions().forEach(l=>list.push({id:"c-"+l[0].group,text:`Informations contradictoires : ${l.map(d=>"« "+d.text+" »").join(" / ")}`,step:l[0].step,owner:holder("project"),next:"Indiquer l'information qui fait foi",auto:true,at:l[l.length-1].at}));
  return list;
}
const reviewOpen=()=>S.tasks.filter(t=>t.origin&&t.origin.startsWith("Changement")&&t.status!=="done");
function done(id){
  switch(id){
    case "org":case "kickoff":return true;
    case "quote":return !!activeQuote();
    case "creative":return !!retainedCreative();
    case "prep":return S.tasks.some(t=>t.step==="prep")&&prepOpen().length===0;
    case "locs":return S.locs.active!=null;
    case "ready":return !!S.ready;
    case "shoot":return S.shoot;
    case "rushes":return S.rushes.transfer==="received";
    case "post":return S.post.versions.some(v=>v.status==="approved");
    case "delivery":return !!S.delivery.closed;
  }
}
// A step done once stays done; a new version asked reopens it without
// locking what follows (Ibé § 10: the project goes on where unaffected).
function rework(id){
  if(id==="quote") return !!activeQuote()&&(!!S.quote.revision||lastOf(S.quote.versions).status!=="approved");
  if(id==="creative") return !!retainedCreative()&&(!!S.creative.requested||lastOf(S.creative.versions)!==retainedCreative());
  if(id==="prep") return S.tasks.some(t=>t.step==="prep"&&t.status==="done")&&prepOpen().length>0&&!!S.locs.decisions.length&&reviewOpen().some(t=>t.step==="prep");
  return false;
}
function statusOf(id){
  const s=STEP(id);
  if(!s.prereq.every(done)) return "blocked";
  if(rework(id)) return "rework";
  if(done(id)) return "done";
  return "current";
}
/* Who is expected now on a step: one or several people in parallel. */
function actorsOf(id){
  const st=statusOf(id); if(st==="blocked"||st==="done") return [];
  const A=(slot,todo,due)=>holder(slot)?[{r:holder(slot),todo,due,step:id}]:[];
  const q=lastOf(S.quote.versions), c=lastOf(S.creative.versions);
  switch(id){
    case "quote":
      if(!q||(S.quote.revision&&q.status==="approved")) return A("exec",S.quote.revision?"Déposer le devis révisé":"Déposer le devis","avant le 21/10");
      if(q.status==="deposited") return A("production","Vérifier le devis");
      if(q.status==="submitted") return A("budget","Valider le devis");
      if(q.status==="changes"||q.status==="rejected") return A("exec","Déposer une version corrigée du devis","avant le 22/10");
      return [];
    case "creative":{
      if(!c||(S.creative.requested&&c===retainedCreative())) return A("director",S.creative.requested?"Déposer une nouvelle version de la proposition":"Déposer la proposition de réalisation","avant le 18/10");
      if(c.int==="changes"||c.ext==="changes") return A("director","Déposer une nouvelle version de la proposition","avant le 20/10");
      const l=[];if(c.int==="pending") l.push(...A("creativeInt","Valider la proposition V"+c.n));if(c.ext==="pending") l.push(...A("creativeExt","Valider la proposition V"+c.n));return l;}
    case "prep":{const by={};prepOpen().forEach(t=>{(by[t.r]=by[t.r]||[]).push(t);});return Object.entries(by).map(([r,l])=>({r,todo:l.length>1?`Faire avancer ${l.length} tâches de préproduction`:l[0].text,due:l[0].due?"pour le "+l[0].due:null,step:"prep"}));}
    case "locs":
      if(!S.locs.cands.length) return A("exec","Proposer des lieux","avant le 20/10");
      if(S.locs.active==null) return A("project","Retenir un lieu");
      return [];
    case "ready": return S.ready?[]:A("project","Confirmer la préparation");
    case "shoot": return S.shoot?[]:A("project","Confirmer que le tournage a eu lieu","après le 23/10");
    case "rushes":
      if(!S.rushes.link) return A("exec","Transmettre le lien des rushes","le 24/10");
      if(!S.rushes.verified||!S.rushes.received) return A("production","Vérifier l'accès et marquer les rushes reçus");
      if(S.rushes.transfer==="to_send") return A("production","Transférer à la postproduction");
      if(S.rushes.transfer==="sent") return A("exec","Confirmer la réception pour le montage");
      return [];
    case "post":{const v=lastOf(S.post.versions);
      if(!v||v.status==="changes") return A("exec",v?`Déposer le montage V${v.n+1}`:"Déposer le montage V1",v?"avant le 10/11":"le 06/11");
      if(v.status==="review"){const l=[];if(v.int==="pending") l.push(...A("creativeInt",`Revoir le montage V${v.n}`));if(v.ext==="pending") l.push(...A("creativeExt",`Revoir le montage V${v.n}`));return l;}
      return [];}
    case "delivery":
      if(S.delivery.closed) return [];
      if(!S.delivery.link) return A("exec","Déposer le fichier final validé","le 28/11");
      if(!S.delivery.confirmed) return A("project","Confirmer la livraison");
      return A("project","Clôturer la production");
  }
  return [];
}
const allActions=()=>STEPS.flatMap(s=>actorsOf(s.id));
function summary(id){
  const q=activeQuote(), c=retainedCreative();
  switch(id){
    case "org":return "Externe · Studio Ressac";
    case "kickoff":return `Fait le 15/10 · ${S.tasks.filter(t=>t.origin==="Call de présentation du 15/10").length} tâches confirmées`;
    case "quote":return q?`Référence : V${q.n} · ${euro(q.amount)}`:"";
    case "creative":return c?`Retenue : V${c.n}`:"";
    case "prep":return `${S.tasks.filter(t=>t.step==="prep"&&t.status==="done").length} / ${S.tasks.filter(t=>t.step==="prep").length} tâches faites`;
    case "locs":return S.locs.active!=null?S.locs.cands[S.locs.active].name:"";
    case "ready":return S.ready?"Préparation validée — tournage à venir":"";
    case "shoot":return S.shoot?"Tournage terminé — fichiers attendus":"";
    case "rushes":return "Rushes reçus, transférés au montage";
    case "post":{const v=[...S.post.versions].reverse().find(x=>x.status==="approved");return v?`Montage V${v.n} validé`:"";}
    case "delivery":return S.delivery.closed?"Livré et clôturé":"";
  }
  return "";
}

/* Render ------------------------------------------------------------------ */
const app=document.getElementById("app");
const av=(k,sm)=>k&&P[k]?`<span class="avatar ${sm?"sm":""}" aria-hidden="true">${esc(P[k].ini)}</span>`:"";
const isMember=k=>P[k]&&P[k].where==="app";
const can=slot=>holder(slot)===me();
const pill=(tone,t)=>`<span class="pill ${tone}">${esc(t)}</span>`;
const errOf=k=>S.err[k]?`<span class="err" role="alert">${esc(S.err[k])}</span>`:"";
const ta=(id,label,ph,req)=>`<div class="field"><label for="${id}"><b>${esc(label)}</b>${req?" *":""}</label><textarea class="in" id="${id}" rows="2" placeholder="${esc(ph||"")}"></textarea>${errOf(id)}</div>`;
function render(){
  document.getElementById("roleSel").innerHTML=ROLE_ORDER.map(k=>`<option value="${k}" ${k===S.role?"selected":""}>${esc(P[k].name)} · ${esc(P[k].role.split(" · ")[0])}${P[k].where==="lien"?" (lien)":""}</option>`).join("");
  app.innerHTML=P[me()].where==="lien"?portal():shell();
}
function shell(){
  const nav=[["home","Accueil"],["work","Travail"],["folder","Projets"],["nodes","Réseau"]];
  const n=allActions().filter(a=>a.r===me()).length;
  return `<div class="shell">
  <nav class="mainnav" aria-label="Navigation principale"><span class="brand">PDS</span>
    ${nav.map(([i,l])=>`<button class="navbtn ${i==="folder"?"on":""}" type="button" aria-label="${l}">${I[i]}${i==="work"&&n?`<span class="cnt">${n}</span>`:""}<span class="tip">${l}</span></button>`).join("")}
    <div class="grow"></div><button class="navbtn" type="button" aria-label="Notifications">${I.bell}</button>${av(me())}</nav>

function nowCard(){

  const rest=mine.filter(a=>!(S.tab==="parcours"&&a.step===S.sel));

    if(!a){const b=blk[0];return `<section class="card now" aria-label="Maintenant"><div class="eyebrow"><span class="pill bad">Blocage à lever</span><span>${esc(P[me()].name)} · ${esc(STEP(b.step).title)}</span></div><h2>${esc(b.next)}</h2><p class="note">${esc(b.text)}</p><div class="btnrow"><button class="btn" type="button" data-act="go" data-step="${b.step}">Ouvrir l'étape</button></div></section>`;}
    return `<section class="card now" aria-label="Maintenant"><div class="eyebrow"><span class="pill info">${shownHere?"Aussi à vous":"À vous"}</span><span>${esc(P[me()].name)} · ${esc(STEP(a.step).title)}${a.due?" · "+esc(a.due):""}</span></div>

function journey(){
