<title>PDS OS parcours guidés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@500;600;700&display=swap">
<style>
/* Layout: PDS OS shell (main nav, project nav) and, in every module, the same
   guided pattern — « Maintenant », the journey on the left, the open step on the
   right. Tokens mirror app/globals.css. */
:root{
  --app:#fbfbfb; --page:#ffffff; --raised:#ffffff; --soft:#f4f4f4; --sunken:#ececec;
  --inverse:#000; --inverse-fg:#fff;
  --text:#000; --text-2:#5e5e5e; --text-3:#767676; --muted:#afafaf;
  --hair:#ececec; --border:#d4d4d4; --field:#dcdcdc; --hover-border:#afafaf;
  --sel:#155dfc; --sel-bg:rgb(21 93 252 / .07);
  --info-bg:#e2eefc; --info-fg:#0b3d8c; --warn-bg:#fcefd2; --warn-fg:#6e4300;
  --ok-bg:#daf3e2; --ok-fg:#0d5226; --bad-bg:#fce1df; --bad-fg:#9a1b1b;
  --act-bg:#ece1fb; --act-fg:#4c1d9e; --neutral-bg:#ececec; --neutral-fg:#111;
  --glass:rgb(24 24 24 / .86); --glass-fg:#fff; --glass-2:#bdbdbd;
  --shadow:0 1px 2px rgb(0 0 0 / .04), 0 8px 24px rgb(0 0 0 / .06);
  --font:"Google Sans Flex","Google Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --app:#0a0a0a; --page:#0f0f0f; --raised:#161616; --soft:rgb(255 255 255 / .05); --sunken:rgb(255 255 255 / .08);
  --inverse:#ededed; --inverse-fg:#0f0f0f; --text:#ededed; --text-2:#a8a8a8; --text-3:#8f8f8f; --muted:#5e5e5e;
  --hair:rgb(255 255 255 / .08); --border:rgb(255 255 255 / .12); --field:rgb(255 255 255 / .14); --hover-border:rgb(255 255 255 / .28);
  --sel:#3b7bff; --sel-bg:rgb(59 123 255 / .16);
  --info-bg:#12233d; --info-fg:#9ec5ff; --warn-bg:#33260c; --warn-fg:#f5c869; --ok-bg:#0f2e1c; --ok-fg:#7fdca0;
  --bad-bg:#3a1616; --bad-fg:#ff9b94; --act-bg:#2a1c47; --act-fg:#c9b2ff; --neutral-bg:#262626; --neutral-fg:#d4d4d4;
  --glass:rgb(40 40 40 / .9); --glass-fg:#f2f2f2; --glass-2:#a8a8a8; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --app:#0a0a0a; --page:#0f0f0f; --raised:#161616; --soft:rgb(255 255 255 / .05); --sunken:rgb(255 255 255 / .08);
  --inverse:#ededed; --inverse-fg:#0f0f0f; --text:#ededed; --text-2:#a8a8a8; --text-3:#8f8f8f; --muted:#5e5e5e;
  --hair:rgb(255 255 255 / .08); --border:rgb(255 255 255 / .12); --field:rgb(255 255 255 / .14); --hover-border:rgb(255 255 255 / .28);
  --sel:#3b7bff; --sel-bg:rgb(59 123 255 / .16);
  --info-bg:#12233d; --info-fg:#9ec5ff; --warn-bg:#33260c; --warn-fg:#f5c869; --ok-bg:#0f2e1c; --ok-fg:#7fdca0;
  --bad-bg:#3a1616; --bad-fg:#ff9b94; --act-bg:#2a1c47; --act-fg:#c9b2ff; --neutral-bg:#262626; --neutral-fg:#d4d4d4;
  --glass:rgb(40 40 40 / .9); --glass-fg:#f2f2f2; --glass-2:#a8a8a8; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--app);color:var(--text);font-family:var(--font);font-weight:500;font-size:16px;line-height:1.5;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.04em;text-wrap:balance}
p{margin:0;text-wrap:pretty}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.cap{font-size:14px;color:var(--text-2)}
.t3{color:var(--text-3)}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.shell{display:grid;grid-template-columns:68px 200px minmax(0,1fr);min-height:100%}
.shell.noproj{grid-template-columns:68px minmax(0,1fr)}
.mainnav{position:sticky;top:0;height:100vh;border-right:1px solid var(--hair);background:var(--page);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px}
.brand{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--inverse);color:var(--inverse-fg);font-weight:700;font-size:12px;letter-spacing:0;margin-bottom:8px}
.navbtn{position:relative;width:44px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--text-2);border:0;background:none;cursor:pointer}
.navbtn.on{background:var(--sunken);color:var(--text)}
.navbtn[disabled]{opacity:.35;cursor:not-allowed}
.navbtn .cnt{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--inverse);color:var(--inverse-fg);font-size:10.5px;font-weight:700;display:grid;place-items:center;letter-spacing:0}
.navbtn .tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--inverse);color:var(--inverse-fg);font-size:13px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 120ms ease;z-index:20}
@media (hover:hover) and (pointer:fine){.navbtn:hover:not([disabled]){background:var(--soft);color:var(--text)}.navbtn:hover .tip{opacity:1}}
.mainnav .grow{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none;color:var(--text)}
.avatar.sm{width:24px;height:24px;font-size:10.5px}
.projnav{position:sticky;top:0;height:100vh;border-right:1px solid var(--hair);background:var(--page);padding:8px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.switcher{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 12px;border-bottom:1px solid var(--hair);margin-bottom:6px;font-weight:600}
.group{font-size:13px;color:var(--text-3);padding:12px 10px 4px}
.pitem{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:8px;color:var(--text-2);font-size:15px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.pitem.on{background:var(--sunken);color:var(--text)}
.pitem .grow{flex:1}
@media (hover:hover) and (pointer:fine){.pitem:hover{background:var(--soft);color:var(--text)}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.run{background:var(--sel)} .dot.wait{background:var(--warn-fg)} .dot.block{background:var(--bad-fg)} .dot.done{background:var(--ok-fg)}
.mine{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--sel);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.content{min-width:0;padding:28px 40px 130px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (max-width:1100px){.shell{grid-template-columns:68px minmax(0,1fr)}.projnav{display:none}}
@media (max-width:720px){.shell,.shell.noproj{grid-template-columns:minmax(0,1fr)}.mainnav{display:none}.content{padding:20px 16px 150px}}

/* Head */
.h1{font-size:30px;letter-spacing:-.04em}
.chevrons{display:flex;flex-wrap:wrap;gap:4px}
.chev{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--soft);color:var(--text-2);font-size:15px;border:0;cursor:pointer}
.chev.on{background:var(--inverse);color:var(--inverse-fg)}
.chev .ok{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok-fg)}
.chev .lock{opacity:.6}
.headrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--text-2)}
.facts b{color:var(--text);font-weight:600}

/* Pills, buttons */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--neutral-bg);color:var(--neutral-fg);white-space:nowrap}
.pill.info{background:var(--info-bg);color:var(--info-fg)} .pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)} .pill.bad{background:var(--bad-bg);color:var(--bad-fg)} .pill.act{background:var(--act-bg);color:var(--act-fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid transparent;background:var(--inverse);color:var(--inverse-fg);font-weight:600;font-size:15px;cursor:pointer;transition:transform 140ms var(--ease),background-color 160ms ease;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.out{background:transparent;color:var(--text);border-color:var(--border)}
.btn.ghost{background:transparent;color:var(--text-2)}
.btn.sm{height:32px;padding:0 14px;font-size:14px}
@media (hover:hover) and (pointer:fine){.btn.out:hover{border-color:var(--hover-border)}.btn.ghost:hover{background:var(--soft);color:var(--text)}}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Cards */
.card{background:var(--raised);border:1px solid var(--hair);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:20px} .card h3{font-size:16px;font-weight:600;letter-spacing:-.02em}
.now{border-color:var(--border);box-shadow:var(--shadow)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2);flex-wrap:wrap}
.now h2{font-size:22px}
.rowlist{display:flex;flex-direction:column;gap:8px}
.wr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--soft);font-size:15px}
.wr .grow{flex:1;min-width:0}
.flash{background:var(--ok-bg);color:var(--ok-fg);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.flash .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.flash button{background:none;border:0;color:inherit;cursor:pointer;padding:4px;border-radius:6px}

/* Layout + spine */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.spine{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px;padding:12px;background:var(--raised);border:1px solid var(--hair);border-radius:12px}
.spine h2{font-size:15px;color:var(--text-2);letter-spacing:-.02em;padding:4px 8px 8px}
.step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:9px 8px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;width:100%;position:relative}
.step:not(:last-child)::after{content:"";position:absolute;left:19px;top:34px;bottom:-6px;width:2px;background:var(--hair)}
.step.sel{background:var(--sunken)}
@media (hover:hover) and (pointer:fine){.step:not(.sel):hover{background:var(--soft)}}
.mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--border);background:var(--raised);position:relative;z-index:1;color:var(--text-3)}
.step.done .mark{background:var(--ok-bg);border-color:transparent;color:var(--ok-fg)}
.step.current .mark{border-color:var(--sel);background:var(--sel-bg)}
.step.current .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sel)}
.step.me .mark{border-color:var(--sel);background:var(--sel)} .step.me .mark::after{background:#fff}
.step.blocked .mark{border-style:dashed}
.step .t,.step .s{display:block}
.step .t{font-size:15px;font-weight:600;line-height:1.3}
.step.blocked .t{color:var(--text-3);font-weight:500}
.step .s{font-size:13.5px;color:var(--text-2);line-height:1.35;margin-top:2px}
.step .s.me{color:var(--sel);font-weight:600}
.dhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.dhead h2{font-size:22px}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px;border-radius:10px;background:var(--soft)}
@media (max-width:1200px){.meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.meta .k{font-size:13px;color:var(--text-3)} .meta .v{font-size:15px;line-height:1.35}
.okc{color:var(--ok-fg)} .noc{color:var(--text-3)}
.note{font-size:14.5px;color:var(--text-2)}
.po{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--act-fg);background:var(--act-bg);height:22px;padding:0 8px;border-radius:999px}
.callout{border-radius:10px;padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.callout.info{background:var(--info-bg);color:var(--info-fg)} .callout.warn{background:var(--warn-bg);color:var(--warn-fg)}
.callout.bad{background:var(--bad-bg);color:var(--bad-fg)} .callout.ok{background:var(--ok-bg);color:var(--ok-fg)}
.rows{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--hair);font-size:15px}
.row:last-child{border-bottom:0}
.row .src{font-size:13px;color:var(--text-3)}
.pick{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}.pick legend{padding:0;margin-bottom:2px}
.opts{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.opt{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--hair);cursor:pointer}.opt:last-child{border-bottom:0}.opt .grow{flex:1;min-width:0}
.opt input{accent-color:var(--sel);width:18px;height:18px;flex:none}.opt:has(input:checked){background:var(--sel-bg)}
.hist{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--text-2)}
.hist li{display:flex;gap:8px;align-items:flex-start}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.in{min-height:40px;border:1px solid var(--field);border-radius:8px;background:var(--raised);padding:8px 12px;width:100%}
textarea.in{min-height:64px;resize:vertical}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.lbl2{font-size:15px}
.drop{position:relative;display:flex;align-items:center;gap:12px;min-height:72px;padding:14px 16px;border:1.5px dashed var(--border);border-radius:10px;background:var(--soft);cursor:pointer;transition:border-color 150ms ease,background-color 150ms ease}
.drop.over{border-color:var(--sel);background:var(--sel-bg)} .drop.bad{border-color:var(--bad-fg)}
.drop:focus-within{outline:2px solid var(--sel);outline-offset:2px}
.drop .grow{flex:1;min-width:0;overflow-wrap:anywhere}
@media (hover:hover) and (pointer:fine){.drop:hover{border-color:var(--hover-border)}}
.vers{display:flex;flex-direction:column;gap:8px}
.field .src{font-size:14px;color:var(--text-2)}
.qa{display:flex;flex-direction:column;gap:12px}.qh{font-size:18px;font-weight:600;letter-spacing:-.03em}
.ver{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--hair);font-size:15px}
.rows .ver:last-child{border-bottom:0}
.ver .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.ver-note{margin:0 14px 10px;border-radius:8px}
.play{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--inverse);color:var(--inverse-fg);display:grid;place-items:center;cursor:pointer;transition:transform 120ms var(--ease)}
.play:active{transform:scale(.94)} .play[aria-pressed="true"]{background:var(--sel);color:#fff}
.wave{display:block;height:3px;margin-top:6px;border-radius:2px;background:var(--hair);overflow:hidden}
.wave i{display:block;height:100%;width:100%;background:var(--sel);transform-origin:left;animation:wave 194s linear forwards}
@keyframes wave{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.wave i{animation:none;transform:scaleX(.3)}}
.in[aria-invalid="true"]{border-color:var(--bad-fg)}
.err{font-size:13px;color:var(--bad-fg)}

/* Overview + lists */
.wfgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.wfgrid{grid-template-columns:minmax(0,1fr)}}
.wf{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--hair);border-radius:12px;background:var(--raised);text-align:left;cursor:pointer}
@media (hover:hover) and (pointer:fine){.wf:hover{border-color:var(--hover-border)}}
.bar{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sel);border-radius:999px;transform-origin:left;transition:transform 300ms var(--ease)}
.table{border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--raised)}
.tr{display:grid;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--hair);font-size:15px}
.tr:last-child{border-bottom:0}
.tr.h{font-size:13.5px;color:var(--text-3);background:var(--soft)}
.tr.link{cursor:pointer}
@media (hover:hover) and (pointer:fine){.tr.link:hover{background:var(--soft)}}
@media (max-width:760px){.tr{grid-template-columns:minmax(0,1fr)!important}.tr.h{display:none}}
.cols4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.cols4{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--soft)}
.col h3{font-size:14px;color:var(--text-2);font-weight:600}
.chip{padding:10px 12px;border-radius:8px;background:var(--raised);border:1px solid var(--hair);font-size:14.5px}
.po-input{display:flex;gap:8px;align-items:center;padding:8px 8px 8px 16px;border:1px solid var(--border);border-radius:16px;background:var(--raised)}
.po-input input{flex:1;border:0;background:transparent;outline:none;min-width:0;height:36px}

/* Portal */
.portal{min-height:100%;background:var(--app)}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:1px solid var(--hair);background:var(--page);flex-wrap:wrap}
.pwrap{max-width:820px;margin:0 auto;padding:28px 16px 150px;display:flex;flex-direction:column;gap:18px}
.lockline{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-3)}

/* Proto bar & toast */
.proto{position:fixed;left:0;right:0;margin-inline:auto;width:fit-content;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--glass);color:var(--glass-fg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgb(0 0 0 / .25)}
.proto .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--glass-2);padding:0 6px}
.proto label{font-size:13px;color:var(--glass-2)}
.proto select{height:34px;border-radius:10px;border:1px solid rgb(255 255 255 / .18);background:rgb(255 255 255 / .08);color:var(--glass-fg);padding:0 10px;font-size:14px;max-width:280px}
.proto select option{color:#000;background:#fff}
.proto button{height:34px;border-radius:10px;border:1px solid rgb(255 255 255 / .18);background:none;color:var(--glass-fg);padding:0 12px;font-size:14px;cursor:pointer}
@media (max-width:720px){.proto label{display:none}.proto select{max-width:44vw}}
.toast{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--inverse);color:var(--inverse-fg);padding:12px 16px;border-radius:12px;font-size:15px;box-shadow:var(--shadow);max-width:min(420px,calc(100% - 40px));transition:opacity 180ms ease,transform 180ms var(--ease)}
.toast[hidden]{display:block!important;opacity:0;transform:translateY(8px);pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>

<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="proto" role="region" aria-label="Commandes du prototype">
  <span class="lbl">Proto</span>
  <label for="roleSel">Voir comme</label><select id="roleSel"></select>
  <label for="scenSel">Aller à</label>
  <select id="scenSel">
    <option value="start">Le projet est à créer</option>

const WORKFLOW_KEYS=["master","legal","marketing","distribution"];
const MARKETING=["strategy","design","production","activations","review"];
const ALL_STEPS=[];Object.values(W).forEach(w=>w.steps.forEach(s=>{s.wf=w.key;ALL_STEPS.push(s);}));
const STEP=id=>ALL_STEPS.find(s=>s.id===id);

/* State: how far each step has gone (index of the next action). */
function fresh(){return {role:"dg",view:"home",wf:"overview",sel:null,ph:{},notes:{},log:[],flash:null,clock:0,edits:{},editing:null,pickSel:{},imported:{},playing:null,deliveries:{},up:{},uperr:{},qa:null,qaErr:null};}
let S=fresh();
const ph=id=>S.ph[id]||0;
const isDone=id=>ph(id)>=STEP(id).acts.length;
function statusOf(id){
  const s=STEP(id);
  if(isDone(id)) return "done";
  return s.prereq.every(isDone)?"current":"blocked";
}
function actorOf(id){const s=STEP(id);return statusOf(id)==="current"?s.acts[ph(id)]:null;}
function wfSteps(k){return k==="marketing"?MARKETING.flatMap(m=>W[m].steps):W[k].steps;}
function wfStatus(k){
  const st=wfSteps(k).map(s=>statusOf(s.id));
  if(st.every(x=>x==="done")) return ["done","Terminé"];
  if(st.every(x=>x==="blocked")) return ["","Non démarré"];
  const cur=wfSteps(k).filter(s=>statusOf(s.id)==="current");
  if(cur.length&&cur.every(s=>{const a=actorOf(s.id);return a&&["dg","da"].includes(a.by)&&s.validator===a.by;})) return ["wait","En attente"];
  return ["run","En cours"];
}
const myOpen=(role,keys)=>ALL_STEPS.filter(s=>(!keys||keys.includes(s.wf))&&actorOf(s.id)&&actorOf(s.id).by===role);
const othersOpen=(role,keys)=>ALL_STEPS.filter(s=>(!keys||keys.includes(s.wf))&&actorOf(s.id)&&actorOf(s.id).by!==role);
const wfOfStep=s=>MARKETING.includes(s.wf)?"marketing":s.wf;
const stamp=()=>{S.clock++;const d=new Date(2026,9,15,9,0);d.setMinutes(d.getMinutes()+S.clock*37);return d.toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});};

function wfCard(k){

   ${open.slice(0,2).map(s=>`<span class="cap">${esc(s.title)} · <b>${esc(P[actorOf(s.id).by].name)}</b> : ${esc(actorOf(s.id).label.toLowerCase())}</span>`).join("")||`<span class="cap">${done===steps.length?"Tout est fait.":"Démarre avec le plan du projet."}</span>`}</button>`;

/* « Maintenant » scoped to some workflows (null: the whole project). */
function nowCard(keys,shown){
  // On a journey, the step on screen already carries its action: the card
  // only points to what else is waiting for the person.
  const here=shown&&actorOf(shown)&&actorOf(shown).by===S.role;
  const mine=myOpen(S.role,keys).filter(s=>s.id!==shown), others=othersOpen(S.role,keys);
  const me=P[S.role];
  if(mine.length){const s=mine[0],a=actorOf(s.id);
    return `<section class="card now" aria-label="Maintenant"><div class="eyebrow"><span class="pill info">${here?"Aussi à vous":"À vous"}</span><span>${esc(me.name)} · ${esc(wfLabel(s))} › ${esc(s.title)}</span></div>
    <h2>${esc(a.label)}</h2><p class="note">${esc(s.why)}</p>
    <div class="btnrow"><button class="btn" type="button" data-act="open" data-step="${s.id}">Ouvrir l'étape</button>${mine.length>1?`<span class="cap">Et ${mine.length-1} autre${mine.length>2?"s":""} : ${mine.slice(1,3).map(x=>esc(actorOf(x.id).label.toLowerCase())).join(" · ")}</span>`:""}</div>
    ${others.length?`<div class="rowlist">${others.slice(0,2).map(waitRow).join("")}</div>`:""}</section>`;}
  if(here) return "";
  const elsewhere=keys?myOpen(S.role):[];
  if(elsewhere.length){const s=elsewhere[0],a=actorOf(s.id);
    return `<section class="card now" aria-label="Maintenant"><div class="eyebrow"><span class="pill info">À vous, ailleurs</span><span>Rien ici · ${esc(wfLabel(s))} › ${esc(s.title)}</span></div>
    <h2>${esc(a.label)}</h2><p class="note">${esc(s.why)}</p><div class="btnrow"><button class="btn" type="button" data-act="open" data-step="${s.id}">Ouvrir l'étape</button></div></section>`;}
  return `<section class="card now" aria-label="Maintenant"><div class="eyebrow"><span class="pill">Rien à faire pour vous</span><span>${esc(me.name)}</span></div>
    <h2>${others.length?"Ça avance sans vous pour l'instant":"Tout est fait ici"}</h2>${others.length?`<div class="rowlist">${others.slice(0,3).map(waitRow).join("")}</div>`:""}</section>`;
}
function flash(){return `<div class="flash" role="status"><span>${I.ok}</span><div class="grow"><b>${esc(S.flash.title)}</b>${S.flash.lines.map(l=>`<span>${l}</span>`).join("")}</div><button type="button" data-act="unflash" aria-label="Fermer">${I.x}</button></div>`;}

function journeyPage(title,keys,chevrons){
  const steps=keys.flatMap(k=>W[k].steps);
  if(!S.sel||!steps.find(s=>s.id===S.sel)) S.sel=(steps.find(s=>actorOf(s.id)&&actorOf(s.id).by===S.role)||steps.find(s=>statusOf(s.id)==="current")||steps[0]).id;
  const step=STEP(S.sel);
  return `<h1 class="h1">${esc(title)}</h1>${chevrons||""}${S.flash?flash():""}${nowCard(keys,step.id)}
  <div class="layout"><nav class="spine" aria-label="Parcours"><h2>Parcours</h2>${steps.map(spineItem).join("")}</nav>
  <section class="card" aria-labelledby="dtitle">${detail(step)}</section></div>`;
}
function journeyInline(keys){return `<div class="layout"><nav class="spine" aria-label="Parcours"><h2>Parcours</h2>${keys.flatMap(k=>W[k].steps).map(spineItem).join("")}</nav><section class="card">${detail(STEP(S.sel&&keys.flatMap(k=>W[k].steps).find(s=>s.id===S.sel)?S.sel:(keys.flatMap(k=>W[k].steps).find(s=>statusOf(s.id)==="current")||W[keys[0]].steps[0]).id))}</section></div>`;}
function spineItem(s){
  const st=statusOf(s.id),a=actorOf(s.id),me=a&&a.by===S.role;
  const sub=st==="done"?lastResult(s):a?`${P[a.by].name} · ${a.label.toLowerCase()}`:"Après : "+s.prereq.map(p=>STEP(p).title).join(", ");
  return `<button class="step ${st} ${me?"me":""} ${s.id===S.sel?"sel":""}" type="button" data-act="sel" data-step="${s.id}"><span class="mark">${st==="done"?I.check:st==="blocked"?I.lock:""}</span><span><span class="t">${esc(s.title)}</span><span class="s ${me?"me":""}">${me?"À vous · ":""}${esc(sub)}</span></span></button>`;
}
const lastResult=s=>s.acts[s.acts.length-1].done;

function detail(s){
  const st=statusOf(s.id), a=actorOf(s.id);
  const pre=s.prereq.map(STEP), next=ALL_STEPS.filter(x=>x.prereq.includes(s.id));
  const owner=P[s.owner], val=s.validator?P[s.validator]:null;
  const done=s.acts.slice(0,ph(s.id));
  return `<div class="dhead"><h2 id="dtitle">${esc(s.title)}</h2><span class="pill ${st==="done"?"ok":st==="current"?"info":""}">${st==="done"?"Fait":st==="current"?"En cours":"Plus tard"}</span></div>
  <p class="note">${esc(s.why)}</p>
  <div class="meta"><div><div class="k">Responsable</div><div class="v">${esc(owner.name)}<br><span class="cap">${esc(owner.role)}${owner.where==="lien"?" · lien privé":""}</span></div></div>
   <div><div class="k">Validation</div><div class="v">${val?`${esc(val.name)}<br><span class="cap">${esc(val.role)}</span>`:"Aucune"}</div></div>
   <div><div class="k">Prérequis</div><div class="v">${pre.length?pre.map(p=>`<span class="${isDone(p.id)?"okc":"noc"}">${isDone(p.id)?"✓":"○"} ${esc(wfLabelShort(p))}</span>`).join("<br>"):"Aucun"}</div></div>
   <div><div class="k">Ensuite</div><div class="v">${next.length?next.slice(0,3).map(n=>esc(wfLabelShort(n))).join("<br>"):"—"}</div></div></div>
  ${st==="blocked"?`<div class="callout info">${I.lock}<span>Se débloque quand ${pre.filter(p=>!isDone(p.id)).map(p=>esc(wfLabelShort(p))).join(" et ")} ${pre.filter(p=>!isDone(p.id)).length>1?"sont faits":"est fait"}.</span></div>`:""}
  ${S.notes[s.id]?`<div class="callout warn">${I.warn}<span>${esc(S.notes[s.id])}</span></div>`:""}
  ${s.po?`<div class="callout info"><span class="po">${I.spark} PO</span><span>${esc(s.po)}</span></div>`:""}

  const me=P[S.role], mine=myOpen(S.role), done=ALL_STEPS.filter(s=>s.acts.slice(0,ph(s.id)).some(a=>a.by===S.role));

  <div class="pwrap"><div><p class="cap">Néons · Mona Lys · ${esc(me.role)}</p><h1 class="h1">${mine.length?"Ce que PDS attend de vous":"Rien à faire pour l'instant"}</h1></div>${S.flash?flash():""}
  <section class="card"><h2>Votre contact chez PDS</h2><div class="eyebrow">${av("cp",true)}<span><b>Lina Haddad</b> · Cheffe de projet</span></div></section>
  ${mine.map(s=>`<section class="card"><div class="dhead"><h2>${esc(actorOf(s.id).label)}</h2><span class="pill info">À vous</span></div><p class="note">${esc(s.why)}</p>${S.notes[s.id]?`<div class="callout warn">${I.warn}<span>${esc(S.notes[s.id])}</span></div>`:""}${actionBlock(s,actorOf(s.id))}${versionsBlock(s.id,"Vos versions déjà envoyées")}</section>`).join("")}
  ${!mine.length?`<section class="card"><p class="note">PDS vous préviendra ici dès qu'une étape vous attend.</p></section>`:""}
  ${["m3","m4"].filter(id=>!mine.some(x=>x.id===id)&&versionsOf(id).some(d=>d.by===me.name)).map(id=>`<section class="card">${versionsBlock(id,id==="m3"?"Vos versions du mix":"Vos versions du master")}</section>`).join("")}
  ${done.length?`<section class="card"><h2>Déjà fait</h2><ul class="hist">${done.flatMap(s=>s.acts.slice(0,ph(s.id)).filter(a=>a.by===S.role).map(a=>`<li><span class="okc">${I.check}</span><span>${esc(a.done)}</span></li>`)).join("")}</ul></section>`:""}

/* Actions ----------------------------------------------------------------- */
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true;},3600);}
function openStep(id){
  const s=STEP(id);S.view="project";S.sel=id;
  if(MARKETING.includes(s.wf)){S.wf="marketing";S.sub=s.wf;}
  else if(["launch","framing"].includes(s.wf)) S.wf="framing";
  else if(s.wf==="plan") S.wf="overview";
  else if(s.wf==="closure") S.wf="pclosure";
  else S.wf=s.wf;
}
function advance(id){
  const s=STEP(id),a=actorOf(id);if(!a) return;
  S.ph[id]=ph(id)+1;delete S.notes[id];
  S.log.push({text:a.done,who:P[a.by].name,at:stamp(),validation:s.validator===a.by});
  const unlocked=ALL_STEPS.filter(x=>x.prereq.includes(id)&&statusOf(x.id)==="current"&&ph(x.id)===0);
  const next=isDone(id)?unlocked:[s];
  S.flash={title:a.done,lines:next.slice(0,3).filter(x=>actorOf(x.id)).map(x=>`Ensuite : <b>${esc(P[actorOf(x.id).by].name)}</b> · ${esc(actorOf(x.id).label.toLowerCase())} <span class="t3">(${esc(wfLabel(x))})</span>`)};
  toast(a.done+".");
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el) return;
  const act=el.dataset.act;
  switch(act){
    case "nav": if(el.dataset.v==="_cal") return; S.view=el.dataset.v; S.flash=null; break;
    case "project": S.view="project"; S.wf="overview"; break;
    case "wf": S.view="project"; S.wf=el.dataset.v; S.sel=null; S.flash=null; break;
    case "sub": S.sub=el.dataset.v; S.sel=null; break;
    case "sel": S.sel=el.dataset.step; break;
    case "open": openStep(el.dataset.step); S.flash=null; break;
    case "unflash": S.flash=null; break;
    case "do": {
      S.editing=null; const id=el.dataset.step, a=actorOf(id);
      if(a&&a.upload){
        const f=S.up[id], k=KIND[a.upload], n=nextVersion(id);
        if(!f){S.uperr[id]=`Choisissez le fichier audio du ${k.label} V${n}.`;break;}
        (S.deliveries[id]=S.deliveries[id]||[]).push({id:id+"-"+n,title:`${k.label} V${n}`,name:f.name,meta:f.meta,url:f.url||null,sec:f.sec||null,by:P[a.by].name,at:stamp(),status:"pending"});
        delete S.up[id]; delete S.uperr[id]; advance(id);
        S.flash.title=`${k.label} V${n} envoyé à PDS`; toast(`${k.label} V${n} envoyé.`); break;
      }
      const last=versionsOf(id).slice(-1)[0];
      if(a&&last&&last.status==="pending"&&a.by===STEP(id).validator) last.status="approved";
      advance(id); break;
    }
    case "qaexample": {const st=qaState(),n=document.getElementById("qaText"),q=QA[st.i];st.text[st.i]=(n?n.value:q.start)+q.example;S.qaErr=null;break;}
    case "qaread": {const st=qaState(),n=document.getElementById("qaText"),v=n?n.value.trim():"";if(!v){S.qaErr="Écrivez ou dictez votre réponse : PO la lira.";break;}st.text[st.i]=v;st.read[st.i]=true;S.qaErr=null;break;}
    case "qaback": {const st=qaState();st.read[st.i]=false;break;}
    case "qaremove": {const st=qaState();st.removed[st.i+":"+el.dataset.j]=true;break;}
    case "qasave": {
      const st=qaState(),q=QA[st.i],items=qaFound(q,st.text[st.i]).filter(f=>!st.removed[st.i+":"+f.j]);
      st.saved.push({short:q.short,items});S.log.push({text:`${q.short} : ${items.map(f=>f.label).join(", ")}`,who:P[S.role].name,at:stamp(),validation:false});
      if(st.i+1<QA.length){st.i++;toast(`Réponse enregistrée. Question ${st.i+1} sur ${QA.length}.`);}else advance("j2");
      break;
    }
    case "sample": {const id=el.dataset.step,k=KIND[actorOf(id).upload],[name,meta]=k.sample(nextVersion(id));S.up[id]={name,meta};delete S.uperr[id];break;}
    case "play": {const d=Object.values(S.deliveries).flat().find(x=>x.id===el.dataset.id);if(d) playToggle(d);break;}
    case "edit": S.editing=el.dataset.key; render(); {const n=document.getElementById("editval"); if(n){n.focus(); n.select();}} return;
    case "editcancel": S.editing=null; S.pickSel={}; S.playing=null; break;
    case "listen": {const r=document.querySelector('input[name="pick"]:checked'); if(r) S.pickSel[el.dataset.key]=r.value; S.playing=S.playing===el.dataset.val?null:el.dataset.val; break;}
    case "pickadd": {const c=CHOICE[STEP(el.dataset.key.split(":")[0]).facts[+el.dataset.key.split(":")[1]][3]]; S.imported[el.dataset.key]=true; S.pickSel[el.dataset.key]=c.add[1]; toast(c.add[0]+" : "+c.add[1]+"."); break;}
    case "picksave": {
      const r=document.querySelector('input[name="pick"]:checked'), key=el.dataset.key, [sid,i]=key.split(":"), f=STEP(sid).facts[+i], cur=S.edits[key]?S.edits[key].value:f[1];
      S.editing=null; S.pickSel={}; S.playing=null;
      if(r&&r.value!==cur){S.edits[key]={value:r.value,by:P[S.role].name};S.log.push({text:`${el.dataset.label} : ${r.value}`,who:P[S.role].name,at:stamp(),validation:false});toast(`${el.dataset.label} : ${r.value}.`);}
      break;
    }
    case "editsave": {
      const n=document.getElementById("editval"); let value=n?n.value.trim():"";
      if(!value){if(n){n.setAttribute("aria-invalid","true");n.focus();}return;}
      if(n.type==="date"){
        const [sid,i]=el.dataset.key.split(":"), dates=STEP(sid).facts.map((f,j)=>f[3]==="date"?(j===+i?value:isoOf(factValue(sid,j))):null).filter(Boolean);
        if(dates.some((d,j)=>j&&d<dates[j-1])){const er=document.getElementById("editerr");er.textContent="Les dates doivent se suivre : Mix V1, Mix final, Mastering, puis Master final.";er.hidden=false;n.setAttribute("aria-invalid","true");n.focus();return;}
        value=frDate(value);
      }
      S.edits[el.dataset.key]={value,by:P[S.role].name};S.editing=null;
      S.log.push({text:`${el.dataset.label} modifié : ${value}`,who:P[S.role].name,at:stamp(),validation:false});
      toast(`${el.dataset.label} modifié.`);break;
    }
    case "alt": {
      const id=el.dataset.step,a=actorOf(id),note=(document.getElementById("altnote")||{}).value||"";
      if(!note.trim()){const er=document.getElementById("alterr");if(er) er.hidden=false;const n=document.getElementById("altnote");if(n){n.setAttribute("aria-invalid","true");n.focus();}return;}
      const alt=altsOf(a)[+(el.dataset.i||0)], back=alt.reopen||id;
      if(alt.reopen){S.ph[alt.reopen]=Math.max(0,STEP(alt.reopen).acts.length-1);S.notes[alt.reopen]=`${P[a.by].name} (${alt.label.toLowerCase()}) : « ${note.trim()} »`;}
      else{S.ph[id]=Math.max(0,ph(id)-1);S.notes[id]=`${P[a.by].name} : « ${note.trim()} »`;}
      {const last=versionsOf(id).slice(-1)[0];if(last&&last.status==="pending"){last.status="changes";last.note=`${P[a.by].name} : « ${note.trim()} »`;}}
      S.log.push({text:`${alt.label} : ${note.trim()}`,who:P[a.by].name,at:stamp(),validation:true});
      S.flash={title:alt.label,lines:[`Retour à <b>${esc(P[STEP(back).acts[ph(back)].by].name)}</b> avec le motif.`]};toast(alt.label+".");break;
    }
    default: return;
  }
  render();
  if(["do","open","alt","wf","nav","project"].includes(act)) window.scrollTo({top:0,behavior:"auto"});
});
function takeFile(id,file){
  if(!file) return;
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(!AUDIO_EXT.includes(ext)){S.uperr[id]=`« ${file.name} » n'est pas un fichier audio. Formats acceptés : WAV, AIFF, FLAC, MP3, M4A, AAC ou OGG.`;delete S.up[id];render();return;}
  const url=URL.createObjectURL(file), size=file.size<104858?`${Math.max(1,Math.round(file.size/1024))} Ko`:`${(file.size/1048576).toLocaleString("fr-FR",{maximumFractionDigits:1})} Mo`;
  S.up[id]={name:file.name,meta:size,url};delete S.uperr[id];render();
  const probe=new Audio(url);probe.onloadedmetadata=()=>{if(S.up[id]&&S.up[id].url===url&&isFinite(probe.duration)){S.up[id].meta=`${fmtDur(probe.duration)} · ${size}`;S.up[id].sec=probe.duration;render();}};
}
document.addEventListener("input",e=>{if(e.target.id==="qaText"){const st=qaState();st.text[st.i]=e.target.value;}});
document.addEventListener("change",e=>{const t=e.target;if(t.matches&&t.matches("input[data-up]")) takeFile(t.dataset.up,t.files[0]);});
document.addEventListener("dragover",e=>{const z=e.target.closest&&e.target.closest(".drop");if(z){e.preventDefault();z.classList.add("over");}});
document.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest(".drop");if(z) z.classList.remove("over");});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest(".drop");if(z){e.preventDefault();takeFile(z.dataset.step,e.dataTransfer.files[0]);}});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".tr.link")){e.preventDefault();e.target.click();}
  if(e.target.id==="editval"){
    if(e.key==="Enter"){e.preventDefault();document.querySelector('[data-act="editsave"]').click();}
    if(e.key==="Escape"){e.preventDefault();document.querySelector('[data-act="editcancel"]').click();}
  }
});
document.getElementById("roleSel").addEventListener("change",e=>{S.role=e.target.value;S.flash=null;S.sel=null;render();window.scrollTo({top:0});});
document.getElementById("resetBtn").addEventListener("click",()=>{S=fresh();document.getElementById("scenSel").value="start";render();window.scrollTo({top:0});});
document.getElementById("scenSel").addEventListener("change",e=>{S=scenario(e.target.value);render();window.scrollTo({top:0});});
function scenario(k){
  const s=fresh();
  const doneAll=ids=>ids.forEach(id=>{s.ph[id]=STEP(id).acts.length;});
  if(k==="framing"){doneAll(["l1","l2","c1","c2"]);s.ph.c3=1;s.role="dg";s.view="home";}
  if(k==="running"){doneAll(["l1","l2","c1","c2","c3","p1","m1","m2","j1","j2","j3","j4","s1","s2","t1"]);s.ph.m3=1;s.ph.j5=1;s.ph.s3=1;s.role="cp";s.view="project";s.wf="overview";}
  if(k==="late"){doneAll(["l1","l2","c1","c2","c3","p1","m1","m2","m3","j1","j2","j3","j4","j5","s1","s2","s3","s4","d1","d2","d3","d4","r1","r2","r3","a2","t1"]);s.ph.m4=1;s.ph.j6=1;s.ph.r4=1;s.ph.a1=1;s.role="cp";s.view="home";
    s.deliveries={m3:[{id:"m3-1",title:"Mix V1",name:"Neons_Mix_V1_KH.wav",meta:"3 min 14 · 48 kHz · 24 bits · 112 Mo",by:"Karim Haddou",at:"13/11 18:20",status:"changes",note:"Nadia Benali : « Voix trop en avant sur le refrain. »"},{id:"m3-2",title:"Mix V2",name:"Neons_Mix_V2_KH.wav",meta:"3 min 14 · 48 kHz · 24 bits · 112 Mo",by:"Karim Haddou",at:"16/11 11:05",status:"approved"}],
      m4:[{id:"m4-1",title:"Master V1",name:"Neons_Master_V1_24-44.wav",meta:"3 min 14 · 44,1 kHz · 24 bits · 98 Mo",by:"Karim Haddou",at:"19/11 16:40",status:"pending"}]};}
  if(s.ph.j2) s.qa={i:QA.length-1,text:{},read:{},removed:{},saved:QA.map(q=>({short:q.short,items:qaFound(q,q.start+q.example)}))};
  ["c3","p1","m1","m2","m3","j5","s3","d3","r2"].forEach(id=>{if(s.ph[id]) s.log.push({text:STEP(id).acts[Math.min(s.ph[id],STEP(id).acts.length)-1].done,who:P[STEP(id).acts[Math.min(s.ph[id],STEP(id).acts.length)-1].by].name,at:"14/10",validation:!!STEP(id).validator});});
  return s;
}
render();
})();
