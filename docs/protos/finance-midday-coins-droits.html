<title>Finance PDS OS, coins droits</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600&family=Hedvig+Letters+Serif:opsz@12..24&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Finance de PDS OS refaite à la Midday : une seule encre, des filets fins, des coins droits,
   le serif pour les moments, la mono pour les montants. La couleur ne sert qu'à la donnée. */
:root{
  --bg:#fff;--card:#f7f6f3;--sunk:#efede8;--line:#e3e0da;--line-2:#d6d2cb;
  --fg:#121212;--fg-2:#606060;--fg-3:#878787;--fg-4:#b4b1ab;
  --ink:#121212;--ink-fg:#fff;--in:#00a35a;--out:#d92d20;--warn:#a86400;--warn-bg:#fdf1db;--sel:#efede8;
  --veil:rgb(255 255 255 / .55);--shadow:0 8px 30px rgb(0 0 0 / .10);
  --glass:rgb(20 20 20 / .86);--glass-fg:#fff;--glass-2:#b5b5b5;
  --sans:"Google Sans Flex",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Hedvig Letters Serif",Georgia,"Times New Roman",serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0c0c;--card:#121212;--sunk:#1a1a1a;--line:#1d1d1d;--line-2:#2c2c2c;
  --fg:#f2f2f2;--fg-2:#a3a3a3;--fg-3:#7a7a7a;--fg-4:#4a4a4a;
  --ink:#f2f2f2;--ink-fg:#0c0c0c;--in:#00c969;--out:#ff5a4f;--warn:#f5b84d;--warn-bg:#2a1f0c;--sel:#1d1d1d;
  --veil:rgb(0 0 0 / .55);--shadow:0 8px 30px rgb(0 0 0 / .5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0c;--card:#121212;--sunk:#1a1a1a;--line:#1d1d1d;--line-2:#2c2c2c;
  --fg:#f2f2f2;--fg-2:#a3a3a3;--fg-3:#7a7a7a;--fg-4:#4a4a4a;
  --ink:#f2f2f2;--ink-fg:#0c0c0c;--in:#00c969;--out:#ff5a4f;--warn:#f5b84d;--warn-bg:#2a1f0c;--sel:#1d1d1d;
  --veil:rgb(0 0 0 / .55);--shadow:0 8px 30px rgb(0 0 0 / .5);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:400;font-size:14px;line-height:20px;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,h3,p{margin:0;font-weight:400}
:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
svg{flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.m{font-family:var(--mono);font-size:13px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);letter-spacing:-.01em}
.f2{color:var(--fg-2)}.f3{color:var(--fg-3)}
.in{color:var(--in)}.out{color:var(--out)}
.r{text-align:right}

/* Coquille : rail de PDS OS, navigation de Finance, barre du haut */
.shell{display:flex;min-height:100%}
.rail{position:sticky;top:0;height:100dvh;width:56px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;background:var(--bg)}
.rail .logo{width:32px;height:32px;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;font-weight:600;font-size:13px;margin-bottom:12px}
.rail span.ri{width:36px;height:36px;display:grid;place-items:center;color:var(--fg-3)}
.rail span.ri.on{color:var(--fg);background:var(--sel)}
.nav{position:sticky;top:0;height:100dvh;width:220px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg)}
.nav .hd{height:56px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line)}
.nav .hd b{font-family:var(--serif);font-weight:400;font-size:18px}
.nav ul{list-style:none;margin:0;padding:12px 8px;display:flex;flex-direction:column;gap:1px;flex:1}
.nav button{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border:0;background:none;color:var(--fg-2);text-align:left;cursor:pointer}
.nav button[aria-current="page"]{background:var(--sel);color:var(--fg)}
.nav .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--fg-3)}
.nav .foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.av{width:28px;height:28px;background:var(--sunk);display:grid;place-items:center;font-size:11px;font-weight:500;flex-shrink:0;color:var(--fg-2)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:56px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg)}
.find{display:flex;align-items:center;gap:8px;color:var(--fg-3);background:none;border:0;cursor:pointer;padding:0;height:36px;flex:1;text-align:left}
.kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--line-2);color:var(--fg-3)}
.bell{position:relative;width:36px;height:36px;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.bell i{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:#f5b84d}
.mtop{display:none}
.page{padding:24px;display:flex;flex-direction:column;gap:20px;width:100%;max-width:1480px;margin:0 auto;padding-bottom:140px}

/* Boutons et champs : coins droits, contour fin */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border:1px solid var(--ink);background:var(--ink);color:var(--ink-fg);cursor:pointer;white-space:nowrap}
.btn.o{background:var(--bg);color:var(--fg);border-color:var(--line-2)}
.btn.g{background:none;border-color:transparent;color:var(--fg-2)}
.btn.s{height:28px;padding:0 10px;font-size:13px}
.btn:active{transform:scale(.98)}
.ib{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--bg);cursor:pointer;color:var(--fg)}
.ib.s{width:28px;height:28px}
.lnk{background:none;border:0;padding:0;cursor:pointer;color:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;text-decoration-color:var(--fg-3)}
.inp{height:34px;width:100%;padding:0 10px;border:1px solid var(--line-2);background:var(--bg);outline:0}
.inp:focus{border-color:var(--fg)}
.inp[aria-invalid="true"]{border-color:var(--out)}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line-2);flex:0 1 380px;min-width:180px;color:var(--fg-3)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--fg)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-2);max-width:100%;overflow-x:auto}
.seg button{height:32px;padding:0 12px;border:0;background:none;color:var(--fg-3);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--fg)}
.seg .c{font-family:var(--mono);font-size:12px;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;background:var(--sunk);color:var(--fg-2);font-size:13px;cursor:pointer;border:0}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;letter-spacing:-.02em;height:22px;padding:0 6px;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap}
.tag.k{border-color:var(--fg);color:var(--fg)}
.tag.w{border-color:var(--warn);color:var(--warn)}
.tag.i{border-color:var(--in);color:var(--in)}
.tag.x{border-color:var(--out);color:var(--out)}
.sq{width:10px;height:10px;display:inline-block;flex-shrink:0}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg-4)}
.st.k::before{background:var(--fg)}.st.i::before{background:var(--in)}.st.w{color:var(--warn)}.st.w::before{background:var(--warn)}.st.x{color:var(--out)}.st.x::before{background:var(--out)}

/* Tableaux : grille de filets, 6 colonnes au plus, montants à droite */
.tw{border:1px solid var(--line);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{height:40px;padding:0 14px;text-align:left;font-weight:400;color:var(--fg-3);border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
td{height:46px;padding:0 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td+td,th+th{border-left:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr[aria-selected="true"]{background:var(--sel)}
td .s2{font-size:12px;color:var(--fg-3);display:block;line-height:16px}
td.lbl{white-space:normal;min-width:220px}
tr.inrow td.amt{color:var(--in)}
.total{position:sticky;bottom:84px;align-self:center;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--bg);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:13px;z-index:5}
.selbar{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;background:var(--bg);border:1px solid var(--line-2);box-shadow:var(--shadow);z-index:30}

/* Cartes, chiffres */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:14px;background:var(--bg);text-align:left;cursor:pointer;min-width:0}
.tile .k{color:var(--fg-2)}
.tile .v{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tile .v b{font-family:var(--serif);font-weight:400;font-size:28px;line-height:32px}
.tile .v span{color:var(--fg-3)}
.card{border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;background:var(--bg)}
.card .hd{display:flex;align-items:center;gap:10px;color:var(--fg-2)}
.card .hd .sp{flex:1}
.big{font-family:var(--serif);font-size:36px;line-height:40px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--fg-3);font-family:var(--mono)}
.leg i{display:inline-block;width:14px;border-top:2px solid var(--fg);vertical-align:middle;margin-right:6px}
.leg i.d{border-top-style:dashed}.leg i.r{border-top:1px dashed var(--out)}
.leg b{display:inline-block;width:10px;height:10px;background:var(--fg);vertical-align:-1px;margin-right:6px}
.leg b.g{background:var(--fg-4)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .t{flex:1;min-width:0}
.rows .t span{display:block;font-size:12px;color:var(--fg-3)}
.rows button.t{background:none;border:0;padding:0;text-align:left;cursor:pointer}
.meter{height:4px;background:var(--sunk);position:relative;margin-top:6px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--fg)}
.meter i.w{background:var(--warn)}.meter i.x{background:var(--out)}
svg.ch{width:100%;height:auto;display:block;overflow:visible}

/* Vue d'ensemble */
.hello{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 0 8px;text-align:center}
.hello h1{font-family:var(--serif);font-size:44px;line-height:50px}
.hello h1 span{color:var(--fg-3)}
.rot{min-height:22px;color:var(--fg-2);font-size:15px}
.rot button{background:none;border:0;padding:0;cursor:pointer;color:var(--fg);text-decoration:underline dotted var(--fg-3);text-underline-offset:4px}
.dots{display:flex;gap:6px;justify-content:center}
.dots button{width:16px;height:3px;border:0;padding:0;background:var(--line-2);cursor:pointer}
.dots button[aria-current="true"]{background:var(--fg)}
.ask{width:min(820px,100%);margin:8px auto 0;background:var(--card);padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
.ask textarea{border:0;outline:0;background:none;resize:none;height:44px;font-size:15px}
.ask .row{display:flex;align-items:center;gap:6px;color:var(--fg-3)}
.ask .row .sp{flex:1}
.go{width:30px;height:30px;border:0;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;cursor:pointer}
.sugg{width:min(820px,100%);margin:0 auto;display:flex;flex-direction:column}
.sugg button{background:none;border:0;text-align:left;padding:7px 2px;color:var(--fg-2);cursor:pointer;font-family:var(--mono);font-size:13px}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.chat{width:min(820px,100%);margin:0 auto;display:flex;flex-direction:column;gap:16px}
.chat .me{align-self:flex-end;background:var(--card);padding:8px 12px;max-width:80%}
.chat .po{display:flex;flex-direction:column;gap:10px;color:var(--fg);max-width:100%}
.chat .tools{display:flex;flex-wrap:wrap;gap:6px}
.chat .note{font-size:12px;color:var(--fg-3)}

/* Justificatifs : grille d'aperçus (comme le Vault de Midday) ou liste */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rc{position:relative;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;min-width:0}
.rc.on{border-color:var(--fg)}
.rc-hit{position:absolute;inset:0;border:0;background:none;cursor:pointer;z-index:1}
.rc .btn{position:relative;z-index:2}
.th{position:relative;height:150px;background:var(--card);display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line)}
.th .tp{width:118px;background:#fff;color:#111;padding:10px 10px 12px;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 3px rgb(0 0 0 / .14);transform:translateY(14px)}
.th .tp b{font-family:var(--serif);font-weight:400;font-size:10px;line-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .tp i{display:block;height:3px;background:#e2e0dc}
.th .tp .hr{border-top:1px dashed #bbb;margin:2px 0}
.th .tp .tt{display:flex;justify-content:space-between;font-family:var(--mono);font-size:7px;line-height:9px}
.th.ph .tp{background:#efebe2;transform:translateY(14px) rotate(-3deg)}
.th .kind{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:10px;color:var(--fg-3);border:1px solid var(--line-2);padding:0 4px;background:var(--bg)}
.th.mini{height:46px;width:40px;border:1px solid var(--line);place-items:start center}
.th.mini .tp{width:30px;padding:4px;gap:2px;transform:translateY(5px)}
.th.mini .tp b,.th.mini .tp .tt,.th.mini .kind{display:none}
.th.mini .tp i{height:2px}
.th.mini.ph .tp{transform:translateY(5px) rotate(-3deg)}
.stb{position:absolute;top:8px;right:8px;z-index:2;background:var(--bg);border:1px solid var(--line-2);height:22px;padding:0 7px;font-size:12px}
.rc-b{padding:12px 14px 12px;display:flex;flex-direction:column;gap:6px}
.rc-t{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.rc-t span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-s{font-size:12px;line-height:16px}
.rc-m{font-size:13px;color:var(--fg-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.rc-m span{color:var(--fg)}
.rc-f{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.rc-f .sp{flex:1}
@media (hover:hover) and (pointer:fine){.rc:hover{border-color:var(--line-2)}.rc:hover .th{background:var(--sunk)}}

/* Fiche latérale */
.veil{position:fixed;inset:0;z-index:60;background:var(--veil)}
.sheet{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line-2);display:flex;flex-direction:column}
.sheet.enter{animation:sl 220ms var(--ease)}
@keyframes sl{from{transform:translateX(30px);opacity:0}}
.sh-top{display:flex;align-items:center;gap:8px;padding:14px 20px;color:var(--fg-3);font-size:13px}
.sh-top .sp{flex:1}
.sh-body{flex:1;overflow-y:auto;padding:4px 24px 24px;display:flex;flex-direction:column;gap:20px}
.sh-foot{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--fg-3)}
.sh-foot .sp{flex:1}
.sh-title{display:flex;flex-direction:column;gap:6px}
.sh-title .amt{font-family:var(--mono);font-size:34px;line-height:40px;letter-spacing:-.04em}
.fl{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.fl li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;align-items:center;min-height:42px;padding:6px 0;border-bottom:1px solid var(--line)}
.fl .l{color:var(--fg-3)}
.fl .v{min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fl .v button.ed{background:none;border:0;padding:4px 6px;margin:-4px -6px;text-align:left;cursor:text;color:var(--fg);min-width:0}
.fl .v button.ed:hover{background:var(--card)}
.fl .v .inp{height:30px}
.fl .src{grid-column:2;font-size:12px;color:var(--fg-3);margin-top:-4px}
.acc{border-top:1px solid var(--line)}
.acc>button{display:flex;align-items:center;width:100%;height:44px;border:0;background:none;padding:0;cursor:pointer;font-size:15px;color:var(--fg)}
.acc>button span{flex:1;text-align:left}
.acc .in-acc{padding:4px 0 16px;display:flex;flex-direction:column;gap:12px}
.prop{border:1px solid var(--fg);padding:14px;display:flex;flex-direction:column;gap:10px}
.prop .why{display:flex;flex-wrap:wrap;gap:6px}
.alt{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card)}
.alt .t{flex:1;min-width:0}
.alt .t span{display:block;font-size:12px;color:var(--fg-3)}
.notice{display:flex;gap:10px;padding:10px 12px;background:var(--warn-bg);color:var(--warn)}
.done{display:flex;gap:10px;padding:10px 12px;background:var(--card);color:var(--fg)}
.done svg{color:var(--in)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.hist li{display:grid;grid-template-columns:18px 1fr;gap:10px;font-size:13px}
.hist li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fg);margin:6px 0 0 5px}
.hist li.todo::before{background:none;border:1px solid var(--fg-3)}
.hist .w{color:var(--fg-3);font-size:12px;display:block}
.drop{border:1px dashed var(--line-2);padding:16px;text-align:center;color:var(--fg-3);background:none;width:100%;cursor:pointer}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line)}
.file .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Document : facture, reçu */
.doc{background:var(--card);padding:18px;display:grid;place-items:center}
.paper{width:100%;max-width:380px;background:#fff;color:#111;padding:22px;font-size:12px;line-height:17px;box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.paper h4{margin:0 0 12px;font-family:var(--serif);font-weight:400;font-size:20px}
.paper .r2{display:flex;justify-content:space-between;gap:10px}
.paper .gr{color:#777}
.paper .hr{border-top:1px solid #ddd;margin:10px 0}
.paper .m{font-size:12px}

/* Modale */
.scrim{position:fixed;inset:0;z-index:70;background:var(--veil);display:grid;place-items:center;padding:16px}
.dlg{width:min(540px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;background:var(--bg);border:1px solid var(--line-2);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px}
.dlg.enter{animation:dg 160ms var(--ease)}

/* ---- Calculs ---- */
let DB;
const budgetOf = id => DB.budgets.find(b => b.id === id);
const spendsOf = id => DB.spends.filter(s => s.b === id);
const total = b => b.model ? b.model.amount * spendsOf(b.id).length + b.revisions.filter(r => r.ok).reduce((a, r) => a + r.a, 0) : b.initial + b.revisions.filter(r => r.ok).reduce((a, r) => a + r.a, 0);
const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
function figures(b, filter){
  const ls = spendsOf(b.id).filter(filter || (() => true));
  const by = st => sum(ls.filter(s => s.status === st), ttc);
  const planned = by("prévu"), committed = by("commandé"), invoiced = by("facturé"), paid = by("payé");
  const used = committed + invoiced + paid;
  const tot = total(b);
  const prev = sum(ls.filter(s => s.plan != null), s => s.plan * (1 + s.vat));
  const real = sum(ls.filter(s => s.plan != null && s.status !== "prévu"), ttc), realPlan = sum(ls.filter(s => s.plan != null && s.status !== "prévu"), s => s.plan * (1 + s.vat));
  return {tot, initial:b.model ? b.model.amount * spendsOf(b.id).length : b.initial, rev:sum(b.revisions.filter(r => r.ok), r => r.a), planned, committed, invoiced, paid, used,
    left:tot - used, pct:tot ? used / tot : 0, rebill:sum(ls.filter(s => s.rebill), ttc), gap:real - realPlan, prev};
}
const invTtc = f => Math.round(f.ht * (1 + f.vat) * 100) / 100;
const invPaid = f => sum(f.pays, p => p.a);
const invLeft = f => invTtc(f) - invPaid(f);
function invState(f){
  if (f.state === "draft") return ["Brouillon",""];
  if (f.state === "cancelled") return ["Annulée",""];
  if (f.state === "credit") return ["Avoir",""];
  const left = invLeft(f) + (f.id === "f28" ? -600 : 0);
  if (left <= 0.01) return ["Encaissée","i"];
  if (f.due && f.due < TODAY) return [invPaid(f) > 0 ? `Partiellement encaissée · en retard` : `En retard de ${dayDiff(f.due, TODAY)} j`, "x"];
  if (invPaid(f) > 0) return ["Partiellement encaissée","w"];
  return ["Envoyée","k"];
}
const invOpen = f => f.state === "sent" && invState(f)[0] !== "Encaissée";

const BAL0 = 72320.45; // relevé Qonto du 13/11 + mouvements depuis
function events(){
  const ev = [];
  DB.spends.filter(s => s.status !== "payé").forEach(s => ev.push({d:s.due < TODAY ? addDays(TODAY, 2) : s.due, a:-ttc(s), label:s.label, sub:`${budgetOf(s.b)?.name || "Hors budget"} · ${s.status}`, kind:"spend", id:s.id, movable:s.movable}));
  DB.invoices.filter(invOpen).forEach(f => ev.push({d:f.due < TODAY ? addDays(TODAY, 7) : f.due, a:invLeft(f), label:`${f.no} · ${f.client}`, sub:f.due < TODAY ? "En retard : attendue sous 7 jours" : "Échéance de la facture", kind:"invoice", id:f.id}));
  DB.expected.forEach(x => ev.push({d:x.d, a:x.a, label:x.label, sub:"Recette attendue", kind:"expected"}));
  for (let k = 0; k < 5; k++) ev.push({d:new Date(2026, 11 + k, 5), a:-1850, label:`Mensualité Pay Later ${4 + k}/14`, sub:"dont 85 € d'intérêts", kind:"engine"});
  // Orchard : 52 000 € tous les 12 titres, versés 30 jours après le 12e (titres provisoires des émissions PDS MIC).
  let titles = 2;
  spendsOf("mic").filter(s => s.status !== "payé").sort((a, b) => a.planned - b.planned).forEach(s => {
    titles += s.titles || 0;
    while (titles >= 12){ titles -= 12; ev.push({d:addDays(s.planned, 30), a:52000, label:"Avance The Orchard", sub:`12 titres atteints avec ${s.label}`, kind:"engine"}); }
  });
  // J4Y : la part non financée par PDS est appelée auprès du partenaire.
  const j = budgetOf("j4y"); const partner = Math.round(total(j) * (100 - j.share) / 100);
  if (partner > 0) ev.push({d:D(2027,1,15), a:partner, label:`Part de ${j.partner} sur J4Y`, sub:`${100 - j.share} % du budget`, kind:"engine"});
  ev.push({d:D(2027,3,26), a:6000, label:"Aide CNM au clip de Dioo", sub:"Versée à la livraison du clip", kind:"engine"});
  return ev.filter(e => e.d > TODAY).sort((a, b) => a.d - b.d);
}
function timeline(days){
  const ev = events(); let bal = BAL0; const pts = [{d:TODAY, bal}];
  const out = [];
  ev.forEach(e => { bal += e.a; out.push(Object.assign({bal}, e)); pts.push({d:e.d, bal}); });
  const end = addDays(TODAY, days || 150);
  const inWin = out.filter(e => e.d <= end);
  let low = {d:TODAY, bal:BAL0}; inWin.forEach(e => { if (e.bal < low.bal) low = e; });
  const at = n => { const lim = addDays(TODAY, n); let b = BAL0; out.forEach(e => { if (e.d <= lim) b = e.bal; }); return b; };
  return {events:out, pts, low, at, under:inWin.find(e => e.bal < RESERVE)};
}

/* Propositions de rapprochement : montant, date, tiers, référence. */
function words(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[^a-z0-9]+/).filter(w => w.length > 2); }
function proposals(tx){
  if (tx.state !== "open") return [];
  const out = [];
  const tw = words(tx.party + " " + tx.ref);
  if (tx.a < 0){
    DB.spends.filter(s => s.status === "facturé" || s.status === "commandé").forEach(s => {
      const why = []; let sc = 0;
      if (Math.abs(ttc(s) + tx.a) < .02){ why.push("même montant"); sc += 50; }
      if (words(s.sup).some(w => tw.includes(w))){ why.push("même tiers"); sc += 25; }
      if (Math.abs(dayDiff(s.due, tx.d)) <= 5){ why.push("date proche"); sc += 10; }
      if (s.ref && tw.includes(s.ref)) { why.push("référence"); sc += 40; }
      if (sc >= 60) out.push({kind:"spend", id:s.id, why, sc, label:s.label, sub:`${budgetOf(s.b)?.name || "Hors budget"} · ${s.status} · ${eur(ttc(s))}`});
    });
  } else {
    DB.invoices.filter(invOpen).forEach(f => {
      const why = []; let sc = 0;
      if (Math.abs(invLeft(f) - tx.a) < .02){ why.push("reste exact de la facture"); sc += 50; }
      if (tx.ref.includes(f.no)){ why.push("référence " + f.no); sc += 40; }
      if (words(f.client).some(w => tw.includes(w))){ why.push("même client"); sc += 25; }
      if (sc >= 60) out.push({kind:"invoice", id:f.id, why, sc, label:`${f.no} · ${f.label}`, sub:`${f.client} · reste ${eur(invLeft(f))}`});
    });
  }
  return out.sort((a, b) => b.sc - a.sc);
}
function isDouble(tx){ return tx.state === "open" && DB.txs.some(o => o !== tx && o.state !== "ignored" && o.party === tx.party && o.a === tx.a && +o.d === +tx.d && DB.txs.indexOf(o) < DB.txs.indexOf(tx)); }
function txStatus(tx){
  if (tx.state === "ignored") return ["Ignorée",""];
  if (tx.state === "done") return ["Rapprochée","i"];
  if (isDouble(tx)) return ["Doublon possible","w"];
  return proposals(tx).length ? ["Proposition","k"] : ["À rapprocher",""];
}
const txProof = tx => { if (tx.link?.kind === "spend") return DB.spends.find(s => s.id === tx.link.id)?.proof; if (tx.link?.kind === "invoice") return "facture émise"; if (tx.link?.kind === "engine") return "échéancier"; return null; };
const readyForAccountant = tx => tx.state === "done" && !!txProof(tx) && !DB.exportsSent.includes(tx.id);

/* Alertes du ticket : réserve, budget à 82 % ou dépassé, doublon, refacturable sans remboursement, décalage positif, retard. */
function alerts(){
  const out = [], tl = timeline(150);
  if (tl.under) out.push({t:"w", ic:"down", title:`Le solde passe sous la réserve minimale le ${fd(tl.under.d)}`, sub:`${eur0(tl.under.bal)} après « ${tl.under.label} » · réserve ${eur0(RESERVE)}`, go:["planning"]});
  DB.budgets.forEach(b => { const f = figures(b); if (f.pct >= 1) out.push({t:"x", ic:"warn", title:`${b.name} dépasse son budget`, sub:`${Math.round(f.pct * 100)} % consommé · ${eur0(-f.left)} au-delà`, go:["budget", b.id]});
    else if (f.pct >= .8) out.push({t:"w", ic:"warn", title:`${b.name} a consommé ${Math.round(f.pct * 100)} % de son budget`, sub:`Reste ${eur0(f.left)} sur ${eur0(f.tot)}`, go:["budget", b.id]}); });
  DB.txs.filter(isDouble).forEach(t => out.push({t:"w", ic:"dup", title:`Facture potentiellement dupliquée : ${t.party.toLowerCase().replace(/\b\w/g, c => c.toUpperCase())}`, sub:`Deux débits de ${eur(-t.a)} le ${fd(t.d)}`, go:["tx", t.id]}));
  DB.spends.filter(s => s.rebill && !s.rebill.planned).forEach(s => out.push({t:"w", ic:"rebill", title:`Dépense refacturable sans remboursement planifié`, sub:`${s.label} · ${eur(ttc(s))} à refacturer à ${s.rebill.to}`, go:["spend", s.id]}));
  DB.spends.filter(s => s.b === "hors").forEach(s => out.push({t:"w", ic:"warn", title:`Dépense hors budget`, sub:`${s.label} · ${eur(ttc(s))} · à rattacher à une enveloppe`, go:["spend", s.id]}));
  DB.invoices.filter(f => invOpen(f) && f.due < TODAY).forEach(f => out.push({t:"x", ic:"clock", title:`${f.no} en retard de ${dayDiff(f.due, TODAY)} jours`, sub:`${f.client} · ${eur(invLeft(f))} · dernière relance ${f.reminders.length ? fd(f.reminders.at(-1)) : "jamais"}`, go:["invoice", f.id]}));
  if (DB.micMoved) out.unshift({t:"i", ic:"up", title:`Décaler l'émission #10 améliore la trésorerie`, sub:DB.micMoved, go:["planning"]});
  return out;
}

/* ---------- Graphiques d'une seule encre ---------- */
function balanceChart(days, H){
  const tl = timeline(days), W = 1000; H = H || 220;
  const end = addDays(TODAY, days), start = pastReal[0][0];
  const fut = [{d:TODAY, bal:BAL0}].concat(tl.events.filter(e => e.d <= end).map(e => ({d:e.d, bal:e.bal})));
  const vals = pastReal.map(p => p[1]).concat(fut.map(p => p.bal), [RESERVE]);
  const lo = Math.floor((Math.min(...vals) - 8000) / 10000) * 10000, hi = Math.ceil((Math.max(...vals) + 5000) / 10000) * 10000;
  const x = d => 46 + (d - start) / (end - start) * (W - 56), y = v => 10 + (hi - v) / (hi - lo) * (H - 34);
  const step = pts => pts.map((p, i) => i ? `L${x(p.d).toFixed(1)},${y(pts[i - 1].bal ?? pts[i - 1][1]).toFixed(1)} L${x(p.d).toFixed(1)},${y(p.bal).toFixed(1)}` : `M${x(p.d).toFixed(1)},${y(p.bal).toFixed(1)}`).join(" ");
  const past = pastReal.map(([d, v], i) => `${i ? "L" : "M"}${x(d).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const grid = []; for (let v = lo; v <= hi; v += 20000) grid.push(`<line x1="46" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="0" y="${y(v) + 4}" font-size="11" font-family="var(--mono)" fill="var(--fg-3)">${v / 1000} k</text>`);
  const months = []; for (let m = new Date(start.getFullYear(), start.getMonth() + 1, 1); m <= end; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) months.push(`<text x="${x(m)}" y="${H - 4}" font-size="11" font-family="var(--mono)" fill="var(--fg-3)" text-anchor="middle">${MO[m.getMonth()]}</text>`);
  const low = tl.low;
  return `<div class="leg"><span><i></i>Réel</span><span><i class="d"></i>Prévu</span><span><i class="r"></i>Réserve ${eur0(RESERVE)}</span><span>● Point bas ${eur0(low.bal)} le ${fs(low.d)}</span></div>
  <svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Solde réel puis prévu sur ${days} jours">${grid.join("")}${months.join("")}
    <line x1="46" x2="${W - 10}" y1="${y(RESERVE)}" y2="${y(RESERVE)}" stroke="var(--out)" stroke-dasharray="4 4" stroke-width="1"/>
    <path d="${past}" fill="none" stroke="var(--fg)" stroke-width="1.6"/>
    <path d="${step(fut)}" fill="none" stroke="var(--fg)" stroke-width="1.6" stroke-dasharray="5 4"/>
    <line x1="${x(TODAY)}" x2="${x(TODAY)}" y1="6" y2="${H - 22}" stroke="var(--line-2)"/>
    <circle cx="${x(low.d)}" cy="${y(low.bal)}" r="4" fill="var(--bg)" stroke="${low.bal < RESERVE ? "var(--out)" : "var(--fg)"}" stroke-width="1.6"/></svg>`;
}
function flowBars(){
  const months = [10, 11, 12, 13, 14, 15].map(m => new Date(2026, m, 1));
  const ev = events(), W = 1000, H = 200;
  const data = months.map(m => { const n = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    const inn = sum(ev.filter(e => e.d >= m && e.d < n && e.a > 0), e => e.a), out = -sum(ev.filter(e => e.d >= m && e.d < n && e.a < 0), e => e.a);
    if (m.getMonth() === 10 && m.getFullYear() === 2026) return {m, inn:inn + 12000, out:out + 13471.88};
    return {m, inn, out}; });
  const max = Math.max(...data.map(d => Math.max(d.inn, d.out))) * 1.1, bw = 28, gw = (W - 60) / data.length;
  const y = v => (H - 26) - v / max * (H - 40);
  return `<div class="leg"><span><b></b>Entrées</span><span><b class="g"></b>Sorties</span></div><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entrées et sorties par mois">
    <defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--bg)"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--fg-3)" stroke-width="1.6"/></pattern></defs>
    ${data.map((d, i) => { const cx = 50 + i * gw + gw / 2; return `<rect x="${cx - bw - 2}" y="${y(d.inn)}" width="${bw}" height="${(H - 26) - y(d.inn)}" fill="var(--fg)"/><rect x="${cx + 2}" y="${y(d.out)}" width="${bw}" height="${(H - 26) - y(d.out)}" fill="url(#hatch)" stroke="var(--fg-3)"/>
      <text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="11" font-family="var(--mono)" fill="var(--fg-3)">${MO[d.m.getMonth()]}</text>
      <text x="${cx - bw / 2 - 2}" y="${y(d.inn) - 5}" text-anchor="middle" font-size="10" font-family="var(--mono)" fill="var(--fg-2)">${d.inn ? Math.round(d.inn / 1000) + "k" : ""}</text>
      <text x="${cx + bw / 2 + 2}" y="${y(d.out) - 5}" text-anchor="middle" font-size="10" font-family="var(--mono)" fill="var(--fg-2)">${d.out ? Math.round(d.out / 1000) + "k" : ""}</text>`; }).join("")}
    <line x1="40" x2="${W - 10}" y1="${H - 26}" y2="${H - 26}" stroke="var(--line-2)"/></svg>`;
}
function donut(lines){
  const by = {}; lines.forEach(s => { by[s.post] = (by[s.post] || 0) + ttc(s); });
  const ent = Object.entries(by).sort((a, b) => b[1] - a[1]), tot = sum(ent, e => e[1]) || 1;
  let a0 = -Math.PI / 2; const R = 70, r = 46, cx = 80, cy = 80;
  const arcs = ent.map(([k, v]) => { const a1 = a0 + v / tot * Math.PI * 2, lg = a1 - a0 > Math.PI ? 1 : 0;
    const p = (ang, rad) => `${(cx + rad * Math.cos(ang)).toFixed(2)},${(cy + rad * Math.sin(ang)).toFixed(2)}`;
    const d = ent.length === 1 ? `M${cx - R},${cy} a${R},${R} 0 1,0 ${2 * R},0 a${R},${R} 0 1,0 ${-2 * R},0 M${cx - r},${cy} a${r},${r} 0 1,1 ${2 * r},0 a${r},${r} 0 1,1 ${-2 * r},0` : `M${p(a0, R)} A${R},${R} 0 ${lg} 1 ${p(a1, R)} L${p(a1, r)} A${r},${r} 0 ${lg} 0 ${p(a0, r)} Z`;
    a0 = a1; return `<path d="${d}" fill="${POSTS[k] || "#999"}" stroke="var(--bg)" stroke-width="1.5" fill-rule="evenodd"><title>${k} : ${eur(v)}</title></path>`; });
  return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Répartition par poste">${arcs.join("")}<text x="80" y="78" text-anchor="middle" font-size="11" fill="var(--fg-3)" font-family="var(--mono)">total</text><text x="80" y="94" text-anchor="middle" font-size="13" fill="var(--fg)" font-family="var(--mono)">${eur0(tot)}</text></svg>
    <ul class="rows" style="flex:1;min-width:200px">${ent.map(([k, v]) => `<li><span class="sq" style="background:${POSTS[k] || "#999"}"></span><span class="t">${k}</span><span class="m">${eur0(v)}</span><span class="m f3" style="width:40px;text-align:right">${Math.round(v / tot * 100)} %</span></li>`).join("")}</ul></div>`;
}

    ${rows.map(s => `<tr data-open="spend|${s.id}" aria-selected="${U.sheet?.id === s.id}" data-flash-id="${s.id}"><td class="lbl">${esc(s.label)}${s.rebill ? `<span class="s2">Refacturable à ${esc(s.rebill.to)}</span>` : ""}</td>

  importLines(){ openModal("importLines"); },
  doImportLines(){ const rows = $("lines").value.split("\n").map(l => l.split("\t")).filter(r => r.length >= 5);
    rows.forEach((r, i) => { const [d, m, y] = r[3].split("/").map(Number); DB.spends.push({id:"il" + Date.now() + i, b:"dioo", label:r[0], post:POSTS[r[1]] ? r[1] : "Frais divers", sup:r[2], planned:new Date(y, m - 1, d), due:new Date(y, m - 1, d), status:"prévu", ht:parseAmt(r[4]), vat:.2, funding:"Fonds propres PDS", rebill:null, proof:null, validator:"Claire Morel", comment:"", hist:[[me(), stamp(), "Importée"]], plan:parseAmt(r[4])}); });
    U.layer = null; toast(`${rows.length} lignes importées`, "Total et écarts recalculés"); render(); },
  planRebill(){ const s = DB.spends.find(x => x.id === U.sheet.id); s.rebill.planned = true; DB.expected.push({label:`Remboursement : ${s.label}`, from:s.rebill.to, d:addDays(TODAY, 30), a:ttc(s)}); s.hist.push([me(), stamp(), `Remboursement planifié auprès de ${s.rebill.to}`]); toast("Remboursement planifié", `Recette attendue de ${eur(ttc(s))}, distincte de la dépense`); render(); },
  setRebill(){ const s = DB.spends.find(x => x.id === U.sheet.id); s.rebill = {to:"Kuma Records", planned:false}; s.hist.push([me(), stamp(), "Refacturable : non → oui (Kuma Records)"]); render(); },
  checkPhoto(){ const r = DB.inbox.find(x => x.id === U.sheet.id); r.checked = me(); toast("Valeurs confirmées"); render(); },
  unmatch(){ const t = DB.txs.find(x => x.id === U.sheet.id);
    if (t.link.kind === "spend"){ const s = DB.spends.find(x => x.id === t.link.id); s.status = "facturé"; s.hist.push([me(), stamp(), "Rapprochement défait : payé → facturé"]); }
    if (t.link.kind === "invoice"){ const f = DB.invoices.find(x => x.id === t.link.id); f.pays = f.pays.filter(p => +p.d !== +t.d || p.a !== t.a); }
    t.state = "open"; delete t.link; U.sheet.flash = null; toast("Rapprochement défait", "L'historique le garde"); render(); },
  ignore(el){ const t = DB.txs.find(x => x.id === U.sheet.id); t.state = "ignored"; t.why = el.dataset.why; toast("Opération ignorée", t.why); render(); },
  unignore(){ const t = DB.txs.find(x => x.id === U.sheet.id); t.state = "open"; render(); },
  notDouble(){ const t = DB.txs.find(x => x.id === U.sheet.id); t.party += " "; render(); },
  txToSpend(){ const t = DB.txs.find(x => x.id === U.sheet.id); U.sheet = {kind:"newSpend", enter:false, fromTx:t.id, f:{label:t.party.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()) + " · " + t.ref.toLowerCase(), ht:nf2.format(-t.a / 1.2), vat:".2", b:"", post:"Frais divers", sup:t.party, status:"payé", due:fd(t.d), rebill:false}}; render(); },
  choose(){ toast("Choisir une dépense ou une facture", "La liste s'ouvre triée par montant le plus proche"); },
  cols(){ U.colOpen = !U.colOpen; render(); },
  clearSp(){ U.spBudget = ""; U.spStatus = ""; U.spView = "all"; U.q = ""; render(); },
  copyAddr(){ const done = () => toast("Adresse copiée", "justificatifs@pdsrecords.com"); try { navigator.clipboard.writeText("justificatifs@pdsrecords.com").then(done, done); } catch(e){ done(); } },
  showDone(){ U.inFilter = "done"; render(); },
  noop(){}
};

document.addEventListener("click", e => {
  const t = e.target;
  const stop = t.closest("[data-stop]");
  const a = t.closest("[data-act]");
  if (a && a.dataset.act === "closeModal" && stop && a.classList.contains("scrim")) return;
  if (stop && a && !stop.contains(a)) return;
  const rot = t.closest("[data-rot]"); if (rot){ U.rot = +rot.dataset.rot; render(); return; }
  const pick = t.closest("[data-pick]"); if (pick){ doPick(pick.dataset.pick); return; }
  const al = t.closest("[data-alert]"); if (al){ const x = alerts().filter(a => U.role !== "cp" || /J4Y|Dioo|refacturable/.test(a.title + a.sub))[+al.dataset.alert]; U.alertsOpen = false; followAlert(x.go); return; }
  const ask = t.closest("[data-ask]"); if (ask){ askPO(ask.dataset.ask); return; }
  const acc = t.closest("[data-accept]"); if (acc){ e.stopPropagation(); accept(acc.dataset.accept, acc.dataset.target); return; }
  const att = t.closest("[data-attach]"); if (att){ e.stopPropagation(); const r = DB.inbox.find(x => x.id === att.dataset.attach), s = DB.spends.find(x => x.id === r.match); r.state = "done"; r.justNow = true; r.by = me(); setTimeout(() => flash(r.id), 0); s.proof = r.file; s.hist.push([me(), stamp(), `Justificatif rattaché : ${r.file}`]); toast("Justificatif rattaché", s.label); render(); return; }
  const mdl = t.closest("[data-model]"); if (mdl){ const b = budgetOf(mdl.dataset.model), n = spendsOf(b.id).length + 1 + (b.id === "mic" ? 6 : 0); const last = spendsOf(b.id).at(-1);
    DB.spends.push({id:b.id + Date.now(), b:b.id, label:`${b.model.unit[0].toUpperCase() + b.model.unit.slice(1)} #${n}`, post:last.post, sup:last.sup, planned:addDays(last.planned, 35), due:addDays(last.planned, 35), status:"prévu", ht:Math.round(b.model.amount / 1.2 * 100) / 100, vat:.2, titles:b.model.titles, funding:"Fonds propres PDS", rebill:null, proof:null, validator:"Claire Morel", comment:"", hist:[[me(), stamp(), "Créée depuis le modèle"]], plan:Math.round(b.model.amount / 1.2 * 100) / 100});
    toast(`Nouveau ${b.model.unit} créé depuis le modèle`, `${eur0(b.model.amount)}${b.model.titles ? " · 10 titres provisoires" : ""} · trésorerie recalculée`); render(); return; }
  if (a){ if (a.disabled) return; ACT[a.dataset.act]?.(a); return; }
  const op = t.closest("[data-open]"); if (op){ const [k, id] = op.dataset.open.split("|"); if (U.layer?.t === "palette") U.layer = null; openSheet(k, id); return; }
  const g = t.closest("[data-go]"); if (g){ if (g.tagName === "BUTTON" && g.closest(".rot")) { go(g.dataset.go); return; } go(g.dataset.go); return; }
  const bd = t.closest("[data-budget]"); if (bd){ U.page = "budget"; U.budget = bd.dataset.budget; U.budgetFilter = ""; U.sheet = null; U.chat.length && (U.chat = U.chat); render(); window.scrollTo(0, 0); return; }
  const iv2 = t.closest("[data-inview]"); if (iv2){ U.inView = iv2.dataset.inview; try { localStorage.setItem("pds-fin-receipts", U.inView); } catch(e){} render(); return; }
  const inf = t.closest("[data-inf]"); if (inf){ DB.inbox.forEach(r => r.justNow = false); U.inFilter = inf.dataset.inf; render(); return; }
  const tv = t.closest("[data-txv]"); if (tv){ DB.txs.forEach(x => x.justNow = false); U.txView = tv.dataset.txv; render(); return; }
  const iv = t.closest("[data-invv]"); if (iv){ U.invView = iv.dataset.invv; render(); return; }
  const sv = t.closest("[data-spv]"); if (sv){ U.spView = sv.dataset.spv; render(); return; }
  const hz = t.closest("[data-horizon]"); if (hz){ U.horizon = +hz.dataset.horizon; render(); return; }
  const bf = t.closest("[data-bf]"); if (bf){ U.budgetFilter = bf.dataset.bf; render(); return; }
  const ed = t.closest("[data-ed]"); if (ed){ U.sheet.edit = ed.dataset.ed; renderLayer(); return; }
  const ac = t.closest("[data-acc]"); if (ac){ const k = ac.dataset.acc; if (k !== "proof"){ U.sheet.acc[k] = !U.sheet.acc[k]; renderLayer(); } return; }
  if (U.colOpen && !t.closest(".alerts")){ U.colOpen = false; render(); }
});
function followAlert(g){ if (g[0] === "planning") go("plan"); else if (g[0] === "budget"){ U.page = "budget"; U.budget = g[1]; render(); } else if (g[0] === "tx"){ U.page = "tx"; U.txView = "todo"; openSheet("tx", g[1]); } else if (g[0] === "spend"){ U.page = "spend"; openSheet("spend", g[1]); } else if (g[0] === "invoice"){ U.page = "invoice"; U.invView = "late"; openSheet("invoice", g[1]); } }
function doPick(v){ const [k, id] = v.split(":"); U.layer = null;
  if (k === "act"){ renderLayer(); ACT[id]?.(); return; }
  if (k === "budget"){ U.page = "budget"; U.budget = id; U.sheet = null; render(); return; }
  U.page = k === "spend" ? "spend" : k === "invoice" ? "invoice" : "tx"; if (k === "tx") U.txView = "all"; if (k === "invoice") U.invView = "all"; openSheet(k, id); }
function askPO(q){ U.showSugg = false; U.chat.push({me:q}, {pending:true}); render();
  setTimeout(() => { U.chat.pop(); U.chat.push(answer(q)); render(); }, 900); }
document.addEventListener("submit", e => { if (e.target.id === "ask"){ e.preventDefault(); const q = $("askIn").value.trim(); if (q) askPO(q); } });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "edv" && t.tagName === "SELECT"){ saveEdit(); return; }
  if (t.dataset.col){ U.cols[t.dataset.col] = t.checked ? 1 : 0; render(); return; }
  if (t.id === "spBudget"){ U.spBudget = t.value; render(); }
  if (t.id === "spStatus"){ U.spStatus = t.value; render(); }
  if (t.id === "rpBudget"){ U.rpBudget = t.value; render(); }
  if (t.id === "n-b" && U.sheet?.kind === "newSpend"){ readNew(); render(); }
  if (t.id === "note"){ const s = DB.spends.find(x => x.id === U.sheet.id); s.comment = t.value; s.hist.push([me(), stamp(), "Commentaire modifié"]); toast("Enregistré"); }
  if (t.dataset.move){ const s = DB.spends.find(x => x.id === t.dataset.move); const before = timeline(150); const oldM = s.planned.getMonth();
    s.planned = new Date(2027, Number(t.value) - 1, 9); s.due = s.planned; s.hist.push([me(), stamp(), `Déplacée de ${MOL[oldM]} à ${MOL[s.planned.getMonth()]}`]);
    const after = timeline(150), mar = tl => { let lo = Infinity; tl.events.forEach(e => { if (e.d.getMonth() === 2 && e.d.getFullYear() === 2027) lo = Math.min(lo, e.bal); }); return lo; };
    const d = Math.round(mar(after) - mar(before));
    const lo = tl => Math.min(...tl.events.filter(e => e.d <= D(2027,5,31)).map(e => e.bal));
    DB.micMoved = d ? `${s.label} en ${MOL[s.planned.getMonth()]} : le point bas de mars passe de ${eur0(mar(before))} à ${eur0(mar(after))} (${d > 0 ? "+" : "−"}${eur0(Math.abs(d))}). L'avance Orchard suit l'émission ; point bas jusqu'à fin mai : ${eur0(lo(before))} → ${eur0(lo(after))}.` : null;
    toast("Planning recalculé", DB.micMoved || "Trésorerie recalculée"); render(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q"){ U.q = t.value; const p = t.selectionStart; render(); const q = $("q"); q.focus(); q.setSelectionRange(p, p); }
  if (t.id === "pq"){ U.layer.q = t.value; U.layer.i = 0; renderLayer(); }
  if (t.id === "share"){ const b = budgetOf("j4y"); const old = b.share; b.share = Number(t.value); clearTimeout(window._sh); window._sh = setTimeout(() => { b.hist = (b.hist || []); toast("Part PDS réglée", `${b.share} % · trésorerie recalculée`); }, 400); render(); $("share")?.focus(); }
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); ACT.palette(); return; }
  if (U.layer?.t === "palette"){
    if (e.key === "Escape"){ U.layer = null; renderLayer(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); U.layer.i = Math.max(0, Math.min(U.layer.flat.length - 1, U.layer.i + (e.key === "ArrowDown" ? 1 : -1))); renderLayer(); return; }
    if (e.key === "Enter"){ e.preventDefault(); const it = U.layer.flat[U.layer.i]; if (it) doPick(it[1]); return; }
    return;
  }
  if (t_isEdit(e)){ if (e.key === "Enter"){ e.preventDefault(); saveEdit(); } if (e.key === "Escape"){ U.sheet.edit = null; renderLayer(); } return; }
  if (e.key === "Escape"){ if (U.layer){ U.layer = null; renderLayer(); } else if (U.alertsOpen){ U.alertsOpen = false; renderLayer(); } else if (U.sheet){ U.sheet = null; render(); } return; }
  if (U.sheet && !e.target.matches("input,textarea,select") && (e.key === "ArrowDown" || e.key === "ArrowUp")){ e.preventDefault(); sheetNav(e.key === "ArrowDown" ? 1 : -1); }
});
const t_isEdit = e => e.target.id === "edv";
document.addEventListener("focusout", e => { if (e.target.id === "edv" && e.target.tagName === "INPUT") setTimeout(() => { if ($("edv") === e.target) saveEdit(); }, 120); });
function receive(f){
  toast(`Envoi de ${f.length} fichier${f.length > 1 ? "s" : ""}`, "Lecture puis recherche de la dépense", true);
  setTimeout(() => { DB.inbox.unshift({id:"r" + Date.now(), vendor:"Karim Haddou", file:f[0].name, a:2400, d:TODAY, from:me(), match:"d2", state:"open"}); toast("1 justificatif lu", "Dépense proposée : Mixage des 5 titres"); U.page = "inbox"; U.inFilter = "todo"; U.sheet = null; render(); flash(DB.inbox[0].id); }, 1400); }
$("file").addEventListener("change", e => { const f = [...e.target.files]; e.target.value = ""; if (f.length) receive(f); });
let dragN = 0; const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
addEventListener("dragenter", e => { if (!hasFiles(e)) return; e.preventDefault(); if (dragN++ === 0){ const d = document.createElement("div"); d.id = "dropall"; d.className = "scrim"; d.style.zIndex = 90; d.innerHTML = `<div class="dlg" style="align-items:center;text-align:center;border-style:dashed;padding:48px">${I("upload",28)}<h2>Déposez vos justificatifs</h2><p class="f2">PDF ou photo : PDS OS les lit et propose la dépense de chacun.</p></div>`; document.body.appendChild(d); } });
addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener("dragleave", e => { if (hasFiles(e) && --dragN <= 0){ dragN = 0; $("dropall")?.remove(); } });
addEventListener("drop", e => { if (!hasFiles(e)) return; e.preventDefault(); dragN = 0; $("dropall")?.remove(); const f = [...e.dataTransfer.files]; if (f.length) receive(f); });
$("roleSel").addEventListener("change", e => { U.role = e.target.value; U.sheet = null; U.layer = null; U.chat = []; U.budget = null; render(); toast(`Vous voyez comme ${PEOPLE[U.role].name}`, U.role === "cp" ? "Les budgets et dépenses de ses projets seulement" : "Toute la Finance"); });
$("resetBtn").addEventListener("click", () => { DB = seed(); const r = U.role; U = freshUI(); U.role = r; render(); });
$("importBtn").addEventListener("click", () => { if (U.role === "cp"){ U.role = "bm"; } ACT.doImport(); });
setInterval(() => { if (U.page === "overview" && !U.chat.length && !U.sheet && !U.layer && document.visibilityState === "visible" && !document.querySelector("#askIn:focus")){ const n = sentences().length; U.rot = (U.rot + 1) % n; const el = $("rot"); if (el){ el.innerHTML = sentences()[U.rot]; document.querySelectorAll("[data-rot]").forEach((b, i) => b.setAttribute("aria-current", i === U.rot)); } } }, 6000);

DB = seed(); U = freshUI();
const H0 = location.hash.slice(1); if (NAV.some(n => n[0] === H0)) U.page = H0;
render();
</script>
