<title>Carte Maintenant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@500;600;700&display=swap">
<style>/* Tokens recopiés de app/globals.css (docs/DESIGN.md). Coquille : barre latérale collée au bord,
   page blanche, colonne de 896 px pour l'accueil. */
:root{
  --text-primary:#000;--text-secondary:#5e5e5e;--text-tertiary:#767676;--text-muted:#afafaf;
  --surface-app:#fbfbfb;--surface-page:#fff;--surface-raised:#fff;--surface-soft:#f4f4f4;--surface-sunken:#ececec;
  --surface-pressed:#e2e2e2;--surface-tint:rgb(64 64 64 / .06);
  --border-hairline:#ececec;--border-default:#d4d4d4;--border-hover:#afafaf;
  --nav-bg:#fff;--nav-fg:#000;--nav-fg-muted:#767676;--nav-item-hover-bg:#f4f4f4;--nav-item-active-bg:#ececec;--nav-border:rgb(0 0 0 / .08);
  --nav-brand-bg:#000;--nav-brand-fg:#fff;
  --tone-neutral-bg:#ececec;--tone-neutral-fg:#111;--tone-info-bg:#e2eefc;--tone-info-fg:#0b3d8c;
  --tone-warning-bg:#fcefd2;--tone-warning-fg:#6e4300;--tone-success-bg:#daf3e2;--tone-success-fg:#0d5226;
  --tone-danger-bg:#fce1df;--tone-danger-fg:#9a1b1b;--tone-action-bg:#ececec;--tone-action-fg:#111;
  --selection:#155dfc;--selection-bg:rgb(21 93 252 / .07);
  --primary-bg:#000;--primary-fg:#fff;--primary-hover:#282828;--control-hover:#f4f4f4;
  --shadow-card:0 1px 2px rgb(0 0 0 / .04),0 2px 8px rgb(0 0 0 / .04);
  --glass:rgb(20 20 20 / .82);--glass-fg:#fff;--glass-2:#b5b5b5;
  --font:"Google Sans Flex",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --text-primary:#ededed;--text-secondary:#a8a8a8;--text-tertiary:#8f8f8f;--text-muted:#5e5e5e;
  --surface-app:#0a0a0a;--surface-page:#0f0f0f;--surface-raised:#161616;--surface-soft:rgb(255 255 255 / .05);--surface-sunken:rgb(255 255 255 / .08);
  --surface-pressed:rgb(255 255 255 / .12);--surface-tint:rgb(255 255 255 / .06);
  --border-hairline:rgb(255 255 255 / .08);--border-default:rgb(255 255 255 / .12);--border-hover:rgb(255 255 255 / .28);
  --nav-bg:#0f0f0f;--nav-fg:#ededed;--nav-fg-muted:#8f8f8f;--nav-item-hover-bg:rgb(255 255 255 / .05);--nav-item-active-bg:rgb(255 255 255 / .09);--nav-border:rgb(255 255 255 / .08);
  --nav-brand-bg:#ededed;--nav-brand-fg:#000;
  --tone-neutral-bg:#262626;--tone-neutral-fg:#d4d4d4;--tone-info-bg:#12233d;--tone-info-fg:#9ec5ff;
  --tone-warning-bg:#33260c;--tone-warning-fg:#f5c869;--tone-success-bg:#0f2e1c;--tone-success-fg:#7fdca0;
  --tone-danger-bg:#3a1616;--tone-danger-fg:#ff9b94;--tone-action-bg:#262626;--tone-action-fg:#ededed;
  --selection:#4d8bff;--selection-bg:rgb(77 139 255 / .12);
  --primary-bg:#ededed;--primary-fg:#000;--primary-hover:#d4d4d4;--control-hover:rgb(255 255 255 / .05);
  --shadow-card:0 0 0 1px rgb(255 255 255 / .02);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --text-primary:#ededed;--text-secondary:#a8a8a8;--text-tertiary:#8f8f8f;--text-muted:#5e5e5e;
  --surface-app:#0a0a0a;--surface-page:#0f0f0f;--surface-raised:#161616;--surface-soft:rgb(255 255 255 / .05);--surface-sunken:rgb(255 255 255 / .08);
  --surface-pressed:rgb(255 255 255 / .12);--surface-tint:rgb(255 255 255 / .06);
  --border-hairline:rgb(255 255 255 / .08);--border-default:rgb(255 255 255 / .12);--border-hover:rgb(255 255 255 / .28);
  --nav-bg:#0f0f0f;--nav-fg:#ededed;--nav-fg-muted:#8f8f8f;--nav-item-hover-bg:rgb(255 255 255 / .05);--nav-item-active-bg:rgb(255 255 255 / .09);--nav-border:rgb(255 255 255 / .08);
  --nav-brand-bg:#ededed;--nav-brand-fg:#000;
  --tone-neutral-bg:#262626;--tone-neutral-fg:#d4d4d4;--tone-info-bg:#12233d;--tone-info-fg:#9ec5ff;
  --tone-warning-bg:#33260c;--tone-warning-fg:#f5c869;--tone-success-bg:#0f2e1c;--tone-success-fg:#7fdca0;
  --tone-danger-bg:#3a1616;--tone-danger-fg:#ff9b94;--tone-action-bg:#262626;--tone-action-fg:#ededed;
  --selection:#4d8bff;--selection-bg:rgb(77 139 255 / .12);
  --primary-bg:#ededed;--primary-fg:#000;--primary-hover:#d4d4d4;--control-hover:rgb(255 255 255 / .05);
  --shadow-card:0 0 0 1px rgb(255 255 255 / .02);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface-app);color:var(--text-primary);font-family:var(--font);font-weight:500;font-size:16px;line-height:24px;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;letter-spacing:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--selection);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Coquille */
.shell{display:flex;min-height:100%}
.side{position:sticky;top:0;height:100dvh;width:218px;flex-shrink:0;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:8px;background:var(--nav-bg);border-right:1px solid var(--nav-border);overflow-y:auto}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0}
.brand{width:60px;height:60px;border-radius:16px;background:var(--nav-brand-bg);color:var(--nav-brand-fg);display:grid;place-items:center;font-weight:700;font-size:18px;letter-spacing:-.02em}
.iconbtn{width:40px;height:40px;border-radius:10px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--nav-fg)}
.nav{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;color:var(--nav-fg);text-decoration:none}
.nav a[aria-current="page"]{background:var(--nav-item-active-bg)}
.nav a[aria-disabled="true"]{cursor:default}
.nav .count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--primary-bg);color:var(--primary-fg);font-size:13px;line-height:20px;text-align:center;font-weight:600}
.side-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--nav-border);padding-top:8px}
.me{display:flex;align-items:center;gap:8px;padding:6px 8px;flex:1;min-width:0}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.av{width:28px;height:28px;border-radius:50%;background:var(--surface-sunken);color:var(--text-primary);display:inline-grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:0;flex-shrink:0}
.main{flex:1;min-width:0;background:var(--surface-page)}
.topbar{display:none}.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:13px;line-height:18px;font-weight:600;white-space:nowrap}
.badge.sm{height:20px;padding:0 8px}
.t-info{background:var(--tone-info-bg);color:var(--tone-info-fg)}.t-neutral{background:var(--tone-neutral-bg);color:var(--tone-neutral-fg)}
.t-warn{background:var(--tone-warning-bg);color:var(--tone-warning-fg)}.t-danger{background:var(--tone-danger-bg);color:var(--tone-danger-fg)}
.t-ok{background:var(--tone-success-bg);color:var(--tone-success-fg)}.t-act{background:var(--tone-action-bg);color:var(--tone-action-fg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:var(--primary-bg);color:var(--primary-fg);cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap;transition:transform 140ms var(--ease),background-color 150ms ease}
.btn:active{transform:scale(.97)}
.btn.outline{background:var(--surface-page);color:var(--text-primary);border-color:var(--border-default)}
.btn.ghost{background:none;color:var(--text-primary)}
.btn.sm{height:32px;padding:0 14px;font-size:14px}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--text-primary);text-decoration:underline;text-decoration-color:var(--border-hover);text-underline-offset:3px;font-size:14px}/* Briques communes des pages (app du 29/10/2026) */
.btn.lg{height:44px;padding:0 18px}
.btn.icon{width:40px;padding:0}
.btn:disabled{opacity:.5;cursor:default}
.page{max-width:1180px;margin:0 auto;padding-block:32px 160px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text-secondary);text-decoration:none;width:fit-content;cursor:pointer;background:none;border:0;padding:0}
.ph{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px}
.ph h1{font-size:36px;line-height:42px;letter-spacing:-.04em;font-weight:500;display:flex;align-items:center;gap:12px;flex-wrap:wrap;text-wrap:balance}
.ph .desc{font-size:16px;line-height:24px;color:var(--text-secondary);margin-top:4px;max-width:80ch}
.ph .acts{display:flex;flex-wrap:wrap;gap:8px}
.ph .who{display:flex;align-items:center;gap:16px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface-sunken);display:inline-grid;place-items:center;font-size:13px;font-weight:600;flex-shrink:0;color:var(--text-primary)}
.avatar.lg{width:72px;height:72px;font-size:22px}
.avatar.sq{border-radius:10px}
.factline{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;font-size:15px;line-height:22px;color:var(--text-secondary)}
.factline b{color:var(--text-primary);font-weight:600}
.factline .red{color:var(--tone-danger-fg);font-weight:600}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-hairline);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-size:15px;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{color:var(--text-primary);border-color:var(--text-primary)}
.tabs .n{color:var(--text-tertiary);margin-left:4px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;gap:4px}
.seg button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border-default);background:none;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--primary-bg);color:var(--primary-fg);border-color:transparent}

/* Ligne de recherche et de filtres (ListToolbar) */
.toolbar{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(var(--nf,2),minmax(0,1fr));gap:8px}
.search{display:flex;align-items:center;gap:8px;height:40px;border-radius:10px;border:1px solid var(--border-default);background:var(--surface-page);padding:0 12px;color:var(--text-tertiary)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:15px;color:var(--text-primary)}
.toolbar select{height:40px;border-radius:10px;border:1px solid var(--border-default);background:var(--surface-page);padding:0 10px;font-size:15px;min-width:0}

/* DataTable : une carte (contour, en-tête sur bande douce, filet entre les lignes) */
.tbl{border:1px solid var(--border-default);border-radius:12px;overflow:hidden;background:var(--surface-raised)}
.tbl .tw{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:16px;line-height:24px}
.tbl th{text-align:left;font-weight:500;color:var(--text-secondary);height:44px;padding:0 20px 0 0;background:var(--surface-soft);border-bottom:1px solid var(--border-default);white-space:nowrap}
.tbl td{padding:12px 20px 12px 0;vertical-align:middle}
.tbl th:first-child,.tbl td:first-child{padding-left:16px}
.tbl th:last-child,.tbl td:last-child{padding-right:16px}
.tbl tbody tr+tr td{border-top:1px solid var(--border-hairline)}
.tbl tr.go{cursor:pointer}
.tbl .sub{display:block;font-size:14px;line-height:20px;color:var(--text-secondary)}
.tbl .mut{color:var(--text-secondary)}
.tbl .name{font-weight:600}
.tbl .r{text-align:right}
.cellrow{display:flex;align-items:center;gap:12px;min-width:0}
.empty{padding:32px 16px;text-align:center;color:var(--text-secondary);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty b{color:var(--text-primary);font-weight:600}

/* Blocs « Maintenant » et listes de l'accueil */
.now{display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:16px;border:1px solid var(--border-default);background:var(--surface-raised);box-shadow:var(--shadow-card)}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;line-height:20px;color:var(--text-secondary)}
.now h2{font-size:20px;line-height:28px;letter-spacing:-.04em;font-weight:500;text-wrap:balance}
.why{font-size:15px;line-height:22px;color:var(--text-secondary);text-wrap:pretty;max-width:76ch}
.facts{display:flex;flex-wrap:wrap;gap:4px 24px;margin:0;font-size:15px;line-height:22px;color:var(--text-secondary)}
.facts div{display:flex;gap:6px}.facts dd{margin:0;color:var(--text-primary);font-weight:600}
.acts-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--tone-success-bg);color:var(--tone-success-fg);font-size:15px;line-height:22px}
.banner.info{background:var(--tone-info-bg);color:var(--tone-info-fg)}
.callout{padding:12px 14px;border-radius:12px;font-size:15px;line-height:22px}
.callout.warn{background:var(--tone-warning-bg);color:var(--tone-warning-fg)}
.callout.bad{background:var(--tone-danger-bg);color:var(--tone-danger-fg)}
.callout.soft{background:var(--surface-soft);color:var(--text-secondary)}
.callout b{font-weight:600}

.hs{display:flex;flex-direction:column;gap:8px}
.hs-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px}
.hs-head h2{font-size:14px;line-height:20px;font-weight:600;color:var(--text-secondary);letter-spacing:-.01em}
.hs-head .n{color:var(--text-tertiary);font-weight:500;margin-left:6px}
.hl{list-style:none;margin:0;padding:0;border:1px solid var(--border-default);border-radius:12px;overflow:hidden;background:var(--surface-raised)}
.hl>li+li{border-top:1px solid var(--border-hairline)}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;background:none;border:0;cursor:pointer}
.hrow.static{cursor:default}
.hrow .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hrow .t{font-size:16px;line-height:24px;overflow-wrap:anywhere}
.hrow .t b{font-weight:600}
.hrow .c{font-size:14px;line-height:20px;color:var(--text-secondary);overflow-wrap:anywhere}
.hrow .rside{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;flex-shrink:0}
.hnote{padding:10px 16px;font-size:14px;color:var(--text-secondary)}
.chev{color:var(--text-tertiary);flex-shrink:0}

/* Cartes de section (rien d'encadré dedans) */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:24px;align-items:start}
.colstack{display:flex;flex-direction:column;gap:24px;min-width:0}
.sc{display:flex;flex-direction:column;gap:16px;padding:20px 24px;border-radius:16px;border:1px solid var(--border-hairline);background:var(--surface-raised);min-width:0}
.sc-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.sc-head h2{font-size:20px;line-height:28px;letter-spacing:-.04em;font-weight:500;display:flex;gap:8px;align-items:center}
.sc-head h2 .n{font-size:15px;color:var(--text-tertiary);font-weight:500;letter-spacing:0}
.sc-head p{font-size:15px;line-height:22px;color:var(--text-secondary);max-width:80ch}
.sc dl.fl{margin:0;display:flex;flex-direction:column;gap:12px}
.sc dl.fl dt{font-size:14px;line-height:20px;color:var(--text-secondary)}
.sc dl.fl dd{margin:0;font-size:16px;line-height:24px;overflow-wrap:anywhere}
.sc dl.fl dd.mut{color:var(--text-tertiary)}
.sc dl.fl dd .src{display:block;font-size:13px;line-height:18px;color:var(--text-tertiary)}
.rows{list-style:none;margin:0;padding:0}
.rows>li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border-hairline)}
.rows>li:first-child{border-top:0;padding-top:0}
.rows .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rows .t{font-size:16px;line-height:24px}
.rows .t b{font-weight:600}
.rows .c{font-size:14px;line-height:20px;color:var(--text-secondary)}
.rows a,.lnk{color:var(--text-primary);text-decoration:underline;text-decoration-color:var(--border-hover);text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0;font-size:inherit}
.src{font-size:13px;line-height:18px;color:var(--text-tertiary)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px}
details.fold summary{cursor:pointer;font-size:15px;color:var(--text-secondary);list-style:none}
details.fold summary::before{content:"▸ ";color:var(--text-tertiary)}
details.fold[open] summary::before{content:"▾ "}

/* Document en tête (VISION-UX règle 18) */
.doc{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;border:1px solid var(--border-default);background:var(--surface-soft)}
.doc .ic{width:40px;height:48px;border-radius:6px;background:var(--surface-raised);border:1px solid var(--border-default);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--text-secondary)}
.doc .grow{flex:1;min-width:0}
.doc b{font-weight:600}
.vals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vals li{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--border-hairline);font-size:15px}
.vals li:first-child{border-top:0}
.vals .k{color:var(--text-secondary)}
.vals .src{display:block}

/* Calendrier */
.cal{border:1px solid var(--border-default);border-radius:12px;overflow:hidden;background:var(--surface-raised)}
.cal-head{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--border-default);background:var(--surface-soft)}
.cal-head div{padding:8px 4px;text-align:center;font-size:13px;color:var(--text-secondary)}
.cal-head b{display:block;font-size:16px;color:var(--text-primary);font-weight:600}
.cal-head .today b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--primary-bg);color:var(--primary-fg)}
.cal-body{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));position:relative;height:520px;overflow-y:auto}
.cal-hours div{height:48px;font-size:12px;color:var(--text-tertiary);text-align:right;padding-right:6px;transform:translateY(-7px)}
.cal-day{position:relative;border-left:1px solid var(--border-hairline);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--border-hairline) 47px,var(--border-hairline) 48px)}
.ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:4px 6px;font-size:12px;line-height:16px;overflow:hidden;cursor:pointer;border:0;text-align:left}
.ev b{display:block;font-weight:600;font-size:12.5px}
.ev.t-info{background:var(--tone-info-bg);color:var(--tone-info-fg)}
.ev.t-ok{background:var(--tone-success-bg);color:var(--tone-success-fg)}
.ev.t-neutral{background:var(--tone-neutral-bg);color:var(--tone-neutral-fg)}
.ev.t-warn{background:var(--tone-warning-bg);color:var(--tone-warning-fg)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--selection)}

/* Transcription, propositions */
.quote{font-size:15px;line-height:22px;color:var(--text-secondary);border-left:2px solid var(--border-default);padding-left:10px}
.prop{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--border-hairline)}
.prop:first-child{border-top:0;padding-top:0}
.prop .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.prop .t{font-size:16px;line-height:24px}

/* Modale « verre » et champs */
.scrim{position:fixed;inset:0;z-index:70;background:rgb(0 0 0 / .35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}

.dialog h2{font-size:20px;line-height:28px;letter-spacing:-.04em;font-weight:500}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:14px;font-weight:600}
.field .hint{font-size:14px;line-height:20px;color:var(--text-secondary)}
.field input,.field select,.field textarea{min-height:40px;border-radius:10px;border:1px solid var(--border-default);background:var(--surface-page);padding:8px 12px;font-size:16px;min-width:0;width:100%}
.field textarea{min-height:96px;resize:vertical;line-height:22px}
.field [aria-invalid="true"]{border-color:var(--tone-danger-fg)}
.err{color:var(--tone-danger-fg);font-size:14px;line-height:20px}
.dfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.mail{border:1px solid var(--border-default);border-radius:12px;overflow:hidden}
.mail .mh{padding:10px 12px;background:var(--surface-soft);font-size:14px;line-height:22px;color:var(--text-secondary)}
.mail .mh b{color:var(--text-primary);font-weight:600}
.mail .mlink{padding:10px 12px;border-top:1px solid var(--border-hairline);font-size:14px;color:var(--text-secondary)}
.mail .mlink code{color:var(--text-primary)}
.choice{display:flex;flex-direction:column;gap:8px}
.choice label{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--border-default);cursor:pointer;font-weight:500}
.choice label:has(input:checked){border-color:var(--selection);background:var(--selection-bg)}
.choice small{display:block;color:var(--text-secondary);font-size:14px;font-weight:500}
.player{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface-soft)}
.player .bar{flex:1;height:4px;border-radius:999px;background:var(--surface-sunken)}
.preview{display:grid;place-items:center;height:160px;border-radius:12px;background:var(--surface-soft);color:var(--text-tertiary);font-size:14px}
.preview.cover{background:linear-gradient(135deg,var(--tone-info-bg),var(--tone-warning-bg))}

@media (hover:hover) and (pointer:fine){
  .nav a:not([aria-current="page"]):not([aria-disabled="true"]):hover,.iconbtn:hover{background:var(--nav-item-hover-bg)}
  .btn:hover{background:var(--primary-hover)}
  .btn.outline:hover,.btn.ghost:hover{background:var(--control-hover);border-color:var(--border-hover)}
  .tbl tr.go:hover td,.hrow:not(.static):hover{background:var(--control-hover)}
  .tabs button:hover{color:var(--text-primary)}
}
@media (max-width:860px){
  .side{display:none}
  .side.open{display:flex;position:fixed;inset:0 auto 0 0;z-index:40;box-shadow:0 10px 40px rgb(0 0 0 / .3)}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--nav-border);background:var(--nav-bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}

  .ph h1{font-size:28px;line-height:34px}

  return `<div class="tbl"><div class="tw"><table><thead><tr>${heads.map(h=>`<th class="${h.cls||""}">${esc(h.t??h)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>${rows.length?"":`<div class="empty">${empty}</div>`}</div>`;
}
function hsection(title,count,rows,action){
  return `<section class="hs" aria-label="${esc(title)}"><div class="hs-head"><h2>${esc(title)}${count?`<span class="n">${count}</span>`:""}</h2>${action||""}</div><ul class="hl">${rows.join("")}</ul></section>`;
}
const hrow=({act,attrs="",lead="",t,c,side="",chev=true})=>`<li><${act?"button":"div"} class="hrow ${act?"":"static"}" ${act?`type="button" data-act="${act}" ${attrs}`:""}>${lead}<span class="grow"><span class="t">${t}</span>${c?`<span class="c">${c}</span>`:""}</span><span class="rside">${side}${act&&chev?I.chev:""}</span></${act?"button":"div"}></li>`;
function nowCard({label="Maintenant",tone="t-info",badgeText="À vous",extra="",eyebrow,title,why,facts=[],actions="",flash}){

/* What was typed in a dialog stays when it is redrawn (a refused field, a
   switch of type). */
function keepTyped(fn){
  const typed=[...document.querySelectorAll(".dialog input,.dialog select,.dialog textarea")].map(e=>[e.id,e.type==="checkbox"||e.type==="radio"?e.checked:e.multiple?[...e.selectedOptions].map(o=>o.value):e.value]);
  fn();render();
  if(S.modal)typed.forEach(([id,v])=>{const e=id&&document.getElementById(id);if(!e)return;if(e.type==="checkbox"||e.type==="radio")return;if(e.multiple)[...e.options].forEach(o=>o.selected=v.includes(o.value));else e.value=v;});
}
ACTS.save=()=>{
  keepTyped(()=>{S.err={};MODALS[S.modal].save(S.ctx);});
  const e=document.querySelector('.dialog [aria-invalid="true"]');if(e)e.focus();
};
ACTS.open=el=>open(el.dataset.m,{...el.dataset});
ACTS.noop=()=>{};
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act]");if(!t)return;
  if(t.tagName==="A")ev.preventDefault();
  const h=ACTS[t.dataset.act];if(h)h(t,ev);
});
document.addEventListener("input",ev=>{
  const s=ev.target.closest("[data-search]");if(!s)return;
  ui(s.dataset.search+":q",s.value);const pos=s.selectionStart;render();
  const again=document.querySelector(`[data-search="${s.dataset.search}"]`);if(again){again.focus();again.setSelectionRange(pos,pos);}
});
document.addEventListener("change",ev=>{
  const f=ev.target.closest("[data-filter]");if(f){ui(f.dataset.filter,f.value);render();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.modal){closeModal();render();}});

/* Every awaited move of a contact: its private link, or a contract it has to sign. */
function allWaits(){
  const fromContracts=(S.contracts||[]).filter(k=>k.state==="sent").flatMap(k=>k.parties.filter(p=>p.signs).map(p=>({id:"w-"+k.id+"-"+p.who,who:p.who,todo:`Signer et renvoyer le ${lowerFirst(k.kindLabel)}`,project:k.project,place:"Contrats",link:k.link,sentOn:k.sentOn,sentBy:k.sentBy,openedOn:k.openedOn,due:k.due,relances:k.relances||[],contract:k.id})));
  return [...S.waits,...fromContracts].sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
}
function waitLine(w,withName=true){
  const c=contact(w.who),p=PROJECTS[w.project];
  const late=w.due&&daysFrom(w.due)<0;
  const last=w.relances[w.relances.length-1];
  return {
    t:`${withName?`En attente de <b>${esc(c.name)}</b> (lien privé) : `:""}${esc(withName?lowerFirst(w.todo):w.todo)}`,
    c:[`${esc(p.title)} · ${esc(w.place)}`,`envoyé le ${ddmm(w.sentOn)}${w.openedOn?`, ouvert le ${ddmm(w.openedOn)}`:", pas encore ouvert"}`,last?`relancé le ${ddmm(last.on)}`:null,w.due?`${late?"attendu le":"pour le"} ${fmtDay(w.due)}`:null].filter(Boolean).join(" · "),
    late
  };
}
function waitRow(w,withName=true){
  const l=waitLine(w,withName);
  return hrow({lead:withName?avatar(contact(w.who).name):"",t:l.t,c:l.c,
    side:`${l.late?badge("t-danger","En retard"):""}<button class="btn outline sm" type="button" data-act="open" data-m="relance" data-w="${w.id}">Relancer</button>${withName?`<button class="btn ghost sm" type="button" data-act="go" data-p="contact" data-id="${w.who}">Voir</button>`:""}`});
}

const isOwner=k=>k.owner===me().name;
/* What a contract asks of the person looking (computed from its state). */
function contractTodo(k){
  if(k.state==="in_review"&&isDir())return {title:"Valider le contrat",validate:true};
  if(k.state==="returned"&&isDir())return {title:"Signer le contrat pour PDS"};
  if(k.state==="draft"&&isOwner(k))return {title:k.review&&k.review.comment?"Reprendre le contrat et le soumettre à nouveau":"Soumettre à la direction"};
  if(k.state==="approved"&&isOwner(k))return {title:"Envoyer le contrat pour signature"};
  return null;
}
/* Who it waits for otherwise. */
function contractWait(k){
  if(k.state==="in_review"&&!isDir())return {who:"Claire Morel",todo:"valider le contrat"};
  if(k.state==="returned"&&!isDir())return {who:"Claire Morel",todo:"signer le contrat pour PDS"};
  if((k.state==="draft"||k.state==="approved")&&!isOwner(k))return {who:k.owner,todo:k.state==="draft"?"soumettre le contrat à la direction":"envoyer le contrat pour signature"};
  if(k.state==="sent"){const c=signer(k);return {who:c.name,link:true,todo:"signer et renvoyer le contrat",contact:c.id};}
  return null;
}

      facts:[k.state==="approved"?["Envoyé à",`${esc(signer(k).name)} · ${esc(signer(k).email||"adresse manquante")}`]:null,k.state==="in_review"?["Ensuite","Envoi pour signature par "+esc(k.owner)]:null,k.state==="draft"?["Validation","Claire Morel"]:null].filter(Boolean),
      actions,flash});
  } else if(wait){
    now=nowCard({tone:"t-neutral",badgeText:"Rien à faire pour vous",eyebrow:esc(k.title),title:`En attente de ${esc(wait.who)}${wait.link?" (lien privé)":""} : ${esc(wait.todo)}`,why:esc(C_STEP[k.state]),
      facts:k.state==="sent"?[["Envoyé le",`${fmtDay(k.sentOn)} par ${esc(k.sentBy)}`],["Ouvert",k.openedOn?fmtDay(k.openedOn):"pas encore"],k.relances.length?["Relancé le",fmtDay(k.relances[k.relances.length-1].on)]:null].filter(Boolean):[],
      actions:k.state==="sent"?`${isOwner(k)?btn("Relancer","open",`data-m="relance" data-w="w-${k.id}-${wait.contact}"`,"outline"):""}${btn("Copier le lien","copyLink","","ghost")}<button class="btn" type="button" data-act="returnSigned" data-id="${k.id}" style="background:var(--glass);color:var(--glass-fg)">Proto : faire revenir le contrat signé</button>`:"",flash});
  } else now=nowCard({tone:k.state==="signed"?"t-ok":"t-neutral",badgeText:C_STATES[k.state][0],eyebrow:esc(k.title),title:k.state==="signed"?`Signé le ${fmtDay(k.signedOn)}`:"Résilié",why:esc(C_STEP[k.state]),flash});
  const review=k.review&&k.review.comment&&k.state==="draft"?`<div class="callout bad"><b>Modifications demandées</b> par ${esc(k.review.by)} le ${fmtDay(k.review.on)} : « ${esc(k.review.comment)} »</div>`:"";
  const doc=k.doc?card("Document",`Généré depuis le modèle « ${esc(k.doc.template)} » v${k.doc.tv}. Le modèle n'est pas modifié.`,"",
    `<div class="doc"><span class="ic">PDF</span><span class="grow"><b>${esc(k.kindLabel)} · v${k.doc.version}</b><br><span class="src">${k.state==="returned"||k.state==="signed"?`Signé par ${esc(signer(k)?signer(k).name:"")}, reçu par son lien privé`:"Projet de contrat"}</span></span>${btn("Voir le PDF","noop","","outline sm")}${editable?btn("Modifier une clause","open",`data-m="clause" data-id="${k.id}"`,"ghost sm"):""}</div>
    ${k.doc.changed?`<p class="why">Changé depuis la v${k.doc.version-1} : ${esc(k.doc.changed)}</p>`:""}
    <ul class="vals">${k.doc.values.map(([l,v,s])=>`<li><span class="k">${esc(l)}</span><span>${v==="—"?`<span class="mut">à décider</span>`:esc(v)}<span class="src">${esc(s)}</span></span></li>`).join("")}</ul>`)
    :card("Fichiers","Projets de contrat, exemplaire signé et sa preuve, annexes.","",`<ul class="rows">${(k.files||[]).map(f=>`<li><span class="avatar sq" aria-hidden="true">${I.doc}</span><span class="grow"><span class="t">${esc(f)}</span></span>${btn("Ouvrir","noop","","ghost sm")}</li>`).join("")}</ul>`);
  const parties=card("Parties","Les personnes et structures du Réseau engagées par le contrat.",editable?btn(`${I.plus} Ajouter une partie`,"noop","","outline sm"):"",
    `<ul class="rows">${k.parties.map(p=>{const c=contact(p.who);return `<li>${avatar(c.name)}<span class="grow"><span class="t"><button class="lnk" type="button" data-act="go" data-p="contact" data-id="${c.id}">${esc(c.name)}</button></span><span class="c">${esc(p.role)}${p.signs?" · signe":""}${c.email?` · ${esc(c.email)}`:""}</span></span></li>`;}).join("")}</ul>`);
  const journal=card("Déjà fait","","",`<details class="fold" ${k.journal.length<4?"open":""}><summary>Versions et journal (${k.journal.length})</summary><ul class="rows" style="margin-top:8px">${k.journal.slice().reverse().map(j=>`<li><span class="grow"><span class="t">${esc(j.t)}</span><span class="c">${esc(j.by)} · ${fmtDay(j.on)}</span></span></li>`).join("")}</ul></details>`);
  return `${pageHead({back:["contracts","Tous les contrats"],title:`${esc(k.title)} ${contractBadge(k)}`,desc:`${esc(k.type)} · ${esc(partiesText(k))}`,actions:`${editable?btn("Modifier","noop","","outline lg"):""}${btn(I.dots,"noop",'aria-label="Plus d\'actions"',"outline icon lg")}`})}
  ${k.origin?`<div class="banner info">${esc(k.origin)} <button class="lnk" type="button" data-act="noop">Revenir au Suivi</button></div>`:""}
  ${review}${now}
  <div class="cols"><div class="colstack">${doc}${parties}${journal}</div>
  <div class="colstack">${card("Informations","","",factList([["Type",esc(k.type)],["Responsable",esc(k.owner)],["Projet",k.project&&esc(PROJECTS[k.project].title)],["Artiste",k.artist&&esc(k.artist)],["Échéance",k.due&&fmtDay(k.due)],["Période",k.start&&`du ${fmtShort(k.start)} au ${fmtShort(k.end)}`],["Signé le",k.signedOn&&fmtDay(k.signedOn)]]))}</div></div>`;
}};

const call=id=>S.calls.find(c=>c.id===id);
const mins=h=>{const [a,b]=h.split(":").map(Number);return a*60+b;};
const isPast=c=>c.day<TODAY||(c.day===TODAY&&mins(c.end)<=NOW_MIN);
const callBadge=c=>{const k=c.status==="upcoming"&&isPast(c)?"draft":c.status;return badge(CALL_ST[k][1],CALL_ST[k][0]);};
const callWhere=c=>c.project?PROJECTS[c.project].title:"Réunion interne";
const when=c=>`${fmtDay(c.day)}, ${c.start} – ${c.end}`;
const tasksLeft=c=>(c.actions||[]).filter(a=>!a.task).length;
const MODULE_OF={Cadrage:"le Cadrage","Stratégie":"la Stratégie",Conception:"la Conception",Production:"la Production",Master:"le Master"};
const TODO_RANK={record:0,upload:1,props:2,tasks:3,summary:4,close:5};
/* What a call asks of its owner, in order (lib/calls: record, process, tasks, proposals, summary, close). */
function callTodos(c){
  if(c.owner!==me().name)return [];
  const out=[];
  if(c.status==="upcoming"&&c.day===TODAY)out.push({t:`Enregistrer l'${lowerFirst(c.title)}`,why:`Aujourd'hui à ${c.start} : ouvrez le call au moment de l'échange, PDS OS enregistre la visio et votre micro.`,act:"record"});
  if((c.status==="draft"||(c.status==="upcoming"&&isPast(c))))out.push({t:"Déposer l'enregistrement",why:`Le call du ${fmtDay(c.day)} n'a pas été enregistré dans PDS OS : déposez le fichier audio pour avoir sa transcription et son compte rendu.`,act:"upload"});
  if(c.status==="ready"){
    if(c.pending)out.push({t:`Trancher ${c.pending} proposition${c.pending>1?"s":""} dans ${MODULE_OF[c.module]}`,why:"PO a rangé ce qui a été dit là où ça sert, chaque phrase avec sa citation : confirmez, modifiez ou écartez.",act:"props"});
    if(tasksLeft(c))out.push({t:`Créer ${tasksLeft(c)>1?"les "+tasksLeft(c)+" tâches":"la tâche"} des actions décidées`,why:"Chaque action relevée devient une tâche avec un responsable et une échéance, choisis par vous.",act:"tasks"});
    if(!c.summarySent)out.push({t:"Envoyer le résumé aux participants",why:"PO a préparé le résumé ; relisez-le avant qu'il parte.",act:"summary"});
    if(!c.pending&&!tasksLeft(c)&&c.summarySent)out.push({t:"Clôturer le call",why:"Tout ce qui est sorti de l'échange a sa place : la clôture fige le compte rendu.",act:"close"});
  }
  return out;
}

PAGES.calls={nav:"calls",render(){
  const mode=ui("callMode")||"cal";
  const head=pageHead({title:"Calls",desc:"Tous les échanges enregistrés ou planifiés, sur l'ensemble de vos projets.",actions:`<div class="seg" role="group" aria-label="Affichage">${[["cal","Calendrier"],["list","Liste"]].map(([k,l])=>`<button type="button" data-act="ui" data-k="callMode" data-v="${k}" aria-pressed="${mode===k}">${l}</button>`).join("")}</div>${btn(`${I.plus} Nouvelle réunion`,"open",'data-m="newMeeting"',"lg")}`});
  return `${head}${mode==="cal"?calendar():callList()}`;
}};
function calendar(){
  const days=["2026-10-26","2026-10-27","2026-10-28","2026-10-29","2026-10-30","2026-10-31","2026-11-01"];
  const H0=8,PX=48;
  const ev=c=>{const top=(mins(c.start)-H0*60)/60*PX,h=Math.max(28,(mins(c.end)-mins(c.start))/60*PX);
    const k=c.status==="upcoming"&&isPast(c)?"draft":c.status;const tone=k==="ready"?"t-ok":k==="upcoming"?"t-info":k==="draft"?"t-warn":"t-neutral";
    return `<button class="ev ${tone}" type="button" data-act="go" data-p="call" data-id="${c.id}" style="top:${top}px;height:${h}px"><b>${esc(c.title)}</b>${esc(callWhere(c))} · ${c.start}</button>`;};
  return `<div class="acts-row"><button class="btn outline sm" type="button">Aujourd'hui</button><span style="font-weight:600;font-size:18px">26 octobre – 1 novembre 2026</span><span class="src" style="margin-left:auto">${badge("t-ok","Compte rendu prêt")} ${badge("t-info","À venir")} ${badge("t-warn","À enregistrer")}</span></div>
  <div class="cal"><div class="cal-head"><div></div>${days.map(d=>{const x=dOf(d);return `<div class="${d===TODAY?"today":""}">${DAYS[x.getDay()].replace(".","").toLowerCase()}.<b>${x.getDate()}</b></div>`;}).join("")}</div>
  <div class="cal-body"><div class="cal-hours">${Array.from({length:16},(_,i)=>`<div>${pad(H0+i)}:00</div>`).join("")}</div>
  ${days.map(d=>`<div class="cal-day" style="height:${16*PX}px">${d===TODAY?`<span class="nowline" style="top:${(NOW_MIN-H0*60)/60*PX}px"></span>`:""}${S.calls.filter(c=>c.day===d).map(ev).join("")}</div>`).join("")}</div></div>
  <p class="src">Cliquez ou glissez sur une plage libre pour créer une réunion. Glissez un de vos calls pour le déplacer, son bord bas pour le rallonger.</p>`;
}
function callList(){
  const q="cll",tab=ui("cllTab")||"all";
  const up=c=>c.status==="upcoming"&&!isPast(c);
  const list=S.calls.filter(c=>tab==="all"||(tab==="up"?up(c):!up(c))).filter(c=>(!filterVal(q,"proj")||callWhere(c)===filterVal(q,"proj"))&&matchQ(q,c.title+" "+callWhere(c))).sort((a,b)=>(b.day+b.start).localeCompare(a.day+a.start));
  return `<div class="colstack" style="gap:12px">${tabs("cllTab",[["all","Tous",S.calls.length],["up","À venir",S.calls.filter(up).length],["past","Passés",S.calls.filter(c=>!up(c)).length]])}
  ${toolbar(q,"Titre, projet…",[{k:"proj",label:"Projet",all:"Tous les projets",options:[...new Set(S.calls.map(callWhere))]}])}
  ${table([{t:"Call"},{t:"Date",cls:"hide-m"},{t:"Traitement"}],list.map(c=>`<tr class="go" data-act="go" data-p="call" data-id="${c.id}"><td><span class="cellrow"><span class="avatar" aria-hidden="true">${I.phone.replace(/20/g,"16")}</span><span><span class="name">${esc(c.title)}</span><span class="sub">${esc(callWhere(c))}</span></span></span></td><td class="hide-m">${fmtShort(c.day)}, ${c.start} – ${c.end}</td><td>${callBadge(c)}${up(c)&&c.meet?` <span class="src">Rejoindre</span>`:""}</td></tr>`),`<b>Aucun call ne correspond à ces filtres.</b>`)}</div>`;
}

PAGES.call={nav:"calls",render(){
  const c=call(S.id),todos=callTodos(c),owner=c.owner===me().name;
  const [t]=todos;
  const people=[...c.team.map(n=>[n,"Équipe PDS"]),...c.people.map(id=>[contact(id).name,"Réseau"]),...c.guests.map(n=>[n,"Invité par e-mail"])];
  let now="";
  if(t){
    const a={record:`${btn("Commencer l'enregistrement","recordCall",`data-id="${c.id}"`)}${c.meet?btn("Rejoindre","noop","","outline"):""}`,upload:btn("Déposer l'enregistrement","recordCall",`data-id="${c.id}"`),
      props:`${btn(`Ouvrir ${MODULE_OF[c.module]}`,"noop")}<button class="btn" type="button" data-act="propsDone" data-id="${c.id}" style="background:var(--glass);color:var(--glass-fg)">Proto : propositions tranchées</button>`,tasks:btn("Créer les tâches","scrollTo",'data-to="actions"'),summary:btn("Relire et envoyer","open",`data-m="summary" data-id="${c.id}"`),close:btn("Clôturer le call","closeCall",`data-id="${c.id}"`)}[t.act];
    now=nowCard({eyebrow:`${esc(c.title)} · ${esc(callWhere(c))}`,title:esc(t.t),why:esc(t.why),facts:todos.length>1?[["Ensuite",esc(todos.slice(1).map(x=>lowerFirst(x.t)).join(" · "))]]:[],actions:a,flash:S.flash});
  } else if(c.status==="processing")now=nowCard({tone:"t-info",badgeText:"Traitement en cours",eyebrow:esc(c.title),title:"Transcription, puis compte rendu",why:"Enregistrement reçu. PO transcrit l'échange, range ce qui a été dit dans l'ordre du jour, puis pré-remplit l'étape.",actions:`<button class="btn" type="button" data-act="processCall" data-id="${c.id}" style="background:var(--glass);color:var(--glass-fg)">Proto : terminer le traitement</button>`,flash:S.flash});

  const agenda=card("Ordre du jour",`Durée totale estimée : environ ${c.agenda.reduce((n,a)=>n+a[1],0)} min.`,owner&&["upcoming","draft"].includes(c.status)?btn(`${I.plus} Ajouter un point`,"noop","","outline sm"):"",`<ul class="rows">${c.agenda.map(([p,m],i)=>`<li><span class="avatar" style="width:28px;height:28px;font-size:12px">${i+1}</span><span class="grow"><span class="t">${esc(p)}</span></span><span class="src">${m} min</span></li>`).join("")}</ul>`);
  const ready=c.status==="ready"||c.status==="closed";
  const actions=ready&&c.actions?card("Décisions et actions","Ce qui a été décidé, et les actions dites pendant l'échange, chacune avec sa phrase.","",
    `<h3 class="src" style="font-size:14px;font-weight:600">Décisions</h3><ul class="rows">${c.decisions.map(d=>`<li><span class="grow"><span class="t">${esc(d)}</span></span></li>`).join("")}</ul>
    <h3 id="actions" class="src" style="font-size:14px;font-weight:600;margin-top:8px">Actions</h3><ul class="rows">${c.actions.map((a,i)=>`<li><span class="grow"><span class="t"><b>${esc(a.t)}</b></span><span class="c">Pourquoi : ${esc(a.why)}</span>${a.task?`<span class="c">${badge("t-ok","Tâche créée")} ${esc(a.task.who)} · pour le ${fmtDay(a.task.due)}</span>`:""}</span>${!a.task&&owner?btn("Créer la tâche","open",`data-m="task" data-id="${c.id}" data-i="${i}"`,"outline sm"):""}</li>`).join("")}</ul>`):"";
  const report=ready&&c.report?card("Compte rendu","Les phrases sont citées telles quelles. Ce qui fait foi, ce sont les décisions confirmées dans l'étape.","",`<div>${c.report.map(([k,txt,q,st])=>`<div class="prop"><div class="top">${badge(k==="Décision"?"t-ok":k==="Point à arbitrer"?"t-warn":"t-neutral",k)}<span class="src">${esc(st)}</span></div><span class="t">${esc(txt)}</span><span class="quote">${esc(q)}</span></div>`).join("")}</div>`):"";

  return `${pageHead({back:["calls","Tous les calls"],title:`${esc(c.title)} ${callBadge(c)}`,desc:`${esc(callWhere(c))} · ${when(c)} · organisé par ${esc(c.owner)}`,actions:`${c.meet&&!isPast(c)?btn("Rejoindre","noop","","outline lg"):""}${btn(I.dots,"noop",'aria-label="Plus d\'actions"',"outline icon lg")}`})}

      ${card("Titres","Les titres qui le créditent, avec leur état audio.",btn(`${I.plus} Nouveau titre`,"noop","","outline sm"),a.titles.length?`<ul class="rows">${a.titles.map(([t,st,p])=>`<li><span class="grow"><span class="t"><b>${esc(t)}</b></span><span class="c">${p?"Projet "+esc(p):"Aucun projet"}</span></span>${badge(st==="Mix"||st==="Mise à plat"?"t-info":"t-neutral",st)}</li>`).join("")}</ul>`:`<p class="why">Aucun titre ne crédite cet artiste pour l'instant.</p>`,a.titles.length)}
      ${a.bio?card("Biographie","","",`<p class="why">${esc(a.bio)}</p><span class="src">Rédigée par l'équipe</span>`):""}
    </div><div class="colstack">
      ${card("Identité","","",factList([["Nom d'artiste",esc(a.name)],["Relation avec PDS",esc(a.rel)],["Nom civil",a.civil&&esc(a.civil)],["Pays d'origine",esc(a.country)]]))}
      ${card("Contacts","",btn(`${I.plus} Ajouter`,"noop","","ghost sm"),a.contacts.length?`<ul class="rows">${a.contacts.map(([n,r,m,p])=>`<li>${avatar(n)}<span class="grow"><span class="t">${esc(n)} ${p?badge("t-neutral","Principal"):""}</span><span class="c">${esc(r)} · ${esc(m)}</span></span></li>`).join("")}</ul>`:`<p class="why">Aucun contact pour l'instant.</p>`)}
    </div></div>`,
    titles:()=>table([{t:"Titre"},{t:"État audio"},{t:"Projet"}],a.titles.map(([t,st,p])=>`<tr><td class="name">${esc(t)}</td><td>${badge("t-neutral",st)}</td><td>${p?esc(p):`<span class="mut">—</span>`}</td></tr>`),"<b>Aucun titre ne crédite cet artiste pour l'instant.</b>"),
    projects:()=>table([{t:"Projet"},{t:"Où il en est"},{t:"Sortie",cls:"hide-m"}],a.projects.map(([p,kind,place,wait])=>`<tr><td><span class="name">${esc(PROJECTS[p].title)}</span><span class="sub">${esc(kind)}</span></td><td>${esc(place)}<span class="sub">${esc(wait)}</span></td><td class="hide-m">${fmtShort(PROJECTS[p].due)}</td></tr>`),"<b>Aucun projet visible pour cet artiste.</b>"),
    identity:()=>a.identity?`${card(`Identité en vigueur · V${a.identity.current.v}`,`Approuvée par ${esc(a.identity.current.by)} le ${fmtDay(a.identity.current.on)}.`,"",factList([["Manifeste",esc(a.identity.current.manifesto)],["Palette",esc(a.identity.current.palette)]]))}
      ${a.identity.proposal?card(`Proposition V${a.identity.proposal.v}`,`Par ${esc(a.identity.proposal.by)} le ${fmtDay(a.identity.proposal.on)}.`,"",`<p class="why">${esc(a.identity.proposal.what)}</p>${badge(a.identity.proposal.state==="pending"?"t-act":a.identity.proposal.state==="approved"?"t-ok":"t-danger",a.identity.proposal.state==="pending"?"À décider":a.identity.proposal.state==="approved"?"Approuvée":"Refusée")}${a.identity.proposal.why?`<p class="quote">${esc(a.identity.proposal.why)}</p>`:""}`):""}`
      :card("Identité artistique","","",`<p class="why">Aucune identité écrite pour cet artiste.</p>${btn("Écrire l'identité","noop","","outline sm")}`),
    files:()=>table([{t:"Nom"},{t:"Catégorie"},{t:"Ajouté",cls:"hide-m"}],S.files.filter(f=>f.att===a.name).map(f=>`<tr class="go" data-act="open" data-m="file" data-id="${f.id}"><td class="name">${esc(f.name)}</td><td>${badge("t-neutral",f.cat)}</td><td class="hide-m">${fmtShort(f.on)}<span class="sub">${esc(f.by)}</span></td></tr>`),"<b>Aucun fichier pour l'instant.</b>"),
    activity:()=>card("Activité","","",a.activity.length?`<ul class="rows">${a.activity.map(([t,by,on])=>`<li><span class="grow"><span class="t">${esc(t)}</span><span class="c">Par ${esc(by)} · ${fmtDay(on)}</span></span></li>`).join("")}</ul>`:`<p class="why">Aucune activité pour l'instant.</p>`),
    disco:()=>card("Discographie","Lue sur Deezer.","",`<ul class="rows"><li><span class="grow"><span class="t"><b>Néons</b> · Single</span><span class="c">À paraître · Sam. 05/12/2026</span></span>${badge("t-info","Au catalogue")}</li><li><span class="grow"><span class="t"><b>Lumière froide</b> · EP</span><span class="c">2024</span></span></li></ul>`)
  }[sub]();
  return `${pageHead({back:["artists","Tous les artistes"],lead:avatar(a.name,"lg"),title:esc(a.name),desc:`Artiste · ${esc(a.country)}`,actions:`${btn("Modifier","noop","","outline lg")}${btn(`${I.plus} Nouveau titre`,"noop","","outline lg")}${btn(I.dots,"noop",'aria-label="Plus d\'actions"',"outline icon lg")}`})}
  ${now}
  <div class="tabs" role="group" aria-label="Sections de l'artiste">${TABS.map(([k,l])=>`<button type="button" data-act="go" data-p="artist" data-id="${a.id}" data-sub="${k}" aria-pressed="${sub===k}">${l}</button>`).join("")}</div>
  ${body}`;
}};
ACTS.idApprove=el=>{const a=artist(el.dataset.id),p=a.identity.proposal;p.state="approved";a.identity.current={v:p.v,on:TODAY,by:me().name,manifesto:a.identity.current.manifesto,palette:a.identity.current.palette+", orange sodium"};a.activity.unshift([`Identité V${p.v} approuvée`,me().name,TODAY]);did(`Identité V${p.v} approuvée`,`Identité V${p.v} approuvée : elle est en vigueur pour les prochains livrables.`);render();};
ACTS.idRefuseOpen=()=>{S.ctx.refuse=true;render();document.getElementById("id-why").focus();};
ACTS.idCancel=()=>{S.ctx.refuse=false;S.err={};render();};
ACTS.idRefuse=el=>{const why=val("id-why");if(!why){S.err={"id-why":"Dites ce qui ne va pas : le motif est obligatoire."};render();document.getElementById("id-why").focus();return;}
  const a=artist(el.dataset.id);a.identity.proposal.state="refused";a.identity.proposal.why=why;a.activity.unshift([`Proposition d'identité V${a.identity.proposal.v} refusée`,me().name,TODAY]);S.ctx={};did("Proposition refusée",`Proposition refusée. En attente de ${a.identity.proposal.by} : une nouvelle version.`);render();};
/* ================= CARTE « MAINTENANT » PROPOSÉE (30/10) =================
   Qui agit se voit avant de lire : l'avatar de la personne qu'on attend, ou
   une icône teintée quand c'est à vous. Un titre court (la personne en
   sujet), une ligne de faits en temps relatif, les actions à droite, les
   gestes rares dans « ⋯ », la frise des étapes du contrat. */
I.todo='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h10M10 5l5 5-5 5"/></svg>';
I.done='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>';
I.off='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M6 10h8"/></svg>';

const ago=iso=>{const n=-daysFrom(iso);return n<=0?"aujourd'hui":n===1?"hier":`il y a ${n} jours`;};
const sep='<span class="sep" aria-hidden="true">·</span>';
const moreMenu=items=>items.length?`<details class="more"><summary aria-label="Plus d'actions">${I.dots}</summary><div class="menu">${items.join("")}</div></details>`:"";
const late=k=>k.due&&k.due<=TODAY&&!["signed","terminated"].includes(k.state);

/* The contract's road: where it stands, without a sentence. */
function contractSteps(k){
  const order=["draft","in_review","approved","sent","returned","signed"];
  const at=k.state==="terminated"?order.length:order.indexOf(k.state);
  const L=[["Préparation",0],["Validation",1],["Envoi",2],[`Signature de ${signer(k)?signer(k).name:"la partie"}`,3],["Signature PDS",4]];
  return `<ol class="steps" aria-label="Étapes du contrat">${L.map(([l,i])=>{const st=i<at?"done":i===at?"cur":"";return `<li class="${st}"><span class="dot" aria-hidden="true"></span>${esc(l)}</li>`;}).join("")}</ol>`;
}

function newNowCard({mine,who,icon,iconTone="",eyebrow,title,meta=[],quote,actions="",more=[],extra="",steps="",flash}){
  const lead=who?avatar(who):`<span class="nicon ${iconTone}">${icon||I.todo}</span>`;
  return `<section class="now2 ${mine?"mine":""}" aria-label="Maintenant"><div class="lead">${lead}</div>
  <div class="body"><div class="top"><div class="tt">${eyebrow?`<span class="eb">${eyebrow}</span>`:""}<h2>${title}</h2></div><div class="acts">${actions}${moreMenu(more)}</div></div>
  ${meta.length?`<p class="meta">${meta.filter(Boolean).join(sep)}</p>`:""}${quote||""}${steps}
  ${flash?`<div class="banner" role="status">${I.check}<span>${flash}</span></div>`:""}</div>${extra}</section>`;
}

function contractNow(k){
  const todo=contractTodo(k),wait=contractWait(k),flash=S.flash,steps=contractSteps(k);
  const due=k.due?`échéance ${fmtDay(k.due)}`:null,lateBadge=late(k)?badge("t-danger","Échéance passée"):"";
  const last=k.journal[k.journal.length-1];
  if(k.state==="in_review"){
    const fix=S.ctx.fix?`<div class="fix">${fld("fix-note","Ce qui doit changer, et pourquoi",`<textarea></textarea>`,"Il revient en tête du contrat, chez le responsable.",true)}<div class="acts-row">${btn("Envoyer la demande","fixSend",`data-id="${k.id}"`)}${btn("Annuler","fixCancel","","ghost")}</div></div>`:"";
    if(todo)return newNowCard({mine:true,title:"Validez le contrat",meta:[`soumis par ${esc(k.owner)} ${ago(last.on)}`,due,lateBadge],
      actions:S.ctx.fix?"":`${btn("Valider","validateC",`data-id="${k.id}"`)}${btn("Demander des modifications","fixOpen","","outline")}`,extra:fix,steps,flash});
    return newNowCard({who:"Claire Morel",title:"Claire Morel doit valider le contrat",meta:[`soumis ${ago(last.on)}`,due,lateBadge],steps,flash});
  }
  if(k.state==="draft"){
    const r=k.review&&k.review.comment;
    const quote=r?`<p class="quote">« ${esc(r)} »</p>`:"";
    if(todo)return newNowCard({mine:true,title:r?"Reprenez le contrat, puis soumettez-le à nouveau":"Soumettez le contrat à la direction",
      meta:[r?`modifications demandées par ${esc(k.review.by)} ${ago(k.review.on)}`:null,due,lateBadge],quote,
      actions:btn("Soumettre à la direction","submitC",`data-id="${k.id}"`)+btn("Modifier une clause","open",`data-m="clause" data-id="${k.id}"`,"outline"),steps,flash});
    return newNowCard({who:k.owner,title:`${esc(k.owner)} prépare le contrat`,meta:[r?"modifications demandées":null,due,lateBadge],quote,steps,flash});
  }
  if(k.state==="approved"){
    const c=signer(k);
    if(todo)return newNowCard({mine:true,title:"Envoyez le contrat pour signature",meta:[k.review&&k.review.on?`validé par Claire Morel ${ago(k.review.on)}`:"validé par Claire Morel",`à ${esc(c.name)}`,due,lateBadge],
      actions:btn("Envoyer pour signature","open",`data-m="sendC" data-id="${k.id}"`),steps,flash});
    return newNowCard({who:k.owner,title:`${esc(k.owner)} doit envoyer le contrat`,meta:[k.review&&k.review.on?`validé ${ago(k.review.on)}`:"validé",due,lateBadge],steps,flash});
  }
  if(k.state==="sent"){
    const c=signer(k),rel=k.relances.length?`relancé ${ago(k.relances[k.relances.length-1].on)}`:null;
    return newNowCard({who:c.name,title:`${esc(c.name)} doit signer le contrat`,
      meta:[`envoyé ${ago(k.sentOn)} par ${esc(k.sentBy)}`,k.openedOn?`ouvert ${ago(k.openedOn)}`:"pas encore ouvert",rel,due,lateBadge],
      actions:isOwner(k)?btn("Relancer","open",`data-m="relance" data-w="w-${k.id}-${wait.contact}"`,"outline"):"",
      more:[`<button type="button" data-act="copyLink">Copier son lien privé</button>`,`<button type="button" data-act="noop">Le contrat est revenu signé autrement</button>`],
      extra:`<div class="fix"><div><button class="btn" type="button" data-act="returnSigned" data-id="${k.id}" style="background:var(--glass);color:var(--glass-fg)">Proto : faire revenir le contrat signé</button></div></div>`,steps,flash});
  }
  if(k.state==="returned"){
    const c=signer(k);
    if(todo)return newNowCard({mine:true,title:"Signez le contrat pour PDS",meta:[`signé par ${esc(c.name)} ${ago(k.returnedOn||TODAY)}, par son lien privé`,due,lateBadge],
      actions:btn("Signer pour PDS","open",`data-m="countersign" data-id="${k.id}"`),steps,flash});
    return newNowCard({who:"Claire Morel",title:"Claire Morel doit signer pour PDS",meta:[`signé par ${esc(c.name)} ${ago(k.returnedOn||TODAY)}`],steps,flash});
  }
  if(k.state==="signed")return newNowCard({icon:I.done,iconTone:"ok",title:`Signé le ${fmtDay(k.signedOn)}`,
    meta:[k.end?`court jusqu'au ${fmtDay(k.end)}`:null,k.pdsSignedBy?`signé pour PDS par ${esc(k.pdsSignedBy)}`:null],more:[`<button type="button" data-act="noop">Résilier le contrat</button>`],flash});
  return newNowCard({icon:I.off,iconTone:"neutral",title:"Résilié",meta:[k.journal.length?`le ${fmtDay(last.on)} par ${esc(last.by)}`:null],flash});
}

/* The contract page with the chosen card; the old one stays to compare. */
const oldContractRender=PAGES.contract.render;
PAGES.contract.render=function(){
  const html=oldContractRender();
  if(S.cardStyle==="old")return html;
  const k=ctr(S.id);
  return html.replace(/<div class="callout bad"><b>Modifications demandées<\/b>[\s\S]*?<\/div>/,"")
    .replace(/<section class="now" aria-label="Maintenant">[\s\S]*?<\/section>/,contractNow(k));
};

document.getElementById("roleSel").addEventListener("change",e=>{S.role=e.target.value;S.flash=null;closeModal();render();});
document.getElementById("pageSel").addEventListener("change",e=>go(e.target.value));
document.getElementById("resetBtn").addEventListener("click",()=>{const st=S.cardStyle;S=fresh();S.cardStyle=st;S.page="contract";S.id=document.getElementById("ctrSel").value;render();});
document.getElementById("ctrSel").addEventListener("change",e=>go("contract",e.target.value));
document.getElementById("cardSel").addEventListener("change",e=>{S.cardStyle=e.target.value;render();});
S=fresh();S.page="contract";S.id="k2";render();
})();
</script>
