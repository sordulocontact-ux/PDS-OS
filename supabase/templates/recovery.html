<!--
  "Reset password" template. Locally wired in supabase/config.toml; in
  production paste it in Supabase: Authentication > Email Templates.
  Subject: Réinitialisez votre mot de passe — PDS OS
-->
<div
  style="
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    color: #171717;
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 24px;
  "
>
  <p style="font-size: 16px; font-weight: 600; margin: 0 0 24px">PDS OS</p>
  <p style="font-size: 14px; line-height: 20px; margin: 0 0 16px">Bonjour,</p>
  <p style="font-size: 14px; line-height: 20px; margin: 0 0 24px">
    Une réinitialisation du mot de passe de votre compte PDS OS a été demandée.
    Cliquez sur le bouton ci-dessous pour en choisir un nouveau.
  </p>
  <p style="margin: 0 0 24px">
    <a
      href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery"
      style="
        display: inline-block;
        background: #171717;
        color: #fafafa;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        padding: 10px 18px;
        border-radius: 8px;
      "
    >
      Choisir un nouveau mot de passe
    </a>
  </p>
  <p style="font-size: 13px; line-height: 18px; color: #525252; margin: 0">
    Si vous n'avez rien demandé, ignorez cet email : votre mot de passe reste
    inchangé.
  </p>
</div>
